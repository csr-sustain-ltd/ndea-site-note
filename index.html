<!-- Build stamp. INCREMENT THIS ON EVERY DEPLOYMENT (YYYY-MM-DD-NN).
     The freshness check below reads it, so it lives in exactly one place. -->
<meta name="build-version" content="2026-09-29-02">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<!-- Freshness check. Runs early so a visitor on a stale GitHub Pages copy is
     moved to the current build before they start typing. Never blocks the
     page: any failure here leaves the form working exactly as-is. -->
<script>
(function(){
  "use strict";
  var meta = document.querySelector('meta[name="build-version"]');
  var BUILD_VERSION = meta ? meta.getAttribute("content") : null;

  // Clear any service worker / Cache Storage left by an older deployment.
  try {
    if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        regs.forEach(function(r){ r.unregister(); });
      })["catch"](function(){});
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function(keys){
        keys.forEach(function(k){ caches["delete"](k); });
      })["catch"](function(){});
    }
  } catch(e) {}

  function formHasAnswers(){
    try {
      var f = document.querySelectorAll("input, select, textarea");
      for (var i = 0; i < f.length; i++) {
        var n = f[i];
        if (n.type === "checkbox" || n.type === "radio") { if (n.checked) return true; }
        else if (n.value && n.value.trim() !== "") return true;
      }
    } catch(e) {}
    return false;
  }

  function goToLatest(v){
    location.replace(location.pathname + "?v=" + encodeURIComponent(v));
  }

  function showUpdateBanner(v){
    if (document.getElementById("update-banner")) return;
    var bar = document.createElement("div");
    bar.id = "update-banner";
    bar.className = "update-banner";
    var txt = document.createElement("span");
    txt.textContent = "A newer version of this form is available. Reloading will clear anything you have entered.";
    var btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "Reload now";
    btn.onclick = function(){ goToLatest(v); };
    var dismiss = document.createElement("button");
    dismiss.type = "button";
    dismiss.textContent = "Not now";
    dismiss.onclick = function(){ bar.remove(); };
    bar.appendChild(txt); bar.appendChild(btn); bar.appendChild(dismiss);
    document.body.appendChild(bar);
  }

  function checkFreshness(){
    if (!window.fetch || !BUILD_VERSION) return;
    fetch(location.pathname + "?_freshness=" + Date.now(),
          { cache: "no-store", credentials: "same-origin" })
      .then(function(res){ return res.ok ? res.text() : null; })
      .then(function(body){
        if (!body) return;
        var m = body.match(/name="build-version"\s+content="([^"]+)"/);
        if (!m) return;
        var live = m[1];
        if (live === BUILD_VERSION) return;
        if (formHasAnswers()) { showUpdateBanner(live); return; }
        var key = "sitenote-reloaded-for";
        try {
          if (sessionStorage.getItem(key) === live) { showUpdateBanner(live); return; }
          sessionStorage.setItem(key, live);
        } catch(e) {}
        goToLatest(live);
      })["catch"](function(){});
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", checkFreshness);
  } else { checkFreshness(); }
})();
</script>

<style>
/* ============================================================================
   CSR SUSTAIN - SITE NOTE
   Visual language matched to the DEC AR Questionnaire (csrsustain.github.io).
   Palette, typography, radii and spacing are deliberately identical so the two
   forms read as one family of documents.
   ============================================================================ */

:root{
  /* --- Shared with the DEC questionnaire --- */
  --primary-color:#2D6A6A;
  --primary-hover:#1F4A4A;
  --secondary-color:#7FE5C9;
  --light-bg:#F8FAFC;
  --text-color:#1E293B;
  --border-color:#E2E8F0;
  --white:#FFFFFF;
  --disabled-grey:#94A3B8;

  /* --- Site-note additions, derived from the same palette --- */
  --primary-soft:#EAF3F1;
  --muted:#64748B;
  --field-bg:#FCFDFE;
  --hover-bg:#F1F5F9;
  --required:#EF4444;
  --success:#059669;
  --success-soft:#A7F3D0;

  /* --- Legacy aliases. A handful of inline styles further down the file still
         reference the previous drafting-table palette. Mapping them here keeps
         those elements on-brand without hunting through the script. --- */
  --mono:'Segoe UI', system-ui, -apple-system, sans-serif;
  --steel-dark:#2D6A6A;
  --graphite-700:#334155;
  --amber:#B45309;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
  background-color:var(--light-bg);
  color:var(--text-color);
  font-size:14px;
  line-height:1.5;
  padding:40px 20px 120px;
}

/* Everything except the fixed action bar lives inside this shell so the page
   matches the DEC questionnaire's single floating card. */
.shell{
  width:100%;
  max-width:1050px;
  margin:0 auto;
  background:var(--white);
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.04);
  overflow:hidden;
}

/* ---------- Header ---------- */
.titleblock{
  background-color:var(--primary-color);
  color:var(--white);
  padding:30px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:24px;
  border-bottom:4px solid var(--secondary-color);
  flex-wrap:wrap;
}
.titleblock h1{
  margin:0 0 5px 0;
  font-size:24px;
  font-weight:600;
  letter-spacing:-0.5px;
}
.titleblock .sub{
  margin:0;
  color:#E2E8F0;
  font-size:14px;
  opacity:.9;
}
/* Reverse (white) logo artwork sits directly on the dark teal header.
   Deliberately NO white panel - white-on-white would be invisible. */
.site-logo{
  display:block;
  height:42px;
  width:auto;
  flex-shrink:0;
}
@media(max-width:760px){
  body{padding:16px 10px 130px;}
  .titleblock{flex-direction:column;align-items:flex-start;padding:24px 20px;}
  .site-logo{height:32px;}
}

/* ---------- Tab navigation ---------- */
.tabs{
  display:flex;
  background:#F1F5F9;
  border-bottom:1px solid var(--border-color);
  overflow-x:auto;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{
  flex:1;
  min-width:140px;
  padding:15px 12px;
  background:none;
  border:none;
  border-bottom:3px solid transparent;
  font-family:inherit;
  font-size:13px;
  font-weight:600;
  color:var(--disabled-grey);
  text-align:center;
  white-space:nowrap;
  cursor:pointer;
  transition:all .2s ease;
}
.tab-btn:hover{color:var(--primary-hover);background:#E8EEF2;}
.tab-btn.active{
  color:var(--primary-color);
  border-bottom-color:var(--primary-color);
  background-color:var(--white);
}

/* ---------- Layout ---------- */
.wrap{padding:34px 40px 40px;}
@media(max-width:760px){.wrap{padding:22px 18px 28px;}}
.panel{display:none;}
.panel.active{display:block;animation:fadeIn .3s ease;}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(4px);}
  to{opacity:1;transform:translateY(0);}
}

/* ---------- Section cards ---------- */
.section{
  background:var(--white);
  border:1px solid var(--border-color);
  border-radius:12px;
  margin-bottom:24px;
  overflow:hidden;
}
.section-head{
  background:var(--primary-soft);
  color:var(--primary-color);
  border-bottom:1px solid var(--border-color);
  padding:14px 20px;
  font-size:15px;
  font-weight:600;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}
.section-body{padding:22px 20px;}

/* ---------- Convention chips ---------- */
.conv{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.conv-label{
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.6px;
  text-transform:uppercase;
  color:var(--muted);
  margin-right:2px;
}
.conv-chip{
  font-family:inherit;
  font-size:12px;
  font-weight:600;
  color:var(--primary-color);
  background:var(--white);
  border:1px solid #BBD5D0;
  border-radius:999px;
  padding:3px 11px;
  cursor:pointer;
  transition:all .15s ease;
  white-space:nowrap;
}
.conv-chip:hover,.conv-chip:focus-visible{
  background:var(--primary-color);
  border-color:var(--primary-color);
  color:var(--white);
  outline:none;
}
.conv-chip.is-open{
  background:var(--primary-color);
  border-color:var(--primary-color);
  color:var(--white);
}
.conv-note{
  font-size:11.5px;
  color:var(--muted);
  font-style:italic;
  font-weight:400;
}

/* ---------- Form grid ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.grid1{display:grid;grid-template-columns:1fr;gap:20px;}
@media(max-width:760px){.grid2{grid-template-columns:1fr;}}

.field{display:flex;flex-direction:column;gap:8px;}
.field label{
  display:block;
  font-weight:500;
  font-size:14px;
  color:#334155;
  margin:0;
}
.field label .req{color:var(--required);margin-left:2px;}
.field input[type=text],
.field input[type=email],
.field input[type=date],
.field input[type=number],
.field select,
.field textarea{
  width:100%;
  padding:12px 16px;
  border:1px solid var(--border-color);
  border-radius:8px;
  font-family:inherit;
  font-size:14px;
  color:var(--text-color);
  background-color:var(--field-bg);
  transition:all .2s ease;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;
  border-color:var(--primary-color);
  background-color:var(--white);
  box-shadow:0 0 0 3px rgba(45,106,106,.1);
}
.field.required input,
.field.required select{
  border-color:#F3C3C3;
  background-color:#FFFBFB;
}
.field.required input:focus,
.field.required select:focus{
  border-color:var(--primary-color);
  background-color:var(--white);
}
.field textarea{resize:vertical;min-height:88px;}
.field .hint{font-size:12.5px;color:var(--muted);}

/* ---------- Radio / checkbox groups ---------- */
.radiogroup{display:flex;gap:10px;flex-wrap:wrap;}
.radiogroup label{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  border:1px solid var(--border-color);
  border-radius:8px;
  background-color:var(--field-bg);
  font-size:14px;font-weight:400;
  color:var(--text-color);
  cursor:pointer;
  transition:all .2s ease;
}
.radiogroup label:hover{background-color:var(--hover-bg);border-color:#CBD5E1;}
.radiogroup input{width:18px;height:18px;accent-color:var(--primary-color);margin:0;cursor:pointer;}

/* ---------- Repeatable table-style rows ---------- */
.rowtable{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:2px;}
.rowtable th{
  font-size:12px;
  font-weight:600;
  color:#334155;
  text-align:left;
  padding:0 8px 6px;
  border-bottom:1px solid var(--border-color);
}
.rowtable td{padding:0 6px;vertical-align:top;}
.rowtable input,.rowtable select{
  width:100%;
  font-family:inherit;
  font-size:13.5px;
  padding:9px 11px;
  border:1px solid var(--border-color);
  border-radius:8px;
  background-color:var(--field-bg);
  color:var(--text-color);
  transition:all .2s ease;
}
.rowtable input:focus,.rowtable select:focus{
  outline:none;
  border-color:var(--primary-color);
  background-color:var(--white);
  box-shadow:0 0 0 3px rgba(45,106,106,.1);
}
.rowtable .del-btn{
  background:none;border:none;color:var(--disabled-grey);
  cursor:pointer;font-size:16px;line-height:1;padding:8px 4px;
  border-radius:6px;transition:all .2s ease;
}
.rowtable .del-btn:hover{color:#DC2626;background:#FEF2F2;}
.add-row-btn{
  margin-top:12px;
  font-family:inherit;
  font-size:14px;
  font-weight:600;
  background-color:var(--primary-soft);
  color:var(--primary-color);
  border:1px solid #BBD5D0;
  border-radius:8px;
  padding:11px 20px;
  cursor:pointer;
  transition:all .2s ease;
}
.add-row-btn:hover{background-color:var(--primary-color);color:var(--white);border-color:var(--primary-color);}

/* Horizontal scroll rather than a squashed table on narrow screens */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.table-scroll .rowtable{min-width:620px;}

/* ---------- Checklist grids ---------- */
.photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px;}
@media(max-width:900px){.photogrid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.photogrid{grid-template-columns:1fr;}}
.photoitem{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;
  border:1px solid var(--border-color);
  border-radius:8px;
  background-color:var(--field-bg);
  font-size:14px;
  cursor:pointer;
  transition:all .2s ease;
}
.photoitem:hover{background-color:var(--hover-bg);border-color:#CBD5E1;}
.photoitem input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary-color);margin:0;cursor:pointer;flex-shrink:0;}
.photoitem label{flex:1;cursor:pointer;margin:0;font-weight:400;}

/* ---------- Convention reference list ---------- */
.convlist{display:flex;flex-direction:column;gap:8px;}
.convrow{
  display:grid;
  grid-template-columns:64px 1fr;
  gap:14px;align-items:center;
  padding:11px 14px;
  border:1px solid var(--border-color);
  border-radius:8px;
  background-color:var(--field-bg);
  cursor:pointer;
  text-align:left;
  font-family:inherit;
  transition:all .2s ease;
}
.convrow:hover{background-color:var(--primary-soft);border-color:#BBD5D0;}
.convrow .num{font-size:13px;font-weight:700;color:var(--primary-color);}
.convrow .desc{font-size:14px;color:#334155;}
.convrow.withdrawn .desc{color:var(--muted);font-style:italic;}

/* ---------- Convention drawer (right-hand slide-out) ---------- */
.conv-scrim{
  position:fixed;inset:0;
  background-color:rgba(15,23,42,.45);
  opacity:0;visibility:hidden;
  transition:opacity .25s ease,visibility .25s ease;
  z-index:900;
}
.conv-scrim.open{opacity:1;visibility:visible;}

.conv-drawer{
  position:fixed;top:0;right:0;bottom:0;
  width:480px;max-width:92vw;
  background:var(--white);
  box-shadow:-12px 0 34px rgba(15,23,42,.16);
  transform:translateX(100%);
  transition:transform .28s cubic-bezier(.32,.72,.35,1);
  z-index:901;
  display:flex;flex-direction:column;
}
.conv-drawer.open{transform:translateX(0);}

.conv-drawer-head{
  background-color:var(--primary-color);
  color:var(--white);
  border-bottom:4px solid var(--secondary-color);
  padding:22px 26px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
  flex-shrink:0;
}
.conv-drawer-head .cd-num{
  font-size:12px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:var(--secondary-color);
  margin-bottom:5px;
}
.conv-drawer-head h3{margin:0;font-size:18px;font-weight:600;line-height:1.35;}
.conv-drawer-head .cd-date{
  font-size:12px;color:#CBD5E1;margin-top:7px;
}
.conv-drawer-close{
  flex-shrink:0;
  width:32px;height:32px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.35);
  background:transparent;
  color:var(--white);
  font-size:19px;line-height:1;
  cursor:pointer;
  transition:all .2s ease;
}
.conv-drawer-close:hover{background:rgba(255,255,255,.16);}

.conv-drawer-body{
  padding:24px 26px 30px;
  overflow-y:auto;
  flex:1;
}
.conv-drawer-body .cd-cat{
  font-size:12px;font-weight:600;
  color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px;
  padding-bottom:14px;margin-bottom:18px;
  border-bottom:1px solid var(--border-color);
}
.conv-drawer-body dl{margin:0;}
.conv-drawer-body dt{
  font-weight:600;font-size:14px;
  color:var(--primary-color);
  margin-top:20px;
}
.conv-drawer-body dt:first-of-type{margin-top:0;}
.conv-drawer-body dd{
  margin:6px 0 0 0;
  font-size:14px;color:#334155;line-height:1.6;
}
.conv-drawer-body dd strong{color:var(--text-color);}

.conv-drawer-foot{
  flex-shrink:0;
  border-top:1px solid var(--border-color);
  background-color:var(--light-bg);

  border-top:1px solid var(--border-color);
}
.conv-drawer-related .rel-label{
  font-size:12px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;
}

@media(max-width:560px){
  .conv-drawer{width:100%;max-width:100%;}
  .conv-drawer-head{padding:18px 20px;}
  .conv-drawer-body{padding:20px;}

  position:absolute;left:-9999px;top:0;
  width:780px;
  background:#fff;
  color:#1E293B;
  font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
  padding:40px 46px;
}
#print-sheet h1{
  font-size:21px;font-weight:600;
  border-bottom:3px solid #2D6A6A;padding-bottom:10px;margin:0 0 4px;
  color:#2D6A6A;
}
#print-sheet .ps-sub{font-size:11.5px;color:#64748B;margin-bottom:22px;}
#print-sheet h2{
  font-size:13px;text-transform:uppercase;letter-spacing:.4px;
  background:#2D6A6A;color:#fff;padding:7px 11px;margin:24px 0 9px;
  border-radius:4px;
}
#print-sheet h2 .pc{font-size:9.5px;color:#BFE8DC;font-weight:400;margin-left:8px;text-transform:none;letter-spacing:0;}
#print-sheet table{width:100%;border-collapse:collapse;margin-bottom:6px;font-size:11.5px;}
#print-sheet table th{
  background:#EAF3F1;text-align:left;padding:6px 8px;font-size:10px;
  text-transform:uppercase;color:#2D6A6A;border:1px solid #D6E3E0;
}
#print-sheet table td{padding:6px 8px;border:1px solid #D6E3E0;vertical-align:top;}
#print-sheet .kvrow{display:grid;grid-template-columns:160px 1fr 160px 1fr;font-size:11.5px;border-bottom:1px solid #EEF2F5;padding:4px 0;}
#print-sheet .kvrow .k{font-weight:600;color:#334155;}
#print-sheet .notesblock{font-size:11.5px;white-space:pre-wrap;padding:6px 0;border-bottom:1px solid #EEF2F5;}
#print-sheet .notesblock .k{font-weight:600;color:#334155;display:block;margin-bottom:3px;}
#print-sheet .sign{margin-top:32px;display:grid;grid-template-columns:1fr 1fr;gap:30px;}
#print-sheet .sign div{border-top:1px solid #94A3B8;padding-top:6px;font-size:11px;color:#64748B;}


/* ---------- Previous EPC check ---------- */
.epc-status{font-size:12.5px;color:var(--muted);}
.epc-status.busy{color:var(--primary-color);}
.epc-status.warn{color:var(--amber);}
.epc-status.err{color:var(--required);}
.epc-cands{display:flex;flex-direction:column;gap:6px;margin:10px 0 6px;}
.epc-cand{padding:9px 12px;border:1px solid var(--border-color);border-radius:10px;background:var(--field-bg);cursor:pointer;}
.epc-cand:hover{background:var(--hover-bg);}
.epc-cand:focus{outline:2px solid var(--primary-color);outline-offset:1px;}
.epc-cand.sel{border-color:var(--primary-color);background:var(--primary-soft);}
.epc-cand .a{font-weight:600;font-size:13.5px;}
.epc-cand .m{font-size:12.5px;color:var(--muted);margin-top:2px;}
.epc-badge{margin-left:8px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--primary-soft);color:var(--primary-color);border:1px solid var(--primary-color);}
.epc-sub{margin:20px 0 8px;font-size:13px;font-weight:700;color:var(--primary-color);text-transform:uppercase;letter-spacing:.3px;}
.epc-sub2{font-size:13px;font-weight:600;margin-bottom:6px;}
table.epc-cmp{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
table.epc-cmp th{background:var(--light-bg);text-align:left;padding:7px 10px;border:1px solid var(--border-color);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
table.epc-cmp td{padding:7px 10px;border:1px solid var(--border-color);vertical-align:top;}
table.epc-cmp td:first-child{font-weight:600;width:170px;}
.epc-flag{color:var(--amber);font-weight:600;}
.epc-banner{padding:10px 14px;border-radius:10px;font-size:13.5px;margin:6px 0 12px;border:1px solid;}
.epc-banner.ok{background:#ECFDF5;border-color:#A7F3D0;color:#065F46;}
.epc-banner.review{background:#FFFBEB;border-color:#FDE68A;color:#92400E;}
.epc-banner.investigate{background:#FEF2F2;border-color:#FECACA;color:#991B1B;}
.epc-banner.none{background:var(--light-bg);border-color:var(--border-color);color:var(--muted);}
input.epc-masked{color:transparent !important;text-shadow:0 0 9px rgba(30,41,59,.65);user-select:none;}

</style>
</head>

function el(tag, attrs={}, ...children){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==="class") e.className=v;
    else if(k==="html") e.innerHTML=v;
    else e.setAttribute(k,v);
  }
  children.forEach(c=>{ if(typeof c==="string") e.appendChild(document.createTextNode(c)); else if(c) e.appendChild(c); });
  return e;
}

function field(labelText, inputEl, required=false, hint=null){

/* Turns a convention spec string such as
   "3.02 · 3.07 · 6.13"  or  "7.01–7.06"  or
   "3.07 — doors >50% glazed count as glazing"
   into a list of convention numbers plus any trailing plain-English note. */
function parseConvSpec(spec){
  const nums = [];
  let note = "";
  String(spec).split("·").forEach(part=>{
    const t = part.trim();
    if(!t) return;
    const range = t.match(/^(\d+)\.(\d{2})\s*[–—-]\s*(\d+)\.(\d{2})$/);
    if(range && range[1] === range[3]){
      for(let n = parseInt(range[2],10); n <= parseInt(range[4],10); n++){
        nums.push(range[1] + "." + String(n).padStart(2,"0"));
      }
      return;
    }
    const m = t.match(/^(\d+\.\d{2})/);
    if(m){
      nums.push(m[1]);
      const rest = t.slice(m[1].length).replace(/^\s*[–—-]\s*/,"").trim();
      if(rest) note = note ? note + " " + rest : rest;
    } else {
      note = note ? note + " " + t : t;
    }
  });
  return {nums, note};
}

/* A single clickable convention pill. */
function convChip(num, siblings){
  const rec = CONV_DATA[num];
  const b = el("button",{
    type:"button",
    class:"conv-chip",
    "data-conv":num,
    title: rec ? rec.title : "Convention " + num
  });
  b.textContent = num;
  b.addEventListener("click", ()=> openConvDrawer(num, siblings || []));
  return b;
}

function section(title, conv, bodyEl){
  const sec = el("div",{class:"section"});
  const head = el("div",{class:"section-head"}, el("span",{},title));
  if(conv){
    const {nums, note} = parseConvSpec(conv);
    const box = el("div",{class:"conv"});
    if(nums.length) box.appendChild(el("span",{class:"conv-label"},"Conventions"));
    nums.forEach(n=> box.appendChild(convChip(n, nums)));
    if(note) box.appendChild(el("span",{class:"conv-note"},note));
    head.appendChild(box);
  }
  sec.appendChild(head);
  const body = el("div",{class:"section-body"});
  body.appendChild(bodyEl);
  sec.appendChild(body);
  return sec;
}

/* ============================================================================
   PREVIOUS EPC CHECK
   Looks up earlier non-domestic EPCs for the postcode (via the proxy Worker),
   lets the assessor confirm the matching address, then compares this survey's
   floor area / fuel / rating with the previous certificate and records the
   reason for any material difference. With no proxy configured the same
   fields work as manual entry.
   ============================================================================ */
const EPC_POSTCODE_RE = /^[A-Z]{1,2}\d[A-Z\d]?\s?\d[A-Z]{2}$/;
const EPC_BAND_ORDER = ["A+","A","B","C","D","E","F","G"];
const EPC_STOP_WORDS = new Set(["the","and","of","ltd","limited","plc"]);
const EPC_REASONS = [
  "Floor area / zoning differs from previous EPC",
  "Building use / activity types differ",
  "Fabric changes (glazing, insulation, extension)",
  "Heating / cooling system or fuel changed",
  "Lighting upgraded",
  "Renewables added or removed (PV, solar thermal)",
  "Previous EPC likely used default / unverified inputs",
  "Different building part or scope from previous EPC",
  "Different NCM / SBEM version or convention issue",
  "Previous EPC appears to contain an error",
  "Other (explain below)"
];
const EPC_RECHECK = [
  "Total floor area and zone areas",
  "Building use / NCM activity assignments",
  "Heating, cooling and DHW - fuel, efficiency, controls",
  "Glazing areas / U-values and fabric constructions",
  "Lighting - lamp type, controls, lux where applicable",
  "Air permeability and ventilation assumptions",
  "Renewables and any on-site generation entered",
  "Conventions applied as per the Conventions tab"
];
const epcState = { candidates:[], selectedKey:null, fetchedFor:"", retrievedAt:null, dataAsOf:"", meta:null, source:"", edited:false, showAll:false, extra:null };

function epcBand(r){
  if(r===null||r===undefined||isNaN(r)) return "";
  if(r<0) return "A+";
  if(r<=25) return "A"; if(r<=50) return "B"; if(r<=75) return "C";
  if(r<=100) return "D"; if(r<=125) return "E"; if(r<=150) return "F";
  return "G";
}
function epcNum(id){ const v = parseFloat(val(id)); return isNaN(v) ? null : v; }
function epcFmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}
function epcValidUntil(iso){
  if(!iso) return null;
  const d = new Date(iso);
  if(isNaN(d)) return null;
  d.setFullYear(d.getFullYear()+EPC_CONFIG.EPC_VALIDITY_YEARS);
  return d;
}
function epcTokens(s){
  return String(s||"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").split(/\s+/).filter(t=>t && !EPC_STOP_WORDS.has(t));
}
function epcMasked(){
  return EPC_CONFIG.HIDE_PREVIOUS_RATING_UNTIL_ENTERED && epcNum("epc_new_rating")===null;
}
function epcSetStatus(msg, kind){
  const s = document.getElementById("epc_status");
  if(!s) return;
  s.textContent = msg;
  s.className = "epc-status "+(kind||"");
}

/* ---------- lookup ---------- */
let epcDebounce = null;
function epcOnPostcodeInput(raw){
  const pc = String(raw||"").trim().toUpperCase().replace(/\s+/g," ");
  clearTimeout(epcDebounce);
  if(!EPC_POSTCODE_RE.test(pc)) return;
  epcDebounce = setTimeout(()=> epcSearch(pc,false), 700);
}

async function epcFetchResults(pc){
  /* Returns {results, retrieved, dataAsOf}. Uses the Worker if PROXY_URL is set,
     otherwise the pre-built district files in DATA_URL. */
  if(EPC_CONFIG.PROXY_URL){
    const r = await fetch(EPC_CONFIG.PROXY_URL.replace(/\/+$/,"")+"/search?postcode="+encodeURIComponent(pc), {headers:{Accept:"application/json"}});
    const j = await r.json().catch(()=>({}));
    if(!r.ok || !j.ok) throw new Error(j.error || ("HTTP "+r.status));
    return {results:j.results||[], retrieved:j.retrieved ? new Date(j.retrieved) : new Date(), dataAsOf:""};
  }
  const base = EPC_CONFIG.DATA_URL.replace(/\/+$/,"");
  const district = pc.split(" ")[0];
  if(!epcState.meta){
    try{
      const m = await fetch(base+"/_meta.json");
      epcState.meta = m.ok ? await m.json() : {};
    }catch(e){ epcState.meta = {}; }
  }
  let r;
  try{ r = await fetch(base+"/"+encodeURIComponent(district)+".json"); }
  catch(e){ throw new Error("could not load the EPC data files - open the site note from its web address, not as a file on your computer"); }
  if(r.status===404) return {results:[], retrieved:new Date(), dataAsOf:(epcState.meta||{}).newestLodgement||""};
  if(!r.ok) throw new Error("HTTP "+r.status+" loading "+district+".json");
  const j = await r.json();
  const all = j.results||[];
  const norm = s=>String(s).replace(/\s+/g,"");
  return {results: all.filter(c=>norm(c.postcode)===norm(pc)), retrieved:new Date(), dataAsOf:(epcState.meta||{}).newestLodgement||""};
}

async function epcSearch(pc, force){
  if(!EPC_CONFIG.PROXY_URL && !EPC_CONFIG.DATA_URL){
    epcSetStatus("Automatic lookup is not switched on for this form - enter the previous EPC details manually below.","warn");
    return;
  }
  if(epcState.fetchedFor===pc && !force) return;
  epcSetStatus("Searching the EPC Register data for "+pc+"…","busy");
  try{
    const res = await epcFetchResults(pc);
    epcState.fetchedFor = pc;
    epcState.retrievedAt = res.retrieved;
    epcState.dataAsOf = res.dataAsOf;
    epcState.candidates = epcGroup(res.results);
    epcState.showAll = false;
    const asOf = res.dataAsOf ? " (register data to "+epcFmtDate(res.dataAsOf)+")" : "";
    if(!epcState.candidates.length){
      epcSetStatus("No non-domestic EPCs found for "+pc+asOf+". If you know one exists, enter it manually below.","warn");
    } else {
      epcSetStatus(epcState.candidates.length+" property record"+(epcState.candidates.length===1?"":"s")+" found for "+pc+asOf+". Select the one that matches this building.","");
    }
    epcRerank();
  }catch(err){
    epcState.candidates = [];
    epcRenderCandidates();
    epcSetStatus("Could not retrieve EPCs ("+err.message+"). You can still enter the previous EPC details manually.","err");
  }
}

function epcGroup(results){
  const map = new Map();
  results.forEach(c=>{
    const key = c.uprn ? "u"+c.uprn : "a"+epcTokens(c.address+" "+c.postcode).join(" ");
    if(!map.has(key)) map.set(key,{key, address:c.address, postcode:c.postcode, uprn:c.uprn, certs:[]});
    map.get(key).certs.push(c);
  });
  const list = Array.from(map.values());
  list.forEach(g=>{
    g.certs.sort((a,b)=> String(b.lodgementDate||"").localeCompare(String(a.lodgementDate||"")));
    g.latest = g.certs[0];
    g.address = g.latest.address || g.address;
  });
  return list;
}

function epcRerank(){
  const pcTok = new Set(epcTokens(val("p_postcode")));
  const typed = epcTokens(val("p_address")).filter(t=>!pcTok.has(t));
  epcState.candidates.forEach(g=>{
    if(!typed.length){ g.score = 0; return; }
    const have = new Set(epcTokens(g.address));
    g.score = typed.filter(t=>have.has(t)).length / typed.length;
  });
  epcState.candidates.sort((a,b)=> (b.score-a.score) || String(a.address).localeCompare(String(b.address)));
  epcRenderCandidates();
}

function epcRenderCandidates(){
  const box = document.getElementById("epc_cands");
  if(!box) return;
  box.innerHTML = "";
  const list = epcState.candidates;
  if(!list.length) return;
  const masked = epcMasked();
  const limit = epcState.showAll ? list.length : 10;
  list.slice(0,limit).forEach((g,i)=>{
    const c = g.latest;
    const band = c.band || epcBand(c.assetRating);
    const ratingTxt = masked ? "Rating hidden until you enter yours"
      : ((band?("Band "+band):"") + (c.assetRating!==null && c.assetRating!==undefined ? " ("+c.assetRating+")" : ""));
    const meta = [
      ratingTxt,
      c.lodgementDate ? "lodged "+epcFmtDate(c.lodgementDate) : "",
      c.floorArea ? Math.round(c.floorArea).toLocaleString("en-GB")+" m²" : "",
      g.certs.length>1 ? (g.certs.length-1)+" earlier certificate"+(g.certs.length>2?"s":"") : ""
    ].filter(Boolean).join("  ·  ");
    const top = el("div",{class:"a"}, g.address || "(no address returned)");
    if(i===0 && g.score>=0.5) top.appendChild(el("span",{class:"epc-badge"},"Closest match to your address"));
    const row = el("div",{class:"epc-cand"+(g.key===epcState.selectedKey?" sel":""), role:"button", tabindex:"0"},
      el("div",{}, top, el("div",{class:"m"}, meta)));
    row.addEventListener("click", ()=> epcSelect(g.key));
    row.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); epcSelect(g.key); } });
    box.appendChild(row);
  });
  if(list.length>limit){
    const more = el("button",{class:"btn btn-secondary", type:"button", style:"align-self:flex-start;"}, "Show all "+list.length+" records");
    more.addEventListener("click", ()=>{ epcState.showAll = true; epcRenderCandidates(); });
    box.appendChild(more);
  }
}

function epcSelect(key){
  const g = epcState.candidates.find(x=>x.key===key);
  if(!g) return;
  epcState.selectedKey = key;
  epcState.source = "register";
  epcState.edited = false;
  epcState.extra = g;
  const c = g.latest;
  const set = (id,v)=>{ const e=document.getElementById(id); if(e) e.value = (v===null||v===undefined) ? "" : v; };
  set("epc_prev_addr", g.address);
  set("epc_prev_uprn", g.uprn);
  set("epc_prev_cert", c.lmk);
  set("epc_prev_rating", c.assetRating);
  set("epc_prev_date", String(c.lodgementDate||"").slice(0,10));
  set("epc_prev_area", c.floorArea);
  set("epc_prev_type", c.propertyType);
  epcRenderCandidates();
  epcRenderHistory();
  epcRefresh();
}

function epcRenderHistory(){
  const box = document.getElementById("epc_history");
  if(!box) return;
  box.innerHTML = "";
  const g = epcState.extra;
  if(!g || g.certs.length<2 || epcState.source!=="register") return;
  const masked = epcMasked();
  let h = '<div class="hint" style="margin:6px 0;">All certificates found for this property (newest first). The newest is used above.</div>'
        + '<table class="epc-cmp"><tr><th>Lodged</th><th>Rating</th><th>Floor area (m²)</th><th>Certificate ref</th></tr>';
  g.certs.forEach(c=>{
    const band = c.band || epcBand(c.assetRating);
    h += "<tr><td>"+escapeHtml(epcFmtDate(c.lodgementDate)||"—")+"</td><td>"
      + (masked ? "hidden" : escapeHtml(c.assetRating!==null&&c.assetRating!==undefined ? c.assetRating+(band?" ("+band+")":"") : "—"))
      + "</td><td>"+escapeHtml(c.floorArea!==null&&c.floorArea!==undefined ? Math.round(c.floorArea).toLocaleString("en-GB") : "—")
      + "</td><td>"+escapeHtml(c.lmk||"—")+"</td></tr>";
  });
  box.innerHTML = h+"</table>";
}

/* ---------- comparison logic ---------- */
function epcFuelCat(s){
  s = String(s||"").toLowerCase();
  if(!s) return "";
  if(/lpg|liquefied|propane|butane/.test(s)) return "lpg";
  if(/oil|kerosene/.test(s)) return "oil";
  if(/bio|wood|pellet/.test(s)) return "biomass";
  if(/gas/.test(s)) return "gas";
  if(/electric/.test(s)) return "electricity";
  if(/coal|anthracite|smokeless/.test(s)) return "solid fuel";
  if(/waste heat|district|heat network/.test(s)) return "heat network";
  return s;
}
function epcCurrentFuels(){
  try{
    const rows = readRowTable(hvacTable.systems);
    return Array.from(new Set(rows.map(r=>r.fuel).filter(Boolean)));
  }catch(e){ return []; }
}
function epcVariance(pR, nR){
  if(pR===null || nR===null) return null;
  const delta = nR - pR;
  const pb = epcBand(pR), nb = epcBand(nR);
  const bands = EPC_BAND_ORDER.indexOf(nb) - EPC_BAND_ORDER.indexOf(pb);
  const abs = Math.abs(delta);
  let level = "ok";
  if(abs>=EPC_CONFIG.INVESTIGATE_POINTS || Math.abs(bands)>=2) level = "investigate";
  else if(abs>=EPC_CONFIG.REVIEW_POINTS) level = "review";
  return {delta, bands, pb, nb, level};
}
function epcVarianceText(v){
  if(v.delta===0) return "This survey's rating is the same as the previous EPC (band "+v.nb+").";
  const a = Math.abs(v.delta);
  const dir = v.delta>0 ? "worse than" : "better than";
  const bandTxt = v.pb===v.nb ? "both band "+v.nb : v.pb+" → "+v.nb;
  return "This survey's rating is "+a+" point"+(a===1?"":"s")+" "+dir+" the previous EPC ("+bandTxt+").";
}
const EPC_LEVEL_LABEL = {
  ok: "Consistent with previous EPC",
  review: "Review recommended",
  investigate: "Significant difference - double-check before finalising"
};
function epcInputFlags(){
  const out = {areaPct:null, areaFlag:"", fuelFlag:"", fuels:epcCurrentFuels()};
  const pA = epcNum("epc_prev_area"), nA = epcNum("epc_new_area");
  if(pA && nA){
    out.areaPct = (nA-pA)/pA*100;
    if(Math.abs(out.areaPct) > EPC_CONFIG.FLOOR_AREA_TOLERANCE_PCT)
      out.areaFlag = "Floor area differs by "+(out.areaPct>0?"+":"")+out.areaPct.toFixed(1)+"% from the previous EPC.";
  }
  return out;
}

function epcApplyMask(){
  ["epc_prev_rating","epc_prev_band"].forEach(id=>{
    const inp = document.getElementById(id);
    if(inp) inp.classList.toggle("epc-masked", epcMasked());
  });
  const pb = document.getElementById("epc_prev_band"), nb = document.getElementById("epc_new_band");
  if(pb) pb.value = epcBand(epcNum("epc_prev_rating"));
  if(nb) nb.value = epcBand(epcNum("epc_new_rating"));
}
/* Leading use-class code, e.g. "B1 Offices…" -> "B1", "A1/A2 Retail…" -> "A1/A2" */
function epcUseCode(s){
  const m = String(s||"").trim().toUpperCase().match(/^([A-Z]\d*[A-Z]?(?:\s*\/\s*[A-Z]\d*[A-Z]?)*)\b/);
  return m ? m[1].replace(/\s+/g,"") : "";
}

function epcRefresh(){
  epcApplyMask();
  const cmp = document.getElementById("epc_compare");
  if(!cmp) return;
  const pR = epcNum("epc_prev_rating"), nR = epcNum("epc_new_rating");
  const masked = epcMasked();
  const fl = epcInputFlags();
  const v = epcVariance(pR,nR);
  const fmtR = r => r===null ? "—" : r+" (band "+epcBand(r)+")";
  const vu = epcValidUntil(val("epc_prev_date"));
  const expired = vu && vu < new Date();

  const row = (label, prev, cur, diff, flagged) =>
    "<tr><td>"+escapeHtml(label)+"</td><td>"+prev+"</td><td>"+cur+"</td><td"+(flagged?' class="epc-flag"':"")+">"+diff+"</td></tr>";
  let h = '<table class="epc-cmp"><tr><th></th><th>Previous EPC</th><th>This survey</th><th>Difference</th></tr>';
  h += row("EPC rating & score",
    masked ? "<em>hidden until you enter your modelled score</em>" : escapeHtml(pR===null ? "—" : epcBand(pR)+" ("+pR+")"),
    escapeHtml(nR===null ? "—" : epcBand(nR)+" ("+nR+")"),
    v ? (v.delta>0?"+":"")+v.delta+" pts"+(v.bands ? ", "+Math.abs(v.bands)+" band"+(Math.abs(v.bands)>1?"s":"")+(v.bands>0?" worse":" better") : ", same band") : "—",
    v && v.level!=="ok");
  h += row("Floor area (m²)",
    escapeHtml(val("epc_prev_area")||"—"), escapeHtml(val("epc_new_area")||"—"),
    fl.areaPct===null ? "—" : (fl.areaFlag?"⚠ ":"")+(fl.areaPct>0?"+":"")+fl.areaPct.toFixed(1)+"%",
    !!fl.areaFlag);
  const pT = val("epc_prev_type"), nT = val("p_use");
  const pc = epcUseCode(pT), nc = epcUseCode(nT);
  let tDiff = "—", tFlag = false;
  if(pT && nT){
    if(pc && nc){ tFlag = pc!==nc; tDiff = tFlag ? "⚠ Differs" : "Same"; }
    else tDiff = "Compare manually";
  }
  h += row("Activity type",
    escapeHtml(pT||"—"), escapeHtml(nT||"— (set Building Use on this tab)"), tDiff, tFlag);
  h += "</table>";
  cmp.innerHTML = h;

  const ban = document.getElementById("epc_banner");
  const recheck = document.getElementById("epc_recheck_wrap");
  const reasonWrap = document.getElementById("epc_reason_wrap");
  const warn = document.getElementById("epc_reason_warn");
  if(v){
    ban.className = "epc-banner "+v.level;
    ban.innerHTML = "<strong>"+escapeHtml(EPC_LEVEL_LABEL[v.level])+".</strong> "+escapeHtml(epcVarianceText(v))
      + (v.level!=="ok" ? " A difference is not necessarily an error - re-check the items below, then record the reason." : "");
  } else {
    ban.className = "epc-banner none";
    ban.textContent = masked
      ? "Enter your modelled asset rating and floor area below to see how this survey compares with the previous EPC."
      : "Enter the previous EPC details above and your modelled asset rating below to see the comparison.";
  }
  const flagged = !!(v && v.level!=="ok");
  recheck.style.display = (flagged || fl.areaFlag || fl.fuelFlag) ? "" : "none";
  reasonWrap.style.display = (flagged || fl.areaFlag || fl.fuelFlag) ? "" : "none";
  const anyReason = EPC_REASONS.some((_,i)=>checked("epc_reason_"+i)) || val("epc_reason_text").trim()!=="";
  warn.style.display = (flagged && !anyReason) ? "" : "none";
  const notes = [fl.areaFlag, fl.fuelFlag].filter(Boolean);
  const nb = document.getElementById("epc_input_notes");
  nb.innerHTML = notes.map(n=>"<div class=\"epc-flag\">⚠ "+escapeHtml(n)+"</div>").join("");
}

/* ---------- section UI ---------- */
function buildEpcSection(){
  const body = el("div");
  body.appendChild(el("div",{class:"hint", style:"margin-bottom:12px;"},
    "Enter the postcode above and earlier non-domestic EPCs for that postcode are listed. Confirm the matching property. "+
    "Treat this as a sense-check, not a target: a difference is not automatically an error, but it should be understood and recorded."));

  const bar = el("div",{style:"display:flex;gap:10px;align-items:center;flex-wrap:wrap;"});
  const findBtn = el("button",{class:"btn btn-secondary", type:"button", id:"epc_find_btn"}, "Find previous EPC");
  findBtn.addEventListener("click", ()=>{
    const pc = val("p_postcode").trim().toUpperCase().replace(/\s+/g," ");
    if(!EPC_POSTCODE_RE.test(pc)){ epcSetStatus("Enter a full postcode (e.g. M1 1AE) in the Survey Details first.","warn"); return; }
    epcSearch(pc,true);
  });
  bar.appendChild(findBtn);
  bar.appendChild(el("span",{id:"epc_status", class:"epc-status"}, (EPC_CONFIG.PROXY_URL||EPC_CONFIG.DATA_URL) ? "Waiting for a full postcode…" : "Automatic lookup is not switched on for this form - enter the previous EPC details manually below."));
  body.appendChild(bar);

/* one delegated listener keeps the comparison live as any field changes */
let epcRefreshTimer = null;
function epcOnAnyChange(e){
  const id = (e.target && e.target.id) || "";
  if(id.indexOf("epc_prev_")===0){
    if(epcState.source==="register") epcState.edited = true;
    else if(!epcState.source) epcState.source = "manual";
  }
  if(id==="p_address" && epcState.candidates.length){ clearTimeout(epcRefreshTimer); epcRefreshTimer = setTimeout(epcRerank,400); }
  clearTimeout(epcRefreshTimer);
  epcRefreshTimer = setTimeout(()=>{ epcRefresh(); if(id==="epc_new_rating"){ epcRenderCandidates(); epcRenderHistory(); } }, 150);
}
document.addEventListener("input", epcOnAnyChange);
document.addEventListener("change", epcOnAnyChange);

/* ---------- output ---------- */
function appendEpcToPrintSheet(ps){
  const pR = epcNum("epc_prev_rating"), nR = epcNum("epc_new_rating");
  const ids = ["epc_prev_addr","epc_prev_uprn","epc_prev_cert","epc_prev_rating","epc_prev_date","epc_prev_area","epc_prev_type","epc_new_rating","epc_new_area","epc_new_software","epc_reason_text"];
  const any = ids.some(id=>val(id).trim()!=="") || EPC_REASONS.some((_,i)=>checked("epc_reason_"+i));
  if(!any) return;

  ps.appendChild(el("h2",{},"Previous EPC & Variance Check"));
  const withBand = r => r===null ? "" : epcBand(r)+" ("+r+")";
  const vu = epcValidUntil(val("epc_prev_date"));
  const pairs = [
    ["Previous EPC address", val("epc_prev_addr")], ["UPRN / certificate ref", [val("epc_prev_uprn"), val("epc_prev_cert")].filter(Boolean).join(" / ")],
    ["Previous EPC rating & score", withBand(pR)], ["Lodged / valid until", val("epc_prev_date") ? epcFmtDate(val("epc_prev_date"))+(vu?" / "+epcFmtDate(vu.toISOString()):"") : ""],
    ["Previous floor area (m²)", val("epc_prev_area")], ["Previous activity type", val("epc_prev_type")],
    ["This survey - EPC rating & score", withBand(nR)], ["This survey - activity type", val("p_use")],
    ["This survey - floor area (m²)", val("epc_new_area")], ["Software / NCM version", val("epc_new_software")],
  ];
  for(let i=0;i<pairs.length;i+=2){
    const row = el("div",{class:"kvrow"});
    row.appendChild(el("span",{class:"k"},pairs[i][0]));
    row.appendChild(el("span",{},pairs[i][1]||"—"));
    if(pairs[i+1]){
      row.appendChild(el("span",{class:"k"},pairs[i+1][0]));
      row.appendChild(el("span",{},pairs[i+1][1]||"—"));
    }
    ps.appendChild(row);
  }

  const v = epcVariance(pR,nR);
  const fl = epcInputFlags();
  const lines = [];
  if(v) lines.push(epcVarianceText(v)+" Status: "+EPC_LEVEL_LABEL[v.level]+".");
  if(fl.areaFlag) lines.push(fl.areaFlag);
  if(fl.fuelFlag) lines.push(fl.fuelFlag);
  ps.appendChild(el("div",{class:"notesblock"}, el("span",{class:"k"},"Variance assessment"), lines.join("\n")||"—"));

  const reasons = EPC_REASONS.filter((_,i)=>checked("epc_reason_"+i));
  const needed = (v && v.level!=="ok") || fl.areaFlag || fl.fuelFlag;
  let reasonTxt = reasons.join("; ");
  if(val("epc_reason_text").trim()) reasonTxt += (reasonTxt?"\n":"")+val("epc_reason_text").trim();
  if(!reasonTxt) reasonTxt = needed ? "NOT RECORDED - a difference was flagged" : "—";
  ps.appendChild(el("div",{class:"notesblock"}, el("span",{class:"k"},"Reason(s) for difference"), reasonTxt));

  const rechecked = EPC_RECHECK.filter((_,i)=>checked("epc_recheck_"+i));
  if(rechecked.length) ps.appendChild(el("div",{class:"notesblock"}, el("span",{class:"k"},"Re-checked before finalising"), rechecked.join("; ")));

  let src = "Previous EPC details entered manually.";
  if(epcState.source==="register"){
    src = "Source: EPC Register (MHCLG)"+(epcState.dataAsOf ? " bulk data, certificates lodged to "+epcFmtDate(epcState.dataAsOf) : ", retrieved "+(epcState.retrievedAt? epcState.retrievedAt.toLocaleDateString("en-GB"):""))+"."
        + (epcState.edited ? " Some previous-EPC values were edited manually after retrieval." : "");
  }
  ps.appendChild(el("div",{class:"notesblock"}, el("span",{class:"k"},"Data source"), src));
}

/* ---------- AUTOMATIC POSTCODE LOOKUP HANDLER ---------- */
function handlePostcodeLookup(e) {
  epcOnPostcodeInput(e.target.value);
  const inputStr = e.target.value.trim().toUpperCase();
  const weatherField = document.getElementById("p_weather");
  if (!weatherField) return;

  const match = inputStr.match(/^[A-Z]{1,2}/);
  if (match) {
    const areaCode = match[0];
    if (WEATHER_LOOKUP[areaCode]) {
      weatherField.value = WEATHER_LOOKUP[areaCode];
    } else {
      weatherField.value = "";
    }
  } else {
    weatherField.value = "";
  }
}

/* ---------- REPEATABLE ROW TABLE BUILDER ---------- */
function makeRowTable(containerId, columns, addLabel){
  const wrap = el("div");
  const table = el("table",{class:"rowtable",id:containerId+"_table"});
  const thead = el("thead");
  const trh = el("tr");
  columns.forEach(c=> trh.appendChild(el("th",{},c.label)));
  trh.appendChild(el("th",{style:"width:30px"},""));
  thead.appendChild(trh);
  table.appendChild(thead);
  const tbody = el("tbody",{id:containerId+"_body"});
  table.appendChild(tbody);
  const scroller = el("div",{class:"table-scroll"});
  scroller.appendChild(table);
  wrap.appendChild(scroller);

  function addRow(){
    const tr = el("tr");
    columns.forEach(c=>{
      const td = el("td");
      let input;
      if(c.type==="select"){
        input = selectInput(null, c.options, "");
      } else {
        input = textInput(null, c.placeholder||"");
      }
      input.dataset.key = c.key;
      td.appendChild(input);
      tr.appendChild(td);
    });
    const delTd = el("td");
    const delBtn = el("button",{class:"del-btn",type:"button",title:"Remove row"},"✕");
    delBtn.onclick = ()=> tr.remove();
    delTd.appendChild(delBtn);
    tr.appendChild(delTd);
    tbody.appendChild(tr);
  }

  const addBtn = el("button",{class:"add-row-btn",type:"button"}, "+ "+addLabel);
  addBtn.onclick = addRow;
  wrap.appendChild(addBtn);

  wrap._addRow = addRow;
  wrap._tbody = tbody;
  wrap._columns = columns;
  return wrap;
}

function readRowTable(wrap){
  const rows = [];
  wrap._tbody.querySelectorAll("tr").forEach(tr=>{
    const obj = {};
    tr.querySelectorAll("input,select").forEach(inp=>{
      obj[inp.dataset.key] = inp.value;
    });
    const hasData = Object.values(obj).some(v=>v && v.trim()!=="");
    if(hasData) rows.push(obj);
  });
  return rows;
}

  body: [
    ["Hierarchy", "1. Where external walls or parts of them are constructed of glass blocks, enter them as <strong>Windows</strong>.<br>2. Where the specification refers to specific glass blocks and supporting technical information is available, enter U-value, T-solar and L-solar as <strong>user-defined</strong> values (retain the specification and technical data as evidence).<br>3. Where neither is available, use the defaults below."],
    ["Default values", "<strong>Pre-2002 buildings:</strong> U = 3.2 W/m&sup2;K, T-solar 0.83, L-solar 0.8, frame factor 0.00<br><strong>Post-2002 buildings:</strong> U = 2.2 W/m&sup2;K, T-solar 0.71, L-solar 0.8, frame factor 0.00"]
  ]
},

/* ---- 4. Geometry ---- */
"4.01": {
  cat: "4. Geometry",
  title: "Light Wells",
  date: "1 Jun 2010",
  body: [
    ["Rule", "Light wells are to be treated as <strong>external envelopes</strong>."],
    ["Definition", "A light well is a space surrounded by the walls of a building with no roof or glazing above it - similar in appearance to a courtyard. The surrounding walls are exposed to external air."]
  ]
},
"4.02": {
  cat: "4. Geometry",
  title: "Atria",
  date: "1 Jun 2010",
  body: [
    ["Rule", "All atria are to be treated as a <strong>Level 5</strong> NDEPC assessment feature. Refer to the Level 3/4/5 decision flowchart (appendix 10.02)."],
    ["Definition", "A non-continuously occupied interior space, often several storeys high, bounded on at least one side by occupied spaces set to activity-database conditions. The atrium itself is <em>not</em> maintained to those conditions."],
    ["Technical purpose (one or more)", "Providing a thermal buffer between adjoining spaces and the exterior; providing daylight to the middle of deep-plan spaces; encouraging stack effect or other passive ventilation to draw extract air from adjoining spaces."],
    ["Note", "If the space is conditioned and none of the above purposes apply, it is not considered an atrium in this context."]
  ]
},
"4.03": {
  cat: "4. Geometry",
  title: "Dimensions",
  date: "1 Jun 2010 (am. 17 Jan 2011)",
  body: [
    ["Rule", "Horizontal and vertical measurements (including zone height) must follow the CEPC Dimension Conventions (appendix 10.03)."],
    ["Horizontal", "Generally follow the RICS definition of Gross Internal Area. Measure to the inside of perimeter walls and to the <strong>mid-point</strong> of internal walls. Party walls are perimeter - measure to the surface, not the mid-point."],
    ["Openings", "Measure the <strong>inside structural opening</strong> (w &times; h), not just the glass area. Percentage glazing is as viewed from inside, i.e. wall area to full zone height."],
    ["Ground &amp; intermediate floors", "Zone height is top of floor to top of floor. Wall areas are calculated top of floor to top of floor (including walls above dropped ceilings)."],
    ["Top floors", "Zone height is top of floor to soffit/underside of roof slab, <em>unless</em> there is a lower ceiling forming an effective thermal boundary. Dropped <strong>permeable</strong> ceilings without insulation are treated as if at soffit/eaves level; dropped <strong>non-permeable</strong> ceilings (or permeable with insulation across the whole ceiling) set the zone height at the underside of the ceiling."],
    ["General rule", "Always input the <strong>area exposed to the inside temperature</strong>, and the U-value between that surface and outside."]
  ]
},
"4.04": {
  cat: "4. Geometry",
  title: "Measurement Accuracy (Distance, Area and Volume)",
  date: "21 Jan 2013",
  body: [
    ["Accuracy", "The minimum level of accuracy for calculated values entered into the software is <strong>2 decimal places</strong>."],
    ["Site notes", "All measurements entered into the software must be recorded to at least 2 decimal places on site notes."],
    ["Audit", "Calculated values entered for the EPC calculation must be supported by calculations presented for audit."],
    ["Exceptions", "Where the required level of accuracy is not possible, the reason must be recorded."]
  ]
},
"4.05": {
  cat: "4. Geometry",
  title: "Roofs with Multiple Components",
  date: "21 Jan 2013",
  body: [
    ["Horizontal internal ceiling present", "Enter the roof with a <strong>horizontal</strong> orientation. The roof area is the total horizontal internal surface area exposed to the conditioned space. Enter the pitch angle as the SBEM default of <strong>45&deg;</strong>."],
    ["No horizontal internal ceiling", "The roof area is the internal surface area exposed to the conditioned space. Orientation is the compass position faced by the pitched component, and the pitch angle is the actual angle of the component to the horizontal."],
    ["Multiple pitched components", "Address each component individually and enter it separately - except where components have <em>exactly</em> the same set of properties, which may be entered as one envelope with the summed area."],
    ["Reference", "See appendix 10.06 for the worked diagrams."]
  ]
},
"4.06": {
  cat: "4. Geometry",
  title: "Same Space Adjacency",
  date: "1 May 2017",
  body: [
    ["Rule", "Internal wall envelope areas of the same or similar construction within <strong>merged zones</strong> may be summed and entered as a single envelope with the adjacency <strong>'Same space'</strong>."],
    ["Orientation", "Orientation is not relevant to the EPC results for a 'Same space' envelope."],
    ["Audit", "Document the calculation for audit purposes."]
  ]
},
"4.07": {
  cat: "4. Geometry",
  title: "Zoning for Day Lit Spaces",
  date: "1 May 2017 (am. 1 Jul 2018)",
  body: [
    ["Rule", "All zones must be evaluated for day lit spaces. Many software tools offer automatic day lit zoning, which requires no subdivision by the assessor."],
    ["Manual method (where automatic zoning is not selected, not available, or is prescribed as required)", "Subdivide zones at boundaries:<br>&bull; <strong>6 m</strong> from an external wall containing at least 20% glazing<br>&bull; <strong>1.5 &times; room height</strong> beyond the edge of an array of roof lights, if the roof lights are at least 10% of the zone floor area"],
    ["Notes", "1. If a resulting zone is less than 3 m wide, absorb it into surrounding zones with the same HVAC, lighting and activity.<br>2. If resulting zones overlap, use discretion to allocate the overlap.<br>3. All other zone features (HVAC, activity, lighting) apply to each subdivided zone."]
  ]
},
"4.08": {
  cat: "4. Geometry",
  title: "Modelling a Zone Within a Zone",
  date: "1 May 2017 (am. 1 Jul 2018)",
  body: [
    ["Scenario", "A separate zone (Z2) enclosed by walls, doors, ceilings and/or windows sits within a larger space (Z1) - typically an office or toilet block in the corner of a warehouse or industrial unit. Z1a is the full-height part; Z1b is the part of Z1 extending over Z2."],
    ["Floor of Z1b", "The floor envelope of Z1b <strong>must always be entered</strong> to account for heat transfer and thermal mass."],
    ["Floor area on the EPC", "Z1b is only included in the EPC floor area if it has <strong>permanent fixed access</strong> and is usable floor space per the RICS GIA definition."],
    ["Modelling", "If the space above Z2 is accessible floor area: enter Z1a and Z1b as <strong>two separate zones</strong>, which may have different properties. If it is not accessible: enter Z1a and Z1b as a <strong>single zone</strong> with the same properties, and exclude the Z1b floor area from the zone area."]
  ]
},
"4.09": {
  cat: "4. Geometry",
  title: "Low Zone Height",
  date: "1 Jul 2024",
  body: [
    ["Rule", "Where the zone height convention gives a height of less than 1.2 m, enter the zone height as <strong>1.2 m</strong>. Do not adjust any other dimensions - all envelopes are entered at actual size. Only the zone height is adjusted."],
    ["Air changes", "The 1.2 m height is also used for calculating the zone's air changes, where applicable."],
    ["Floor area", "If <em>no</em> part of the zone has headroom of 1.5 m or more, exclude its floor area from the EPC usable floor area. If at least part has headroom greater than 1.5 m and is usable for an NCM activity, include it."]
  ]
},
"4.10": {
  cat: "4. Geometry",
  title: "Foundation Area",
  date: "1 Jul 2024",
  body: [
    ["Calculation", "Foundation area = <strong>total conditioned floor area &divide; maximum number of storeys in the overall structure</strong>. Conditioned floor area will be less than total floor area where there are unconditioned spaces."],
    ["Stand-alone building", "Maximum storeys = total storeys in the building."],
    ["Unit attached by party walls only", "(Roof area equals the footprint.) Maximum storeys = storeys in that building unit."],
    ["Unit with party floor and/or ceiling", "(It overlaps another unit.) Maximum storeys = total storeys in the overall combined structure."],
    ["Caution", "The maximum number of storeys <em>entered into SBEM</em> remains the number in the building unit being assessed - not the number in the overall structure."],
    ["Partial storeys", "A mezzanine or floor over an inner zone counts as an additional storey <strong>only if</strong> it is usable floor area."]
  ]
},

/* ---- 5. Global Building Services ---- */
"5.01": {
  cat: "5. Global Building Services",
  title: "Electric Power Factor",
  date: "21 Jan 2013",
  body: [
    ["Default", "Leave the SBEM power factor at the default <strong>&lt;0.9</strong> unless a photograph of the power factor correction device and/or other compelling evidence is provided."],
    ["Photograph only", "Where only a photograph of the device is available, amend the power factor to <strong>'0.9 to 0.95'</strong>."],
    ["Compelling evidence", "Photographic evidence confirming the actual figure (select the matching SBEM option); equipment specifications, name-plates, specification manuals, BMS printouts; utility bills; power factor calculations by electricians or power engineering specialists; meter readings incorporating reactive unit consumption plus calculations."]
  ]
},

/* ---- 6. HVAC ---- */
"6.01": {
  cat: "6. HVAC",
  title: "Variable Speed Pumps Other than Central Heating",
  date: "1 Jun 2010",
  body: [
    ["Rule", "Variable speed pumps other than those serving central heating are <strong>ignored</strong>, unless using approved DSM software that allows for this input option."]
  ]
},
"6.02": {
  cat: "6. HVAC",
  title: "Passive Stack Ventilation",
  date: "1 Jun 2010",
  body: [["Rule", "Treat passive stack ventilation as <strong>natural ventilation</strong>."]]
},
"6.03": {
  cat: "6. HVAC",
  title: "Electric Room Heaters",
  date: "1 Jun 2010",
  body: [
    ["Rule", "Any form of fanned or unfanned electric room heater - panel, bar, convector or storage heater - shall have a <strong>user-amended efficiency of 1 (100%)</strong>."]
  ]
},
"6.04": {
  cat: "6. HVAC",
  title: "LTHW Boiler Efficiencies",
  date: "17 Jan 2011 (am. 1 Feb 2023)",
  body: [
    ["Hierarchy for Effective Heat Generating Seasonal Efficiency", "1. <strong>ECA product list</strong> part-load values at 30% and 100%, used to calculate seasonal efficiency per the NDBSCG.<br>2. Current <strong>PCDB</strong> values where available.<br>3. Manufacturer's information, boiler plate data, or the manufacturer's technical helpdesk.<br>4. <strong>SAP 2005</strong> tables (up to 70 kW output).<br>5. A suitable <strong>SBEM default</strong> - site notes must evidence why the above methods could not be used, including evidence of failed attempts."],
    ["Non-condensing boilers", "Where a gross efficiency is established at step 3 for a non-condensing boiler, deduct <strong>0.05 (5%)</strong> to convert it to a seasonal efficiency."],
    ["Net vs gross", "Net efficiencies/values must be converted to gross per the NDBSCG."],
    ["Credits", "Add the relevant heating credits following the NDBSCG guidance."]
  ]
},
"6.05": {
  cat: "6. HVAC",
  title: "Electric HWS With and Without Storage",
  date: "17 Jan 2011",
  body: [
    ["No storage", "Enter as an <strong>instantaneous system</strong>, fuel = grid supplied electricity, seasonal efficiency = <strong>1 (100%)</strong>."],
    ["Any storage", "Do <strong>not</strong> use 'electric instantaneous system'. Use <strong>'Stand-alone water heater'</strong>. Where losses, or volume and insulation details, are also entered, the system efficiency should be 1 (100%)."]
  ]
},
"6.06": {
  cat: "6. HVAC",
  title: "HWS Efficiencies and Storage Losses",
  date: "17 Jan 2011 (am. 1 Jul 2018)",
  body: [
    ["Rule", "Storage/losses <strong>must</strong> be entered for all storage systems - preferably as losses in <strong>MJ/month</strong> rather than volume and insulation type/thickness. Record the source data and/or calculation in site notes."],
    ["Where losses cannot be established", "Enter volume and insulation details. Where these cannot be established by external visual inspection or paperwork, estimate:<br>&bull; Modern steel/plastic encased unvented cylinder <strong>&gt;50 litres</strong> (e.g. Megaflo): 50 mm factory insulation; volume from external dimensions less 50 mm<br>&bull; Modern unvented cylinder <strong>up to 50 litres</strong>, or electric multipoint: 25 mm factory insulation; volume less 25 mm<br>&bull; Point-of-use heater (typically over/under sink, up to 10 litres): 10 mm factory insulation; volume less 10 mm<br>&bull; Other HWS storage: use external dimensions as if the vessel fills the unit, no deduction for insulation; if the insulation type cannot be established, assume <strong>uninsulated</strong>"],
    ["No system / details unavailable", "Enter as an instantaneous system with no storage and a seasonal efficiency of <strong>0.5 (50%)</strong>. Enter the correct fuel where it can be readily determined, otherwise assume grid electricity."],
    ["DHW serving multiple buildings", "Apportion losses between buildings by floor area. If using volume and insulation instead, run SBEM with all storage allocated to the assessed building, read the calculated storage losses, apportion by floor area, then enter that figure as storage losses in MJ/month."]
  ]
},
"6.07": {
  cat: "6. HVAC",
  title: "Estimating Local Mechanical Exhaust Rates",
  date: "17 Jan 2011 (am. 1 Jul 2018)",
  body: [
    ["Rule", "Where fan performance cannot be obtained from the fan nameplate, building logbook or O&amp;M manual during the survey, approximate the air flow rate in l/s/m&sup2; using the appropriate air-change rate from the table at appendix 10.04, converted using the <strong>zone height</strong> (do not adjust the height to compensate for an internal ceiling)."],
    ["Not acceptable", "Using an arbitrary value such as 5 l/s/m&sup2;, or a software-applied default, where the mechanical extraction rate is unknown."],
    ["Common rates (air changes/hour)", "Office/consulting area 10; circulation area 5; toilet/locker room 10; store room 6; warehouse 6; plant room - light 30, heavy 6; car park 6; teaching areas 6; dry sports hall 6; laboratory 15; laundry 15; commercial kitchen 40; residents' kitchen 15; cafe/restaurant/public bar 15; canteen 12; hotel bar 10; fitness suite/gym 12; bathroom 10; reception 10; sales area 10; changing facility with showers 20."]
  ]
},
"6.08": {
  cat: "6. HVAC",
  title: "Estimating Local Mechanical Exhaust Specific Fan Power (SFP)",
  date: "17 Jan 2011 (am. 1 Jul 2024)",
  body: [
    ["First", "For kitchen extraction or ventilation, refer to convention <strong>6.12</strong> instead."],
    ["Where fan motor power is known", "Use the established power (from nameplate, logbook or O&amp;M manual) to calculate the SFP. Convert horsepower at 1 hp = 746 W."],
    ["Where performance details are unavailable", "Use the W/l/s override values below, based on the Building Regulations at date of build (or date of system installation, with robust evidence of full compliance). Columns: <em>pre-2006 / 2006 / 2010 / 2013 or later</em>."],
    ["Supply <em>or</em> extract only", "Local (single room or area): <strong>1.5 / 0.5 / 0.4 / 0.3</strong><br>Multi-zone <em>without</em> heating or cooling: <strong>2.0 / 1.6 / 1.4 / 0.9</strong><br>Multi-zone <em>with</em> heating and/or cooling: <strong>2.5* / 2.1 / 1.9 / 1.1</strong>"],
    ["Supply <em>and</em> extract", "Local (single room or area): <strong>2.1 / 1.2 / 0.6 / 0.5</strong><br>Multi-zone <em>without</em> heating or cooling: <strong>2.6 / 1.8 / 1.6 / 1.1</strong><br>Multi-zone <em>with</em> heating and/or cooling: <strong>3.0* / 2.5 / 2.2 / 1.6</strong>"],
    ["* Note", "For these systems only, the SBEM default may be used if better than 3.0 and the system is defined at system level."],
    ["Additional adjustments (W/l/s)", "Heat recovery incorporated <strong>+0.3</strong>; additional return filter for heat recovery <strong>+0.1</strong>; HEPA filter <strong>+0.1</strong>; humidifier/dehumidifier incorporated <strong>+0.1</strong>."],
    ["Site notes", "Record why specific fan performance was not available."]
  ]
},
"6.09": {
  cat: "6. HVAC",
  title: "Reversible Extract Fans",
  date: "1 Feb 2012",
  body: [
    ["Rule", "Reversible extract fans are treated the same as non-reversible extract fans in SBEM."],
    ["Extraction rate", "It is <strong>not</strong> acceptable to use an arbitrary value or software default where the actual rate is unknown - calculate it per convention 6.07."]
  ]
},
"6.10": {
  cat: "6. HVAC",
  title: "Hot Water Storage Vessels",
  date: "1 Feb 2012",
  body: [
    ["Aggregating storage vessels", "Vessels with exactly the same fuel type and efficiency may be entered as <strong>one system</strong> using the sum of their individual storage losses. Vessels of different sizes may be aggregated <em>provided the losses are known for every vessel</em>."],
    ["Cannot be aggregated", "Vessels identified by <strong>insulation type</strong> (SBEM derives losses from insulation type and vessel size). Systems that differ by recirculation, or by the use of CHP or solar energy, must be entered separately."],
    ["Instantaneous systems", "Multiple instantaneous systems with the same fuel type and assumed efficiency may be entered as one system and allocated to all relevant zones."]
  ]
},
"6.11": {
  cat: "6. HVAC",
  title: "Zones Without Fixed Conditioning Equipment in Existing Buildings",
  date: "1 Sep 2014 (am. 1 Jul 2018)",
  body: [
    ["Scope", "Applies where at least one zone is not conditioned by fixed conditioning equipment (heating, cooling or mechanical ventilation). Follow the flowchart at appendix 10.07 and evidence the option selected at each decision point."],
    ["Assess as seen", "Zones must be assessed as seen on the day of inspection."],
    ["Activities where zones may be unconditioned", "a) Circulation areas<br>b) Plant rooms<br>c) Store rooms and warehouse storage<br>d) Industrial process area<br>e) Car park<br>f) B1 workshops<br>g) Toilet - <em>only</em> if no other zone in the building has an expectation of conditioning"],
    ["SBEM entry", "In these circumstances select HVAC type <strong>'Zones without HVAC system'</strong>."],
    ["Shell &amp; core / first fit-out", "Determine which building service would likely be installed (justify in site notes) and assign the minimum efficiency allowed under Part L, referring to Approved Document L2 (2021)."],
    ["Default fallback", "Where the activity is not on the list above and the zone is not indirectly conditioned, assume a default HVAC of fanned electric room heaters with an Effective Heat Generating Seasonal Efficiency of <strong>100% (1)</strong>."]
  ]
},
"6.12": {
  cat: "6. HVAC",
  title: "Kitchen Area Extraction",
  date: "1 Sep 2014 (am. 1 Feb 2023)",
  body: [
    ["Rule", "All kitchen extraction and mechanical ventilation equipment must be included in the SBEM assessment to account for the energy of conditioning higher air change rates. Extractor hoods are <strong>no longer disregarded</strong>."],
    ["Default extract rates where performance is unknown", "<strong>Small kitchen / kitchenette / tea-making</strong> (single wall or window fan, very limited food prep): activity 'Generic Office', vent type 'Tea making', <strong>10 ac/h</strong><br><strong>'Domestic' type kitchen</strong> (single cooker hood and/or single wall or window fan, limited food prep): activity 'Food preparation', vent type 'Kitchen - domestic', <strong>15 ac/h</strong><br><strong>'Non-domestic' kitchen</strong> (multiple hoods and/or extract units, extensive food prep - restaurant, canteen, college): activity 'Food preparation', vent type 'Kitchen - non-domestic', <strong>40 ac/h</strong>"],
    ["Preference", "Always try to obtain and use actual performance details per convention 6.07; use the defaults only where equipment cannot be identified."],
    ["Removing 'process power' - default SFPs", "<strong>Local mechanical extract only:</strong> SFP = 0.4 where the fan is <em>within</em> the zone; SFP = 0.6 where the fan is <em>outside</em> the zone.<br><strong>Mechanical ventilation systems</strong> (whether defined at system or zone level): SFP = 0.8 where unknown, or enter <strong>50% of the actual SFP</strong> to remove the process power element."],
    ["Note", "Even if the SFP is defined at system level, this only applies to the kitchen zone."]
  ]
},
"6.13": {
  cat: "6. HVAC",
  title: "Identifying Indirectly Conditioned Zones",
  date: "1 Sep 2014 (am. 1 Feb 2023)",
  body: [
    ["Test", "A zone without any fixed conditioning equipment is assumed to be <strong>indirectly conditioned</strong> where at least <strong>50%</strong> of its surrounding envelope area - including party walls, floors and ceilings - is adjacent to directly conditioned space (or, for party envelopes, assumed to be)."],
    ["HVAC assignment", "Assign the same HVAC as the adjacent spaces, or as the larger proportion of adjacent spaces - unless there is significant air transfer with a specific adjacent zone, e.g. through a frequently used doorway."],
    ["Evidence", "Provide suitable evidence that there is no fixed/direct conditioning in the zone and that at least 50% of the surrounding area is conditioned, e.g. a floor plan and/or photographs."],
    ["Interaction with 6.11", "A zone with no fixed conditioning that is treated as 'conditioned adjoining space' by applying assumed heating under convention 6.11 <em>is</em> considered directly conditioned, and does contribute to indirectly conditioning adjacent zones."]
  ]
},
"6.14": {
  cat: "6. HVAC",
  title: "Individual Shop Units in Shopping Centres",
  date: "1 Sep 2014 (am. 1 Jul 2018)",
  body: [
    ["Scenario 1 - local heating/AC plus unconditioned central fresh air", "Assess with the local heating plus <strong>'mechanical ventilation'</strong> to the affected zones. The assessment level depends on the system type - see the flowchart at appendix 10.02."],
    ["Scenario 2 - local heating/AC plus tempered fresh air from a central location", "Model as scenario 1."],
    ["Scenario 3 - centrally conditioned system in addition to local devices", "Split the zone into a number of zones matching the number of HVAC types. Split all the zone's envelopes, including glazing, equally between them and assign the respective HVAC type."],
    ["Practical limitation", "Where graphical software cannot split envelopes equally, divide them as equally as possible and record the limitation in site notes."]
  ]
},
"6.15": {
  cat: "6. HVAC",
  title: "Bivalent System Proportioning Within a Building Zone",
  date: "1 Jul 2018",
  body: [
    ["Definition", "A bivalent system is one in which heating is supplied by two or more different types of heat source."],
    ["Rule", "Specify the proportion of load met by each system on a <strong>zone-by-zone</strong> basis. The same HVAC system may only be assigned to multiple zones where the sources and delivery methods are the same. Enter the proportion met by the additional (bivalent) generator(s); the balance is assigned to the main system."],
    ["Controls", "Control corrections may be applied to each system efficiency, but only <strong>one set</strong> of control options can be selected - choose those appropriate to the system supplying the greatest heating load."],
    ["Which is the 'main' system", "Any system providing <strong>cooling</strong> must be the main system. Where none provides cooling, the main system should if possible be the one supplying the greater proportion of heating load."],
    ["Default splits where relative load is unknown", "&bull; One central (multi-zone) + one or more local (single zone): <strong>80% central / 20% local</strong> (local split equally)<br>&bull; Two central systems only: <strong>50% each</strong><br>&bull; Two central + one or more local: <strong>40% each central / 20% local</strong><br>&bull; No central, two or more local: <strong>equal split</strong> between locals"],
    ["Note", "A split or multi-split is considered a <em>local</em> system. Where evidence of relative heating load exists (e.g. a heating load design), use it."]
  ]
},

/* ---- 7. Lighting ---- */
"7.01": {
  cat: "7. Lighting",
  title: "Lighting Options in SBEM",
  date: "17 Jan 2011 (am. 1 Feb 2023)",
  body: [
    ["Option 1 - 'Full lighting design carried out'", "Use where the building's original lighting design is available <em>and</em> agrees with the observed lighting - enter the wattage and lux values from that design. Complementary values must come from the <strong>same</strong> design; if not, the design must not be used. Also use this option where the assessor can accurately record circuit wattage and lux levels on site (see 7.02)."],
    ["Not permitted", "Entering wattage and lux values separately, or using assumed values from BSRIA or other reference documents, or accepting a software default."],
    ["Option 2 - 'Lighting chosen but calculation not carried out'", "Requires <strong>both</strong> lumens per circuit watt (lm/cW) and light output ratio (LOR):<br>a) If lm/cW is known for the whole fitting including integral lamps or LED chips, <strong>LOR = 1</strong><br>b) If lm/cW is known for the lamp, the luminaire LOR must also be obtained - except for directional (downlight) lamps not shielded by the luminaire or a diffuser, where LOR = 1<br>c) A 'bulb' type lamp is not directional, so LOR cannot be assumed to be 1 even outside a fitting or shade"],
    ["Option 3 - 'Lighting parameters not available'", "Select the appropriate lamp type for the zone. For mixed lamp types see 7.03; where no lamps are fitted see 7.05."],
    ["Evidence", "Record in site notes how any values used were obtained."]
  ]
},
"7.02": {
  cat: "7. Lighting",
  title: "Use of Lux Level Meters",
  date: "17 Jan 2011",
  body: [
    ["Rule", "Lux readings taken by an assessor may only be used for an EPC if recorded in line with the SLL <strong>Code for Lighting 2009</strong>."],
    ["Evidence required", "Evidence of achieving a complete <strong>blackout of windows</strong>, and the calculations used to establish the measurement grid size."]
  ]
},
"7.03": {
  cat: "7. Lighting",
  title: "Mixed Lighting in a Zone",
  date: "17 Jan 2011 (am. 1 May 2017)",
  body: [
    ["General + display lighting, activity assumes display lamps", "Enter the display lighting and general lighting as <strong>'display'</strong> and <strong>'general'</strong> respectively."],
    ["General + display lighting, activity does <em>not</em> assume display lamps", "Subdivide the zone to create additional <strong>display zones</strong> with a suitable display activity and appropriate lighting entries. The remainder keeps the original activity, with only the general lighting entered."],
    ["Mixed general lamp types across the whole zone (no display lighting)", "1. Establish the proportion of the zone area lit by each lamp type.<br>2. Split the zone into a number of zones matching the number of lamp types, entering the relevant proportion of area and all the zone's envelopes (including glazing) into each, with the respective lamp type."],
    ["Practical limitation", "Where graphical software cannot split envelopes equally, divide as equally as possible and record the limitation in site notes."]
  ]
},
"7.04": {
  cat: "7. Lighting",
  title: "Display Lighting",
  date: "17 Jan 2011 (am. 1 Feb 2023)",
  body: [
    ["Scenario", "Where the zone activity causes SBEM to assume display lighting but none is actually present, enter the display lighting efficiency as the <strong>same as the general lighting</strong> in that zone."],
    ["Defaults (calculation is rarely practical in existing buildings)", "1. <strong>All lamp types except tungsten / tungsten halogen:</strong> tick that display lighting uses efficient lamps and enter <strong>50 lm/cW</strong>, unless a specific value from a lighting design is known.<br>2. <strong>Tungsten or tungsten halogen:</strong> do <em>not</em> tick efficient lamps, and do not enter a lm/cW value.<br>3. <strong>Mixed, some efficient:</strong> tick efficient lamps and enter a weighted average lm/cW based on lamp numbers, using <strong>50 lm/cW</strong> for efficient lamps and <strong>15 lm/cW</strong> for tungsten / tungsten halogen."]
  ]
},
"7.05": {
