const tbNum = v => { const n = parseFloat(String(v).replace(/,/g,"")); return isFinite(n) ? n : null; };
const tbFmt = (n, dp=2) => (n===null || !isFinite(n)) ? "—" : Number(n).toLocaleString("en-GB",{minimumFractionDigits:dp, maximumFractionDigits:dp});

/* ---------- building blocks ---------- */
function tbIn(ph){ return el("input",{type:"number", inputmode:"decimal", step:"any", placeholder:ph||"", class:"tbx-in"}); }
function tbSel(opts, ph){
  const s = el("select",{class:"tbx-in"});
  if(ph) s.appendChild(el("option",{value:""},ph));
  opts.forEach(o=> Array.isArray(o) ? s.appendChild(el("option",{value:o[0]},o[1])) : s.appendChild(el("option",{value:o},o)));
  return s;
}
/* one numbered line of a calculator, like the spreadsheet's serials */
function tbLine(n, label, control, unit, hint){
  return el("div",{class:"tbx-line"},
    el("span",{class:"tbx-n"}, n),
    el("div",{class:"tbx-lab"}, el("span",{}, label), hint ? el("small",{},hint) : null),
    el("div",{class:"tbx-ctl"}, control, unit ? el("span",{class:"tbx-unit"},unit) : null));
}
function tbOut(dp=2){
  const o = el("output",{class:"tbx-out"},"—");
  o.set = (v, d=dp) => { const ok = v!==null && v!==undefined && isFinite(v); o.textContent = ok ? tbFmt(v,d) : "—"; o.classList.toggle("ok", ok); o.dataset.raw = ok ? String(+Number(v).toFixed(d)) : ""; };
  return o;
}
function tbBig(label, unit, dp=2){
  const v = el("span",{class:"tbx-bigv"},"—"), u = el("span",{class:"tbx-bigu"}, unit||"");
  const copy = el("button",{type:"button", class:"tbx-copy"},"Copy");
  const box = el("div",{class:"tbx-big"}, el("div",{class:"tbx-bigl"}, label), el("div",{class:"tbx-bigrow"}, v, u, copy));
  copy.addEventListener("click", ()=>{ const t = v.dataset.raw; if(t && navigator.clipboard) navigator.clipboard.writeText(t).then(()=>{ copy.textContent="Copied ✓"; setTimeout(()=>copy.textContent="Copy",1300); }).catch(()=>{}); });
  box.set = (n, d=dp, unitText) => { const ok = n!==null && n!==undefined && isFinite(n); v.textContent = ok ? tbFmt(n,d) : "—"; v.dataset.raw = ok ? String(+Number(n).toFixed(d)) : ""; box.classList.toggle("ok", ok); if(unitText!==undefined) u.textContent = unitText; };
  return box;
}
function tbCalc(title, ...kids){
  const box = el("div",{class:"tbx-calc"}, el("div",{class:"tbx-calc-h"}, "🧮 ", title), ...kids);
  // remember that the assessor actually used this calculator (for the calculations PDF)
  const mark = ()=>{ box.dataset.touched = "1"; };
  box.addEventListener("input", mark); box.addEventListener("change", mark);
  return box;
}
function tbInfo(html, tone){ const d = el("div",{class:"tbx-info"+(tone?" "+tone:"")}); d.innerHTML = html; return d; }
function tbFormula(html){ const d = el("div",{class:"tbx-formula"}); d.innerHTML = "<b>How it's worked out</b>"+html; return d; }
function tbHead(t){ return el("h4",{class:"tbx-h"}, t); }
function tbTable(head, rows, opts={}){
  const t = el("table",{class:"tbx-table"});
  const tr = el("tr"); head.forEach(h=> tr.appendChild(el("th",{},h))); t.appendChild(el("thead",{},tr));
  const tb = el("tbody");
  rows.forEach((r,ri)=>{
    const row = el("tr"); r.forEach(c=> row.appendChild(el("td",{}, c===null||c===undefined ? "" : String(c))));
    if(opts.onPick){ row.classList.add("pick"); row.title = "Use this value"; row.addEventListener("click", ()=> opts.onPick(r, ri, row)); }
    tb.appendChild(row);
  });
  t.appendChild(tb);
  const wrap = el("div",{class:"tbx-tablewrap"}, t);
  if(opts.search){
    const s = el("input",{type:"search", class:"tbx-search", placeholder:"🔍  "+opts.search});
    s.addEventListener("input", ()=>{ const q = s.value.trim().toLowerCase(); tb.querySelectorAll("tr").forEach(r=> r.style.display = !q || r.textContent.toLowerCase().includes(q) ? "" : "none"); });
    return el("div",{}, s, wrap);
  }
  return wrap;
}
const tbOn = (els, fn) => els.forEach(e=> e.addEventListener(e.tagName==="SELECT"?"change":"input", fn));

/* ---------- shared text from the spreadsheet ---------- */
const TB_LME_INTRO = "Local mechanical exhaust is most common in toilets, kitchen areas and other places that tend to create bad odours. When inputting local mechanical exhaust into iSBEM you need the flow in <b>litres per second per square metre</b>, which is easily worked out with: <b>Volume of room × ACH × 1000</b> = litres per hour, <b>÷ 3600</b> = litres per second, <b>÷ floor area</b> = l/s/m².";
const TB_CONV_607 = "<b>Convention 6.07 – Estimating local mechanical exhaust rates.</b> Where fan performance can't be obtained from the fan nameplate, building logbook, O&amp;M manual etc. during the site survey, approximate the air flow rate in l/s/m² using an appropriate ventilation rate from the table and converting it using the zone height (don't adjust the height to compensate for an internal ceiling). It is not acceptable to use an arbitrary value such as 5 l/s/m² or a software default where the extraction rate is unknown.";
const TB_CONV_612 = "<b>Convention 6.12 – Kitchen area.</b> All kitchen area extraction devices are included in the SBEM assessment to account for the energy used conditioning the higher air change rates – extractor hoods are no longer disregarded and form part of the zone's extract rate. If performance details are unknown, use defaults in line with Convention 6.07; where not all equipment in a zone can be identified, use the 'Assumed Extract Rate' defaults. To remove some of the fan's process power, use these default exhaust SFPs: <b>0.4</b> where the fan is within the zone, <b>0.6</b> where the fan is outside the zone.";

/* STROMA local mechanical exhaust rate calculator (used on both LME tabs) */
function tbStromaCalc(rows, rowLabel){
  const vol = tbIn("m³"), area = tbIn("m²"), h = tbIn("m"), ach = tbIn("ach");
  const pick = tbSel(rows.map((r,i)=>[String(i), r.name+"  —  "+r.ach+(typeof r.ach==="number"?" ach":"")]), "Choose from the table…");
  const msg = el("div",{class:"tbx-msg"});
  const big = tbBig("5 · Exhaust figure – enter this in SBEM","l/s/m²");
  let volTyped = false;
  vol.addEventListener("input", ()=>{ volTyped = vol.value!==""; });
  pick.addEventListener("change", ()=>{
    const r = rows[+pick.value]; msg.textContent = "";
    if(!r) return;
    if(typeof r.ach==="number") ach.value = r.ach; else { ach.value = ""; msg.textContent = "The table says \""+r.ach+"\" for this one – that isn't an air change rate, so enter one yourself."; }
    calc();
  });
  function calc(){
    const A = tbNum(area.value), H = tbNum(h.value);
    if(!volTyped && A!==null && H!==null) vol.value = +(A*H).toFixed(3);
    const V = tbNum(vol.value), N = tbNum(ach.value);
    big.set((V!==null && N!==null && A) ? V*N*1000/3600/A : null, 2);     // =SUM(J37*J40*1000/3600/J38)
  }
  tbOn([vol,area,h,ach], calc);
  const box = tbCalc("STROMA Local Mechanical Exhaust rate calculation tool",
    tbLine("1","Volume of the zone", vol, "m³", "Fills in automatically from area × height, or type it"),
    tbLine("2","Area of the zone", area, "m²"),
    tbLine("3","Height of the zone", h, "m", "As measured – don't adjust for a suspended ceiling"),
    tbLine("4","Air changes per hour", el("div",{class:"tbx-stack"}, pick, ach), "ach", rowLabel),
    msg, big,
    tbFormula("Exhaust figure = Volume × ACH × 1000 ÷ 3600 ÷ Area<br><small>Spreadsheet: <code>=SUM(J37*J40*1000/3600/J38)</code></small>"));
  box._useAch = v => { if(typeof v==="number"){ box.dataset.touched = "1"; ach.value = v; pick.value = ""; msg.textContent = ""; calc(); if(box.scrollIntoView) box.scrollIntoView({behavior:"smooth", block:"center"}); } };
  return box;
}

/* ===== 1. Local Mechanical Exhaust (2) ===== */
function tbT_LME2(){
  const root = el("div");
  root.appendChild(tbInfo(TB_LME_INTRO));
  const rows = TB.lme2.map(([a,s,v])=>({name: s ? a+" – "+s : a, ach:v})).concat(TB.dom.map(([a,s,v])=>({name:a, ach:v})));
  const calc = tbStromaCalc(rows, "Pick from the table, or tap a row in the table below");
  root.appendChild(calc);
  root.appendChild(tbHead("Air changes per hour by activity"));
  root.appendChild(tbInfo("Tap any row to use its value in the calculator.","small"));
  root.appendChild(tbTable(["Activity","Sub type (if applicable)","Air changes / hour"], TB.lme2, {search:"Filter activities…", onPick:r=>calc._useAch(r[2])}));
  root.appendChild(tbHead("Domestic situations"));
  root.appendChild(tbTable(["Activity","Sub type","Air changes / hour"], TB.dom, {onPick:r=>calc._useAch(r[2])}));
  root.appendChild(tbHead("Current conventions"));
  root.appendChild(tbInfo(TB_CONV_607));
  root.appendChild(tbInfo(TB_CONV_612));
  return root;
}

/* ===== 2. My local extract ===== */
function tbT_MyLocal(){
  const root = el("div");
  root.appendChild(tbInfo("<b>Ventilation Rate Conversion Chart.</b> Choose the area type, enter the room area and height, and the total in l/s/m² is worked out. Air change rates come from the <b>Air Exchange Data</b> tab."));
  const grid = el("div",{class:"tbx-cols"});
  for(let k=1;k<=3;k++){
    const type = tbSel(TB.aed.map(([n,v])=>[n, n]), "Choose area type…");
    const area = tbIn("m²"), h = tbIn("m");
    const vol = tbOut(2), ach = tbOut(0);
    const big = tbBig("Total","l/s/m²");
    const calc = ()=>{
      const A = tbNum(area.value), H = tbNum(h.value);
      const V = (A!==null && H!==null) ? A*H : null;                       // C7 =SUM(A7*B7)
      const row = TB.aed.find(r=>r[0]===type.value);                        // C9 =VLOOKUP(B4,'Air Exchange Data'!B3:C52,2,FALSE)
      const N = row && typeof row[1]==="number" ? row[1] : null;
      vol.set(V, 2); ach.set(N, 0);
      if(row && N===null) ach.textContent = row[1];
      big.set((V!==null && N!==null && A) ? (((V*N)*1000)/3600)/A : null, 2);  // B10 =SUM((((C7*C9)*1000)/3600)/A7)
    };
    tbOn([type,area,h], calc);
    grid.appendChild(tbCalc("Area "+k,
      tbLine("","Area type", type),
      tbLine("","Room area", area, "m²"),
      tbLine("","Room height", h, "m"),
      tbLine("","Volume", vol, "m³"),
      tbLine("","Air exchange rate", ach, "per hour"),
      big));
  }
  root.appendChild(grid);
  root.appendChild(tbFormula("Volume = Room area × Room height<br>Total = Volume × Air exchange rate × 1000 ÷ 3600 ÷ Room area<br><small>Spreadsheet: <code>=SUM((((C7*C9)*1000)/3600)/A7)</code></small>"));

  // Specific fan power
  const hp = tbIn("hp"), w = tbIn("W"), q = tbIn("l/s");
  const sfp = tbBig("Specific fan power","W/(l/s)");
  hp.addEventListener("input", ()=>{ const x = tbNum(hp.value); if(x!==null) w.value = +(x*746).toFixed(2); calcS(); });
  const calcS = ()=>{ const W = tbNum(w.value), Q = tbNum(q.value); sfp.set((W!==null && Q) ? W/Q : null, 2); };
  tbOn([w,q], calcS);
  root.appendChild(tbCalc("Specific Fan Power",

/* ===== 3. HW Storage Loss ===== */
function tbT_HW(){
  const root = el("div");
  root.appendChild(tbInfo("It is more accurate to input the storage loss in <b>megajoules</b> than to enter the volume and insulation in SBEM. Manufacturers normally state losses in kWh per 24 hours; monthly losses are the annual total divided by 12."));
  const x = tbIn("kWh"), a = tbOut(3), b = tbOut(3), c = tbOut(2);
  const big = tbBig("SBEM entry","MJ/month");
  x.addEventListener("input", ()=>{
    const X = tbNum(x.value);
    a.set(X===null?null: X/24, 3);               // D20 =SUM(D19/24)
    b.set(X===null?null: X/24*3.6, 3);           // D21 =SUM(D20*3.6)
    c.set(X===null?null: X/24*3.6*24, 2);        // D22 =SUM(D21*24)
    big.set(X===null?null: X/24*3.6*24*30.41, 2);// D24 =SUM(D19/24*3.6*24*30.41)
  });
  root.appendChild(tbCalc("STROMA Storage Loss Calculator",
    tbLine("","Storage tank loss", x, "kWh", "From the manufacturer's data plate – period of loss is 24 hours"),
    tbLine("","Loss per hour", a, "kW per hour"),
    tbLine("","Conversion to MJ per hour", b, "MJ per hour"),
    tbLine("","Conversion to MJ per day", c, "MJ per day"),
    big,
    tbFormula("SBEM entry = Loss (kWh/24h) ÷ 24 × 3.6 × 24 × 30.41<br><small>1 W = 1 J/s · 1 kWh = 3.6 MJ · Spreadsheet: <code>=SUM(D19/24*3.6*24*30.41)</code></small>")));
  root.appendChild(tbInfo("<b>Aggregating vessels.</b> Where several hot water storage vessels have exactly the same fuel type and efficiency, they can be entered in SBEM as one system using the sum of their storage losses. Vessels of different sizes can be aggregated as long as the storage loss is known for every vessel. Systems that differ by recirculation, or that use CHP or solar energy, can't be aggregated and must be entered separately."));
  return root;
}

/* ===== 4. ETL Boiler seasonal efficiency ===== */
function tbT_Boiler(){
  const root = el("div");
  root.appendChild(tbInfo("Works out the efficiency of boilers on the ETL (ECA) product list from their full and part load values, in line with the Building Services Compliance Guide 2013, section 2.4. Use it for <b>gas, oil and biomass</b> boilers only: single boilers under 400 kW output, or multiple boilers where every boiler has identical efficiencies and is under 400 kW."));
  const fuel = tbSel(TB.fuels.map(([f])=>f)); fuel.value = "Natural Gas";
  const e30 = tbIn("e.g. 95.6"), e100 = tbIn("e.g. 88.2");
  const f = tbOut(3), g30 = tbOut(4), g100 = tbOut(4), w30 = tbOut(4), w100 = tbOut(4), pre = tbOut(4), cr = tbOut(3);
  const big = tbBig("Total seasonal efficiency – enter this in SBEM","",4);
  const credWrap = el("div",{class:"tbx-checks"});
  const creds = TB.credits.filter(([,v])=> typeof v==="number").map(([n,v])=>[n.replace("Waether","Weather").trim(), v]);
  const boxes = creds.map(([n,v],i)=>{
    const id = "tbx_cred_"+i, cb = el("input",{type:"checkbox", id});
    credWrap.appendChild(el("label",{class:"tbx-check", for:id}, cb, el("span",{}, n), el("b",{}, "+"+v)));
    cb.addEventListener("change", calc);
    return [cb,v];
  });
  const warn = el("div",{class:"tbx-msg"});
  function calc(){
    const F = (TB.fuels.find(x=>x[0]===fuel.value)||[,null])[1];    // E13 =VLOOKUP($E$6,$C$42:$E$52,3)
    const A = tbNum(e30.value), B = tbNum(e100.value);
    const ga = A===null?null: A/100*F, gb = B===null?null: B/100*F;  // E14 =+E12*E13 , F14 =+F12*F13
    const wa = ga===null?null: ga*0.81, wb = gb===null?null: gb*0.19; // E16 =+E14*E15 , F16 =+F14*F15
    const p = (wa===null||wb===null)?null: wa+wb;                     // E18 =+E16+F16
    const c = boxes.reduce((s,[cb,v])=> s+(cb.checked?v:0),0);        // F39 =SUM(F24:F38)
    f.set(F,3); g30.set(ga,4); g100.set(gb,4); w30.set(wa,4); w100.set(wb,4); pre.set(p,4); cr.set(c/100,3); // E19 =+F39/100
    const t = p===null?null: p + c/100;                               // E20 =+E19+E18
    big.set(t, 4, t===null ? "" : "("+tbFmt(t*100,2)+"%)");
    warn.textContent = c>4 ? "⚠ The credits ticked add up to "+c+". A maximum of 4 is allowed – untick some." : "";
  }
  tbOn([fuel,e30,e100], calc);
  root.appendChild(tbCalc("Overall Boiler Seasonal Efficiency",
    tbLine("1","Choose fuel", fuel),
    tbLine("2","Boiler efficiency at 30% load", e30, "%", "From the boiler's technical details"),
    tbLine("3","Boiler efficiency at 100% load", e100, "%"),
    el("div",{class:"tbx-sub"},"Working"),
    tbLine("","Fuel conversion factor (net to gross)", f),
    tbLine("","Gross efficiency at 30% / 100% load", el("div",{class:"tbx-pair"}, g30, g100)),
    tbLine("","Weighting factors", el("div",{class:"tbx-pair"}, el("span",{class:"tbx-fixed"},"0.81"), el("span",{class:"tbx-fixed"},"0.19"))),
    tbLine("","Weighted efficiency at 30% / 100% load", el("div",{class:"tbx-pair"}, w30, w100)),
    tbLine("","Total seasonal efficiency (pre credit)", pre),
    el("div",{class:"tbx-sub"},"4 · Credits – maximum of 4 allowed"),
    credWrap, warn,
    tbLine("","Total credits selected", cr, "", "Credits ÷ 100"),
    big,
    tbFormula("Seasonal efficiency = (η<sub>30%</sub> × F × 0.81) + (η<sub>100%</sub> × F × 0.19) + credits ÷ 100<br><small>Spreadsheet: <code>E20 = E18 + E19</code> where <code>E19 = F39/100</code></small>")));
  calc();
  root.appendChild(tbHead("Net to gross conversion factors"));
  root.appendChild(tbTable(["Fuel","Net to gross conversion factor"], TB.fuels));
  root.appendChild(tbInfo("Source given on the sheet: SAP 2012 version 9.92 (October 2013).","small"));
  return root;
}

/* ===== 9. Glazing Calculator ===== */
function tbT_Glazing(){
  const root = el("div");
  root.appendChild(tbInfo("Enter the width and height of each window opening and of each glazed pane in it (up to 5 panes). Use metres throughout."));
  const list = el("div",{class:"tbx-cols"});
  root.appendChild(list);
  let n = 0;
  const addWin = ()=>{
    n++;
    const ref = el("input",{type:"text", class:"tbx-in", placeholder:"e.g. W"+n});
    const ow = tbIn("width"), oh = tbIn("height");
    const panes = [], paneWrap = el("div",{class:"tbx-panes"});
    const gA = tbOut(3), oA = tbOut(3), asp = tbOut(2);
    const ff = tbBig("Frame factor","",3);
    const more = el("button",{type:"button", class:"tbx-link"},"+ Add a pane");
    const calc = ()=>{
      const W = tbNum(ow.value), H = tbNum(oh.value);
      let G = 0, any = false;
      panes.forEach(([a,b])=>{ const x=tbNum(a.value), y=tbNum(b.value); if(x!==null && y!==null){ G += x*y; any = true; } });  // N =(D*E)+(F*G)+(H*I)+(J*K)+(L*M)
      const O = (W!==null && H!==null) ? W*H : null;                                                                            // O =B*C
      gA.set(any?G:null,3); oA.set(O,3);
      ff.set((O && any) ? 1-(G/O) : null, 3);                                                                                  // P =1-(N/O)
      asp.set((W && H!==null) ? H/W : null, 2);                                                                                 // Q =C/B
    };
    const addPane = ()=>{
      if(panes.length>=5) return;
      const a = tbIn("width"), b = tbIn("height");
      tbOn([a,b], calc);
      panes.push([a,b]);
      paneWrap.appendChild(el("div",{class:"tbx-pane"}, el("span",{},"Pane "+panes.length), a, el("span",{class:"tbx-x"},"×"), b, el("span",{class:"tbx-unit"},"m")));
      more.style.display = panes.length>=5 ? "none" : "";
    };
    more.addEventListener("click", addPane);
    tbOn([ow,oh], calc);
    addPane();
    const del = el("button",{type:"button", class:"tbx-del", title:"Remove this window"},"✕");
    const card = tbCalc("Window "+n,
      tbLine("","Window reference", ref),
      tbLine("","Opening", el("div",{class:"tbx-pair"}, ow, el("span",{class:"tbx-x"},"×"), oh), "m", "Width × height"),
      el("div",{class:"tbx-sub"},"Glazing"), paneWrap, more,
      tbLine("","Glazing area", gA, "m²"), tbLine("","Opening area", oA, "m²"), tbLine("","Aspect ratio", asp, "", "Height ÷ width"),
      ff);
    card.querySelector(".tbx-calc-h").appendChild(del);
    del.addEventListener("click", ()=>{ if(list.children.length>1) card.remove(); });
    list.appendChild(card);
  };
  addWin();
  const add = el("button",{type:"button", class:"tbx-btn"},"+ Add another window");
  add.addEventListener("click", addWin);
  root.appendChild(add);
  root.appendChild(tbFormula("Glazing area = sum of (pane width × pane height) · Opening area = width × height<br>Frame factor = 1 − (Glazing area ÷ Opening area) · Aspect ratio = height ÷ width<br><small>Spreadsheet: <code>=(D4*E4)+(F4*G4)+…</code>, <code>=B4*C4</code>, <code>=1-(N4/O4)</code>, <code>=C4/B4</code></small>"));
  return root;
}

/* Built once and kept, so figures stay put while you switch between the form and the tools.
   The browser Back button works inside the toolbox: tool -> all tools -> back to the form. */
let tbRoot = null, tbDepth = 0;
function tbBuild(){
  tbRoot = el("div",{class:"tbx", role:"dialog", "aria-modal":"true", "aria-label":"Assessor toolbox", style:"display:none;"});
  const bar = el("div",{class:"tbx-bar"});
  const back = el("button",{type:"button", class:"tbx-back"},"‹ All tools");
  const title = el("div",{class:"tbx-bartitle"}, el("span",{class:"tbx-baricon"},"🧰"), el("span",{},"Assessor Toolbox"));
  const close = el("button",{type:"button", class:"tbx-close", "aria-label":"Close toolbox and return to the form"},"Back to form ✕");
  bar.appendChild(back); bar.appendChild(title); bar.appendChild(close);
  const main = el("div",{class:"tbx-main"});
  const home = el("div",{class:"tbx-home"});
  home.appendChild(el("div",{class:"tbx-hero"},
    el("h2",{},"Calculators & reference data"),
    el("p",{},"Everything from the Data and Supporting Calculations workbook, one card per spreadsheet tab. Any calculator you use is added to a calculations PDF when you generate the site note."),
    el("div",{class:"tbx-legend"}, el("span",{class:"lg-in"},"Yellow boxes – enter a value"), el("span",{class:"lg-out"},"Green boxes – the answer"))));
  const grid = el("div",{class:"tbx-grid"});
  TB_TOOLS.forEach((t,i)=>{
    const card = el("button",{type:"button", class:"tbx-card", style:"--c:"+t.color, "data-id":t.id},
      el("span",{class:"tbx-card-icon"}, t.icon),
      el("span",{class:"tbx-card-num"}, "Tab "+(i+1)),
      el("span",{class:"tbx-card-title"}, t.title),
      el("span",{class:"tbx-card-desc"}, t.desc),
      el("span",{class:"tbx-card-used"},"✓ Used – in the PDF"),
      el("span",{class:"tbx-card-go"},"Open ›"));
    card.addEventListener("click", ()=> tbGo(t.id));
    grid.appendChild(card);
  });
  home.appendChild(grid);
  main.appendChild(home);
  const views = {};
  tbRoot._views = views;
  function show(id){
    const t = TB_TOOLS.find(x=>x.id===id);
    Object.values(views).forEach(v=> v.style.display = "none");
    if(!t){
      home.style.display = ""; back.style.visibility = "hidden"; title.lastChild.textContent = "Assessor Toolbox"; main.scrollTop = 0;
      const used = new Set(tbCollectUsed().map(u=>u.title));
      grid.querySelectorAll(".tbx-card").forEach(c=> c.classList.toggle("used", used.has(TB_TOOLS.find(x=>x.id===c.dataset.id).title)));
      return;
    }
    home.style.display = "none"; back.style.visibility = "";
    title.lastChild.textContent = t.title;
    if(!views[id]){
      const i = TB_TOOLS.indexOf(t);
      const prev = TB_TOOLS[(i-1+TB_TOOLS.length)%TB_TOOLS.length], next = TB_TOOLS[(i+1)%TB_TOOLS.length];
      const pb = el("button",{type:"button", class:"tbx-step"},"‹ "+prev.title), nb = el("button",{type:"button", class:"tbx-step"}, next.title+" ›");
      pb.addEventListener("click", ()=> tbGo(prev.id, true)); nb.addEventListener("click", ()=> tbGo(next.id, true));
      views[id] = el("div",{class:"tbx-view", style:"--c:"+t.color},
        el("div",{class:"tbx-viewhead"}, el("span",{class:"tbx-viewicon"}, t.icon), el("div",{}, el("div",{class:"tbx-viewtab"},"Tab "+(i+1)+" of "+TB_TOOLS.length), el("h2",{}, t.title))),
        t.build(),
        el("div",{class:"tbx-steps"}, pb, nb));
      main.appendChild(views[id]);
    }
    views[id].style.display = "";
    main.scrollTop = 0;
  }
  back.addEventListener("click", ()=>{ if(tbDepth>=2) history.back(); else show(null); });
  close.addEventListener("click", tbClose);
  tbRoot._show = show;
  tbRoot.appendChild(bar); tbRoot.appendChild(main);
  document.body.appendChild(tbRoot);
}
function tbDisplay(on){
  if(!tbRoot) return;
  tbRoot.style.display = on ? "" : "none";
  document.body.classList.toggle("tbx-open", on);
  if(on) document.addEventListener("keydown", tbKey); else document.removeEventListener("keydown", tbKey);
}
/* open a tool (or the home page) and add a browser history step for it */
function tbGo(id, replace){
  const st = {tbx: id || "home"};
  if(replace){ history.replaceState(st, ""); }
  else { history.pushState(st, ""); tbDepth++; }
  tbRoot._show(id || null);
}
function openToolbox(toolId){
  if(!tbRoot) tbBuild();

/* ---------- Which tools were used, and what they show ----------
   A calculator counts as "used" once the assessor has typed or picked
   something in it and it shows an answer. Only those go in the PDF. */
function tbCtlText(ctl){
  const stack = ctl.querySelector(".tbx-stack");
  if(stack){
    const inp = stack.querySelector("input"), sel = stack.querySelector("select");
    const v = inp && inp.value.trim();
    const from = sel && sel.value!=="" ? sel.options[sel.selectedIndex].text.replace(/\s+—\s+.*$/,"") : "";
    return v ? v + (from ? "  (table: "+from+")" : "") : "";
  }
  const parts = [];
  ctl.querySelectorAll("input, select, output, .tbx-fixed, .tbx-x").forEach(n=>{
    if(n.classList.contains("tbx-x")){ parts.push("×"); return; }
    let v = n.tagName==="SELECT" ? (n.value!=="" ? n.options[n.selectedIndex].text : "") : (n.tagName==="INPUT" ? n.value : n.textContent);
    v = (v||"").trim();
    parts.push(v==="—" ? "" : v);
  });
  let out = "", prevSep = "";
  parts.forEach(p=>{
    if(p==="×"){ prevSep = " × "; return; }
    if(!p){ return; }
    out += (out ? (prevSep || " / ") : "") + p; prevSep = "";
  });
  return out;
}
function tbScrapeCalc(c){
  const h = c.querySelector(".tbx-calc-h");
  const title = h ? Array.from(h.childNodes).filter(n=>n.nodeType===3).map(n=>n.textContent).join("").replace(/🧮/g,"").trim() : "";
  const rows = [];
  let formula = "";
  Array.from(c.children).forEach(n=>{
    const cl = n.classList;
    if(cl.contains("tbx-line")){
      const lab = n.querySelector(".tbx-lab > span"), unit = n.querySelector(".tbx-ctl > .tbx-unit");
      const v = tbCtlText(n.querySelector(".tbx-ctl"));
      if(v) rows.push({k:"line", label: lab ? lab.textContent.trim() : "", value:v, unit: unit ? unit.textContent.trim() : ""});
    } else if(cl.contains("tbx-sub")){
      rows.push({k:"sub", label:n.textContent.trim()});
    } else if(cl.contains("tbx-panes")){
      n.querySelectorAll(".tbx-pane").forEach(p=>{
        const ins = p.querySelectorAll("input");
        if(ins[0].value || ins[1].value) rows.push({k:"line", label:p.firstChild.textContent, value:(ins[0].value||"?")+" × "+(ins[1].value||"?"), unit:"m"});
      });
    } else if(cl.contains("tbx-checks")){
      const on = Array.from(n.querySelectorAll("label")).filter(l=>l.querySelector("input").checked).map(l=> l.querySelector("span").textContent+" ("+l.querySelector("b").textContent+")");
      rows.push({k:"line", label:"Credits selected", value: on.length ? on.join(", ") : "None", unit:""});
    } else if(cl.contains("tbx-msg") && n.textContent.trim()){
      rows.push({k:"msg", label:n.textContent.trim()});
    } else if(cl.contains("tbx-big") && cl.contains("ok")){
      rows.push({k:"result", label:n.querySelector(".tbx-bigl").textContent.trim(), value:n.querySelector(".tbx-bigv").textContent.trim(), unit:n.querySelector(".tbx-bigu").textContent.trim()});
    } else if(cl.contains("tbx-formula")){
      const f = n.cloneNode(true);
      f.querySelectorAll("b, small").forEach(x=>x.remove());
      f.querySelectorAll("br").forEach(x=> x.replaceWith("\n"));
      formula = f.textContent.trim();
    }
  });
  return {title, rows, formula};
}
function tbCollectUsed(){
  if(!tbRoot || !tbRoot._views) return [];
  const out = [];
  TB_TOOLS.forEach((t,i)=>{
    const view = tbRoot._views[t.id]; if(!view) return;
    const calcs = Array.from(view.querySelectorAll(".tbx-calc")).filter(c=> c.dataset.touched && c.querySelector(".tbx-big.ok"));
    if(!calcs.length) return;
    // a formula shown below a group of calculators applies to each of them
    const loose = Array.from(view.querySelectorAll(".tbx-formula")).filter(f=>!f.closest(".tbx-calc"));
    out.push({tab:i+1, title:t.title, color:t.color, calcs:calcs.map(c=>{
      const r = tbScrapeCalc(c);
      if(!r.formula){
        const f = loose.find(f=> c.compareDocumentPosition(f) & Node.DOCUMENT_POSITION_FOLLOWING);
        if(f){ const x = f.cloneNode(true); x.querySelectorAll("b, small").forEach(n=>n.remove()); x.querySelectorAll("br").forEach(n=>n.replaceWith("\n")); r.formula = x.textContent.trim(); }
      }
      return r;
    })});
  });
  return out;
}
function tbResetAll(){
  if(!tbRoot) return;
  if(tbRoot.style.display!=="none") tbClose();
  tbRoot.remove(); tbRoot = null;
}

/* ---------- PDF of the calculations used ---------- */
const JSPDF_URL = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
const JSPDF_AT_URL = "https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js";
let jspdfPromise = null;
function tbLoadScript(src){
  return new Promise((res,rej)=>{ const s = document.createElement("script"); s.src = src; s.async = true; s.onload = res; s.onerror = ()=> rej(new Error("Could not load "+src)); document.head.appendChild(s); });
}
function loadJsPdf(){
  if(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API.autoTable) return Promise.resolve(window.jspdf.jsPDF);
  if(!jspdfPromise){
    jspdfPromise = tbLoadScript(JSPDF_URL).then(()=> tbLoadScript(JSPDF_AT_URL)).then(()=>{
      if(!(window.jspdf && window.jspdf.jsPDF)) throw new Error("PDF library did not initialise");
      return window.jspdf.jsPDF;
    }).catch(e=>{ jspdfPromise = null; throw e; });
  }
  return jspdfPromise;
}
/* the built-in PDF fonts only cover Western European characters */
function tbPdfText(s){
  return String(s||"")
    .replace(/η/g,"eff").replace(/\u2212/g,"-").replace(/Σ/g,"sum").replace(/≈/g,"~").replace(/→/g,"->").replace(/[✓✕⚠]/g,"")
    .replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF\uFE0F]/gu,"").replace(/[^\x00-\xFF\u2013\u2014\u2018\u2019\u201C\u201D\u2022\u2026\u20AC]/g,"").trim();
}
function tbHexRgb(h){ h = h.replace("#",""); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; }

async function tbBuildPdf(used, meta, J){
  const jsPDF = J || await loadJsPdf();
  const doc = new jsPDF({unit:"mm", format:"a4"});
  const W = 210, M = 16, TEAL = [45,106,106], INK = [30,41,59], GREY = [100,116,139];
  const T = tbPdfText;

  // cover block
  doc.setFillColor(...TEAL); doc.rect(0,0,W,34,"F");
  doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(20);
  doc.text("Supporting Calculations", M, 16);
  doc.setFont("helvetica","normal"); doc.setFontSize(10.5);
  doc.text("Non-Domestic Energy Assessment  •  CSR Sustain", M, 25);
  let y = 46;
  const metaRows = [["Site", T(meta.address || "—")+(meta.postcode ? ", "+T(meta.postcode) : "")],
    ["Assessor", T(meta.assessor || "—")+(meta.membership ? "  ("+T(meta.membership)+")" : "")],
    ["Date of inspection", T(meta.dateFmt || "—")], ["Generated", T(meta.generated)],
    ["Tools used", used.map(u=> "Tab "+u.tab+" – "+T(u.title)).join("\n")]];
  doc.autoTable({startY:y, margin:{left:M,right:M}, body:metaRows, theme:"plain",
    styles:{font:"helvetica", fontSize:10, cellPadding:{top:1.6,bottom:1.6,left:0,right:2}, textColor:INK},
    columnStyles:{0:{cellWidth:42, textColor:GREY}, 1:{fontStyle:"bold"}}});
  y = doc.lastAutoTable.finalY + 8;

  used.forEach(u=>{
    const col = tbHexRgb(u.color);
    if(y > 250){ doc.addPage(); y = 20; }
    doc.setFillColor(...col); doc.rect(M, y, 3, 11, "F");
    doc.setTextColor(...col); doc.setFont("helvetica","bold"); doc.setFontSize(9);
    doc.text("TAB "+u.tab, M+6, y+4);
    doc.setTextColor(...INK); doc.setFontSize(14);
    doc.text(T(u.title), M+6, y+10);
    y += 16;
    u.calcs.forEach(c=>{
      if(y > 255){ doc.addPage(); y = 20; }
      doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...INK);
      doc.text(T(c.title), M, y); y += 2.5;
      const body = [];
      c.rows.forEach(r=>{
        if(r.k==="sub") body.push([{content:T(r.label).toUpperCase(), colSpan:3, styles:{fontStyle:"bold", fontSize:8, textColor:GREY, fillColor:[241,245,249]}}]);
        else if(r.k==="msg") body.push([{content:T(r.label), colSpan:3, styles:{fontStyle:"italic", textColor:[180,83,9]}}]);
        else if(r.k==="result") body.push([{content:T(r.label), styles:{fontStyle:"bold"}}, {content:T(r.value), styles:{fontStyle:"bold", fontSize:12, textColor:[20,83,45]}}, {content:T(r.unit), styles:{fontStyle:"bold"}}].map(x=>(x.styles.fillColor=[220,252,231], x)));
        else body.push([T(r.label), T(r.value), T(r.unit)]);
      });
      doc.autoTable({startY:y, margin:{left:M,right:M}, head:[["Item","Value","Unit"]], body,
        theme:"grid", headStyles:{fillColor:col, textColor:255, fontStyle:"bold"},
        styles:{font:"helvetica", fontSize:9.5, cellPadding:2.2, lineColor:[226,232,240], lineWidth:0.2, textColor:INK, valign:"middle"},
        columnStyles:{0:{cellWidth:88}, 1:{cellWidth:60}, 2:{cellWidth:"auto"}}});
      y = doc.lastAutoTable.finalY + 4;
      if(c.formula){
        doc.setFont("helvetica","italic"); doc.setFontSize(8.5); doc.setTextColor(...GREY);
        const lines = doc.splitTextToSize("Formula: "+T(c.formula).replace(/\n/g,"  |  "), W-2*M);
        if(y + lines.length*4 > 282){ doc.addPage(); y = 20; }
        doc.text(lines, M, y+2); y += lines.length*4 + 4;
      }
      y += 3;
    });
    y += 4;
  });

  const n = doc.getNumberOfPages();
  for(let i=1;i<=n;i++){
    doc.setPage(i);
    doc.setDrawColor(226,232,240); doc.line(M, 286, W-M, 286);
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...GREY);
    doc.text(T("Supporting calculations – "+(meta.address||"")), M, 291);
    doc.text("Page "+i+" of "+n, W-M, 291, {align:"right"});
  }
  return doc.output("blob");
}

/* ---------- calculations in the email body ---------- */

/* ==========================================================================
   BOILER LOOK-UP – SAP Product Characteristics Database (PCDB)
   Data: Table 105 (Gas and Oil Boilers) from the PCDB data file published by
   BRE for DESNZ, © Crown copyright, used with permission. It is stored in the
   repo as data/pcdb-boilers.json and only downloaded when the look-up is used.
   To update: download the latest PCDF from the PCDB website and run
   pcdb_to_json.py over it, then replace data/pcdb-boilers.json.
   ========================================================================== */
const PCDB_URL = "data/pcdb-boilers.json";
const PCDB_SEARCH_PAGE = "https://www.ncm-pcdb.org.uk/sap/pcdbsearch.jsp?pid=26";
const PCDB_FUEL = {1:"Mains gas", 2:"LPG", 4:"Heating oil", 71:"Bio-liquid (HVO)"};
const PCDB_FUEL_TO_FORM = {1:"Natural gas", 2:"LPG", 4:"Oil"};        // matches the form's Fuel lists
const PCDB_TYPE = {1:"Regular", 2:"Combi", 3:"CPSU"};
let pcdbPromise = null;
function pcdbLoad(){
  if(!pcdbPromise){
    pcdbPromise = fetch(PCDB_URL).then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(d=>{
        d.rows.forEach(r=>{ r.hay = (r[1]+" "+r[2]+" "+r[3]+" "+r[4]+" "+r[0]).toLowerCase(); });
        return d;
      })
      .catch(e=>{ pcdbPromise = null; throw e; });
  }
  return pcdbPromise;
}
function pcdbOutput(r){
  const a = r[7], b = r[8];
  if(a==null && b==null) return "";
  const f = x => (+x).toLocaleString("en-GB",{maximumFractionDigits:1});
  return (a!=null && b!=null && a!==b) ? f(a)+"–"+f(b)+" kW" : f(a!=null?a:b)+" kW";
}
function pcdbName(r){
  // add the manufacturer when the brand alone wouldn't say who makes it (e.g. "Pro A28" -> "Vokera Pro A28")
  const brand = String(r[2]||""), mfr = String(r[1]||"");
  const first = (brand.split(/\s+/)[0]||"").toLowerCase();
  const pre = mfr && first && !mfr.toLowerCase().includes(first) && !brand.toLowerCase().includes(mfr.split(/\s+/)[0].toLowerCase()) ? mfr.split(/\s+/)[0] : "";
  return [pre, brand, r[3], r[4]].filter(Boolean).join(" ").replace(/\s+/g," ").trim();
}

/* Code meanings checked against the labelled PCDB web pages (records 016770, 017150, 008182).
   Codes not confirmed there are left blank rather than guessed. */
const PCDB_CONDENSING = {1:"No", 2:"Yes"};
const PCDB_BURNER = {1:"On-off", 2:"Variable (stepped or modulating)"};
const PCDB_MOUNTING = {1:"Floor", 2:"Wall"};
const PCDB_FLUE = {2:"Room-sealed", 3:"Open or room-sealed"};
const PCDB_CATEGORY = {2:"SEDBUK based on certified data"};
const pcdbPct = v => (v===null || v===undefined || v==="") ? "—" : (+v).toFixed(1)+"%";
/* technical data for one PCDB record, as label rows (same wording as the PCDB website) */
function pcdbLabelRows(r, rev){
  const years = (r[9] || "?") + " – " + (r[10]==="current" ? "current" : (r[10] || "?"));
  const rows = [
    ["PCDB number", r[0]], ["Manufacturer", r[1]], ["Brand name", r[2]], ["Model name", r[3]], ["Model qualifier", r[4] || "—"],
    ["Boiler ID", r[11] || "—"], ["Fuel", PCDB_FUEL[r[5]] || String(r[5])], ["Main type", PCDB_TYPE[r[6]] || "—"], ["Output power", pcdbOutput(r) || "—"]
  ];
  if(r.length > 12){
    rows.push(
      ["Seasonal efficiency when used in non-domestic buildings", pcdbPct(r[14])],
      ["SAP winter seasonal efficiency", pcdbPct(r[12])],
      ["SAP summer seasonal efficiency", pcdbPct(r[13])],
      ["Comparative hot water efficiency", pcdbPct(r[15])],
      ["Efficiency category", PCDB_CATEGORY[r[21]] || "—"],
      ["SAP equation used", r[20] ? String(r[20]) : "—"],
      ["Condensing", PCDB_CONDENSING[r[16]] || "—"],
      ["Burner control", PCDB_BURNER[r[17]] || "—"],
      ["Mounting position", PCDB_MOUNTING[r[18]] || "—"],
      ["Flue type", PCDB_FLUE[r[19]] || "—"]);
  }
  rows.push(["Years manufactured", years], ["PCDB revision", rev ? String(rev) : "—"]);
  return rows;
}

/* Filter-style finder, like the PCDB website: Fuel → Main type → Brand → Model → Qualifier.
   The chosen product's technical data shows as a label beside the filters. */
function openPcdbFinder(onPick, current){
  const scrim = el("div",{class:"modal-scrim", role:"dialog", "aria-modal":"true", "aria-label":"Find a boiler"});
  const card = el("div",{class:"modal-card pcdb-card"});
  const close = el("button",{type:"button", class:"lamp-card-close", "aria-label":"Close"},"×");
  card.appendChild(el("div",{class:"guide-top"},
    el("div",{}, el("div",{class:"guide-kicker"},"Product Characteristics Database (PCDB)"), el("h3",{},"Search for boilers")), close));
  const mk = (ph)=> el("select",{class:"pcdb-sel"}, el("option",{value:""},ph));
  const sFuel = mk("Any fuel"), sType = mk("Any type"), sBrand = mk("Select"), sModel = mk("Select"), sQual = mk("Select");
  const line = (label, sel)=> el("label",{class:"pcdb-fline"}, el("span",{}, label), sel);
  const reset = el("button",{type:"button", class:"pcdb-reset"},"Clear filters");
  const status = el("div",{class:"pcdb-status"},"Loading the boiler database…");
  const filters = el("div",{class:"pcdb-filters"},
    line("Fuel", sFuel), line("Main type", sType), line("Brand name", sBrand), line("Model name", sModel), line("Model qualifier", sQual),
    el("div",{class:"pcdb-factions"}, status, reset));
  const label = el("div",{class:"pcdb-label"});
  card.appendChild(el("div",{class:"pcdb-body"}, filters, label));
  card.appendChild(el("div",{class:"pcdb-foot"},
    "Product data: SAP 10 PCDB, © Crown copyright, used with permission. The database covers SAP (domestic-scale) boilers, so larger commercial boilers may not be listed – use manufacturer data for those. ",
    el("a",{href:PCDB_SEARCH_PAGE, target:"_blank", rel:"noopener"},"PCDB website")));
  scrim.appendChild(card);
  const onKey = e=>{ if(e.key==="Escape") done(); };
  const done = ()=>{ document.removeEventListener("keydown", onKey); scrim.remove(); };
  close.addEventListener("click", done);
  scrim.addEventListener("click", e=>{ if(e.target===scrim) done(); });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(scrim);

  let data = null;
  const QUAL_NONE = "\u0000none";
  const fill = (sel, values, keep, fmt)=>{
    const ph = sel.options[0].textContent;
    sel.innerHTML = ""; sel.appendChild(el("option",{value:""},ph));
    values.forEach(v=> sel.appendChild(el("option",{value:String(v)}, fmt ? fmt(v) : (v===QUAL_NONE ? "(none)" : v))));
    sel.value = values.map(String).includes(String(keep)) ? String(keep) : "";
  };
  const uniq = (rows, fn)=> Array.from(new Set(rows.map(fn))).sort((a,b)=> String(a).localeCompare(String(b),"en",{numeric:true, sensitivity:"base"}));
  const match = (r, upto)=>{
    if(upto>=1 && sFuel.value && r[5]!==+sFuel.value) return false;
    if(upto>=2 && sType.value && r[6]!==+sType.value) return false;
    if(upto>=3 && sBrand.value && r[2]!==sBrand.value) return false;
    if(upto>=4 && sModel.value && r[3]!==sModel.value) return false;
    if(upto>=5 && sQual.value && (r[4]||QUAL_NONE)!==sQual.value) return false;
    return true;
  };
  // rebuild the lists below the one that changed (level 0 = everything)
  function refresh(level){
    const rows = data.rows;
    if(level<1) fill(sFuel, uniq(rows, r=>r[5]), sFuel.value, v=> PCDB_FUEL[v] || "Fuel "+v);
    if(level<2) fill(sType, uniq(rows.filter(r=>match(r,1)), r=>r[6]), sType.value, v=> PCDB_TYPE[v] || "Type "+v);
    if(level<3) fill(sBrand, uniq(rows.filter(r=>match(r,2)), r=>r[2]), sBrand.value);
    if(level<4){ fill(sModel, sBrand.value ? uniq(rows.filter(r=>match(r,3)), r=>r[3]) : [], sModel.value); sModel.disabled = !sBrand.value; }
    if(level<5){
      const qs = sModel.value ? uniq(rows.filter(r=>match(r,4)), r=> r[4] || QUAL_NONE) : [];
      fill(sQual, qs, sQual.value);
      if(qs.length===1) sQual.value = String(qs[0]);
      sQual.disabled = !sModel.value;
    }
    const hits = rows.filter(r=>match(r,5));
    status.textContent = hits.length.toLocaleString("en-GB")+" boiler"+(hits.length===1?"":"s")+" match";
    lastHits = hits;
    showLabel(sModel.value && hits.length===1 ? hits[0] : null, hits.length);
  }
  let lastHits = [];
  // several boilers still match (e.g. the same model in gas and LPG): list them so one can be picked
  function showChoices(hits){
    label.innerHTML = ""; label.classList.add("ready","choices");
    label.appendChild(el("div",{class:"pcdb-label-head"},
      el("div",{class:"pcdb-label-kicker"}, hits.length+" boilers match"),
      el("div",{class:"pcdb-label-name"}, "Pick the right one"),
      el("div",{class:"pcdb-choice-hint"},"They share a name but differ in fuel, type, output or years – check the data plate.")));
    const list = el("div",{class:"pcdb-choices"});
    hits.slice().sort((a,b)=> (a[5]-b[5]) || (a[6]-b[6]) || ((a[8]||0)-(b[8]||0)) || String(a[9]).localeCompare(String(b[9]))).forEach(r=>{
      const years = (r[9]||"?")+"–"+(r[10]==="current"?"current":(r[10]||"?"));
      const b = el("button",{type:"button", class:"pcdb-choice"},
        el("span",{class:"pcdb-choice-main"}, [PCDB_FUEL[r[5]], PCDB_TYPE[r[6]], pcdbOutput(r)].filter(Boolean).join(" · ")),
        el("span",{class:"pcdb-choice-sub"}, years + (r[11] ? " · "+r[11] : "") + " · PCDB "+r[0]),
        r[14]!=null ? el("span",{class:"pcdb-choice-eff"}, pcdbPct(r[14])) : null);
      b.addEventListener("click", ()=> showLabel(r, hits.length, true));
      list.appendChild(b);
    });
    label.appendChild(list);
  }
  function showLabel(r, n, fromChoices){
    label.innerHTML = ""; label.classList.remove("choices");
    if(!r && sModel.value && n>1 && n<=60){ showChoices(lastHits); return; }
    if(!r){
      label.classList.remove("ready");
      label.appendChild(el("div",{class:"pcdb-label-empty"},
        el("div",{class:"pcdb-label-icon"},"🔥"),
        el("strong",{},"Technical data"),
        el("p",{}, sModel.value && n>1 ? "Choose a model qualifier (or a fuel or type) to narrow it down." : "Choose the brand and model (and fuel or type if you know them). The boiler's technical data will appear here.")));
      return;
    }
    label.classList.add("ready");
    label.appendChild(el("div",{class:"pcdb-label-head"},
      el("div",{class:"pcdb-label-kicker"},"PCDB "+r[0]),
      el("div",{class:"pcdb-label-name"}, pcdbName(r)),
      el("div",{class:"pcdb-label-tags"}, el("span",{}, PCDB_FUEL[r[5]] || ""), el("span",{}, PCDB_TYPE[r[6]] || ""), r[10]==="current" ? el("span",{class:"cur"},"Current model") : null)));
    const tbl = el("dl",{class:"pcdb-label-dl"});
    if(r[14]!==null && r[14]!==undefined)
      label.appendChild(el("div",{class:"pcdb-label-key"},
        el("span",{},"Seasonal efficiency when used in non-domestic buildings"), el("strong",{}, pcdbPct(r[14]))));
    pcdbLabelRows(r, data.meta && data.meta.revision).forEach(([k,v])=>{
      if(k==="Seasonal efficiency when used in non-domestic buildings") return;   // shown above
      tbl.appendChild(el("dt",{},k)); tbl.appendChild(el("dd",{}, v));
    });
    label.appendChild(tbl);
    const use = el("button",{type:"button", class:"pcdb-use"},"Use this boiler ✓");
    use.addEventListener("click", ()=>{ done(); onPick(r, data.meta && data.meta.revision); });
    label.appendChild(use);
    if(fromChoices){
      const back = el("button",{type:"button", class:"pcdb-back"},"‹ Back to the "+lastHits.length+" matches");
      back.addEventListener("click", ()=> showChoices(lastHits));
      label.appendChild(back);
    }
    label.appendChild(el("a",{class:"pcdb-label-link", href:PCDB_SEARCH_PAGE, target:"_blank", rel:"noopener"},"Open the PCDB website ↗"));
  }
  [[sFuel,1],[sType,2],[sBrand,3],[sModel,4],[sQual,5]].forEach(([s,lvl])=> s.addEventListener("change", ()=> refresh(lvl)));
  reset.addEventListener("click", ()=>{ [sFuel,sType,sBrand,sModel,sQual].forEach(s=> s.value=""); refresh(0); });

  pcdbLoad().then(d=>{
    data = d;
    // reopening a row that already has a boiler: start on that boiler
    const r0 = current && d.rows.find(r=>r[0]===current);
    if(r0){
      refresh(0); sFuel.value = String(r0[5]); refresh(1); sType.value = String(r0[6]); refresh(2);
      sBrand.value = r0[2]; refresh(3); sModel.value = r0[3]; refresh(4); sQual.value = r0[4] || QUAL_NONE; refresh(5);
    } else refresh(0);
    setTimeout(()=> (r0 ? label.querySelector(".pcdb-use") : sBrand).focus(), 0);
  }).catch(()=>{
    status.textContent = "Couldn't load the boiler database. It needs a connection the first time it's used, and the form must be opened from its GitHub Pages address.";
    showLabel(null,0);
  });
}

/* fills a HVAC / DHW row from a PCDB record and keeps the record for the site note */
function pcdbFillRow(tr, key, r, rev){
  const inp = tr.querySelector(`[data-key="${key}"]`);
  const hid = tr.querySelector(`[data-key="${key}__pcdb"]`);
  if(hid) hid.value = JSON.stringify({rec:r.slice(0,22), rev:rev||null});
  if(inp){ inp.value = pcdbName(r)+" (PCDB "+r[0]+")"; inp.dataset.pcdbText = inp.value; inp.dispatchEvent(new Event("input",{bubbles:true})); }
  const fuelSel = tr.querySelector('[data-key="fuel"]');
  const f = PCDB_FUEL_TO_FORM[r[5]];
  if(fuelSel && f && Array.from(fuelSel.options).some(o=>o.value===f)){ fuelSel.value = f; fuelSel.dispatchEvent(new Event("change",{bubbles:true})); }
}
/* boilers chosen from the PCDB in a table, for the site note */
function pcdbChosen(rows, key){
  const out = [];
  rows.forEach(row=>{
    const v = row[key+"__pcdb"];
    if(!v) return;
    try{ const o = JSON.parse(v); if(o && Array.isArray(o.rec)) out.push(o); }catch(e){}
  });
  return out;
}

  date: "1 Sep 2014 (am. 1 Feb 2023)",
  body: [
    ["Building type", "Kennels/catteries (main purpose is housing animals): use <strong>C2A Secure Residential Institutions</strong>. Veterinary surgeries (profile similar to a doctors' or dentists' surgery): use <strong>D1 Non-residential institutions - Primary healthcare building</strong>."],
    ["Animals housed overnight", "Conditioning is expected 24 hours a day, 7 days a week: use building type C2A Secure Residential Institutions and activity <strong>'Cell (police/prison)'</strong> for the animal holding area."],
    ["Animals not kept overnight", "Use building type C2 Residential Institutions - Hospitals and Care Homes and activity <strong>'Store room'</strong> for the animal holding area."]
  ]
},
"3.11": {
  cat: "3. Project Database",
  title: "Secondary Glazing",
  date: "1 Sep 2014",
  body: [
    ["Rule", "Where secondary glazing is present in an existing building, select from the Project Database library: <strong>'Acoustic double glazing with 200 mm interpane gap'</strong>."],
    ["Frame", "The frame type shall be the framing material used for the <strong>outer pane only</strong>."]
  ]
},
"3.12": {
  cat: "3. Project Database",
  title: "Multiple Window Frame Types",
  date: "1 Sep 2014",
  body: [
    ["Rule", "Where a window has frames of multiple types (e.g. a timber outer frame with metal intermediate frames), select the frame type for the material that is in <strong>direct contact with the structural opening</strong>."]
  ]
},
"3.13": {
  cat: "3. Project Database",
  title: "Sales vs Eating & Drinking Activity Selection",
  date: "1 May 2017",
  body: [
    ["Starting point", "Work to the activity descriptions provided by BRE in the iSBEM interface; the points below add guidance for specific cases."],
    ["Small food outlets / hot food takeaways (A3, A4, A5)", "Apply the Eating/drinking activity <em>only</em> to areas designated for eating and drinking - i.e. with tables (or counters) and chairs, located inside the premises. Otherwise classify the zone as a <strong>sales area</strong>."],
    ["Offices", "Generic office areas should <strong>include</strong> tea rooms, tea-making facilities, kitchenettes and staff lounges. Do not identify these as eating and drinking areas."],
    ["Reference", "Appendix 10.08 lists all building types with an 'Eating/drinking area' activity and their descriptions."]
  ]
},
"3.14": {
  cat: "3. Project Database",
  title: "Block Glazing Exteriors",
  date: "1 May 2017",
  body: [
    ["Hierarchy", "1. Where external walls or parts of them are constructed of glass blocks, enter them as <strong>Windows</strong>.<br>2. Where the specification refers to specific glass blocks and supporting technical information is available, enter U-value, T-solar and L-solar as <strong>user-defined</strong> values (retain the specification and technical data as evidence).<br>3. Where neither is available, use the defaults below."],
    ["Default values", "<strong>Pre-2002 buildings:</strong> U = 3.2 W/m&sup2;K, T-solar 0.83, L-solar 0.8, frame factor 0.00<br><strong>Post-2002 buildings:</strong> U = 2.2 W/m&sup2;K, T-solar 0.71, L-solar 0.8, frame factor 0.00"]
  ]
},

/* ---- 4. Geometry ---- */
"4.01": {
  cat: "4. Geometry",
  title: "Light Wells",
  date: "1 Jun 2010",
  body: [
    ["Rule", "Light wells are to be treated as <strong>external envelopes</strong>."],
    ["Definition", "A light well is a space surrounded by the walls of a building with no roof or glazing above it - similar in appearance to a courtyard. The surrounding walls are exposed to external air."]
  ]
},
"4.02": {
  cat: "4. Geometry",
  title: "Atria",
  date: "1 Jun 2010",
  body: [
    ["Rule", "All atria are to be treated as a <strong>Level 5</strong> NDEPC assessment feature. Refer to the Level 3/4/5 decision flowchart (appendix 10.02)."],
    ["Definition", "A non-continuously occupied interior space, often several storeys high, bounded on at least one side by occupied spaces set to activity-database conditions. The atrium itself is <em>not</em> maintained to those conditions."],
    ["Technical purpose (one or more)", "Providing a thermal buffer between adjoining spaces and the exterior; providing daylight to the middle of deep-plan spaces; encouraging stack effect or other passive ventilation to draw extract air from adjoining spaces."],
    ["Note", "If the space is conditioned and none of the above purposes apply, it is not considered an atrium in this context."]
  ]
},
"4.03": {
  cat: "4. Geometry",
  title: "Dimensions",
  date: "1 Jun 2010 (am. 17 Jan 2011)",
  body: [
    ["Rule", "Horizontal and vertical measurements (including zone height) must follow the CEPC Dimension Conventions (appendix 10.03)."],
    ["Horizontal", "Generally follow the RICS definition of Gross Internal Area. Measure to the inside of perimeter walls and to the <strong>mid-point</strong> of internal walls. Party walls are perimeter - measure to the surface, not the mid-point."],
    ["Openings", "Measure the <strong>inside structural opening</strong> (w &times; h), not just the glass area. Percentage glazing is as viewed from inside, i.e. wall area to full zone height."],
    ["Ground &amp; intermediate floors", "Zone height is top of floor to top of floor. Wall areas are calculated top of floor to top of floor (including walls above dropped ceilings)."],
    ["Top floors", "Zone height is top of floor to soffit/underside of roof slab, <em>unless</em> there is a lower ceiling forming an effective thermal boundary. Dropped <strong>permeable</strong> ceilings without insulation are treated as if at soffit/eaves level; dropped <strong>non-permeable</strong> ceilings (or permeable with insulation across the whole ceiling) set the zone height at the underside of the ceiling."],
    ["General rule", "Always input the <strong>area exposed to the inside temperature</strong>, and the U-value between that surface and outside."]
  ]
},
"4.04": {
  cat: "4. Geometry",
  title: "Measurement Accuracy (Distance, Area and Volume)",
  date: "21 Jan 2013",
  body: [
    ["Accuracy", "The minimum level of accuracy for calculated values entered into the software is <strong>2 decimal places</strong>."],
    ["Site notes", "All measurements entered into the software must be recorded to at least 2 decimal places on site notes."],
    ["Audit", "Calculated values entered for the EPC calculation must be supported by calculations presented for audit."],
    ["Exceptions", "Where the required level of accuracy is not possible, the reason must be recorded."]
  ]
},
"4.05": {
  cat: "4. Geometry",
  title: "Roofs with Multiple Components",
  date: "21 Jan 2013",
  body: [
    ["Horizontal internal ceiling present", "Enter the roof with a <strong>horizontal</strong> orientation. The roof area is the total horizontal internal surface area exposed to the conditioned space. Enter the pitch angle as the SBEM default of <strong>45&deg;</strong>."],
    ["No horizontal internal ceiling", "The roof area is the internal surface area exposed to the conditioned space. Orientation is the compass position faced by the pitched component, and the pitch angle is the actual angle of the component to the horizontal."],
    ["Multiple pitched components", "Address each component individually and enter it separately - except where components have <em>exactly</em> the same set of properties, which may be entered as one envelope with the summed area."],
    ["Reference", "See appendix 10.06 for the worked diagrams."]
  ]
},
"4.06": {
  cat: "4. Geometry",
  title: "Same Space Adjacency",
  date: "1 May 2017",
  body: [
    ["Rule", "Internal wall envelope areas of the same or similar construction within <strong>merged zones</strong> may be summed and entered as a single envelope with the adjacency <strong>'Same space'</strong>."],
    ["Orientation", "Orientation is not relevant to the EPC results for a 'Same space' envelope."],
    ["Audit", "Document the calculation for audit purposes."]
  ]
},
"4.07": {
  cat: "4. Geometry",
  title: "Zoning for Day Lit Spaces",
  date: "1 May 2017 (am. 1 Jul 2018)",
  body: [
    ["Rule", "All zones must be evaluated for day lit spaces. Many software tools offer automatic day lit zoning, which requires no subdivision by the assessor."],
    ["Manual method (where automatic zoning is not selected, not available, or is prescribed as required)", "Subdivide zones at boundaries:<br>&bull; <strong>6 m</strong> from an external wall containing at least 20% glazing<br>&bull; <strong>1.5 &times; room height</strong> beyond the edge of an array of roof lights, if the roof lights are at least 10% of the zone floor area"],
    ["Notes", "1. If a resulting zone is less than 3 m wide, absorb it into surrounding zones with the same HVAC, lighting and activity.<br>2. If resulting zones overlap, use discretion to allocate the overlap.<br>3. All other zone features (HVAC, activity, lighting) apply to each subdivided zone."]
  ]
},
"4.08": {
  cat: "4. Geometry",
  title: "Modelling a Zone Within a Zone",
  date: "1 May 2017 (am. 1 Jul 2018)",
  body: [
    ["Scenario", "A separate zone (Z2) enclosed by walls, doors, ceilings and/or windows sits within a larger space (Z1) - typically an office or toilet block in the corner of a warehouse or industrial unit. Z1a is the full-height part; Z1b is the part of Z1 extending over Z2."],
    ["Floor of Z1b", "The floor envelope of Z1b <strong>must always be entered</strong> to account for heat transfer and thermal mass."],
    ["Floor area on the EPC", "Z1b is only included in the EPC floor area if it has <strong>permanent fixed access</strong> and is usable floor space per the RICS GIA definition."],
    ["Modelling", "If the space above Z2 is accessible floor area: enter Z1a and Z1b as <strong>two separate zones</strong>, which may have different properties. If it is not accessible: enter Z1a and Z1b as a <strong>single zone</strong> with the same properties, and exclude the Z1b floor area from the zone area."]
  ]
},
"4.09": {
  cat: "4. Geometry",
  title: "Low Zone Height",
  date: "1 Jul 2024",
  body: [
    ["Rule", "Where the zone height convention gives a height of less than 1.2 m, enter the zone height as <strong>1.2 m</strong>. Do not adjust any other dimensions - all envelopes are entered at actual size. Only the zone height is adjusted."],
    ["Air changes", "The 1.2 m height is also used for calculating the zone's air changes, where applicable."],
    ["Floor area", "If <em>no</em> part of the zone has headroom of 1.5 m or more, exclude its floor area from the EPC usable floor area. If at least part has headroom greater than 1.5 m and is usable for an NCM activity, include it."]
  ]
},
"4.10": {
  cat: "4. Geometry",
  title: "Foundation Area",
  date: "1 Jul 2024",
  body: [
    ["Calculation", "Foundation area = <strong>total conditioned floor area &divide; maximum number of storeys in the overall structure</strong>. Conditioned floor area will be less than total floor area where there are unconditioned spaces."],
    ["Stand-alone building", "Maximum storeys = total storeys in the building."],
    ["Unit attached by party walls only", "(Roof area equals the footprint.) Maximum storeys = storeys in that building unit."],
    ["Unit with party floor and/or ceiling", "(It overlaps another unit.) Maximum storeys = total storeys in the overall combined structure."],
    ["Caution", "The maximum number of storeys <em>entered into SBEM</em> remains the number in the building unit being assessed - not the number in the overall structure."],
    ["Partial storeys", "A mezzanine or floor over an inner zone counts as an additional storey <strong>only if</strong> it is usable floor area."]
  ]
},

/* ---- 5. Global Building Services ---- */
"5.01": {
  cat: "5. Global Building Services",
  title: "Electric Power Factor",
  date: "21 Jan 2013",
  body: [
    ["Default", "Electric power factor within SBEM must be left at the default value of <strong>&lt;0.9</strong> unless you have provided a photograph of the power factor correction device and/or other compelling evidence to amend this figure."],
    ["Photograph only", "Where only a photograph of the power factor correction device is available, the power factor shall be amended to <strong>'0.9 to 0.95'</strong>."],
    ["Compelling evidence", "<ul style=\"margin:4px 0 0;padding-left:18px;\">"
      + "<li><strong>Photographic evidence</strong> – if the photograph confirms the actual power factor figure from the device, select the most appropriate figure within the SBEM power factor drop-down options. If the photograph cannot confirm the actual figure but shows evidence of the power factor device, select <strong>'0.90–0.95'</strong> within SBEM.</li>"
      + "<li><strong>Equipment specifications</strong> – name-plates, specification manuals and printouts from Building Management Systems (BMS).</li>"
      + "<li><strong>Utility bills.</strong></li>"
      + "<li><strong>Power factor calculations</strong> – conducted by electricians and power engineering specialists.</li>"
      + "<li><strong>Meter readings</strong> – incorporating reactive unit consumption and appropriate calculations.</li>"
      + "</ul>"]
  ]
},

/* ---- 6. HVAC ---- */
"6.01": {
  cat: "6. HVAC",
  title: "Variable Speed Pumps Other than Central Heating",
  date: "1 Jun 2010",
  body: [
    ["Rule", "Variable speed pumps other than those serving central heating are <strong>ignored</strong>, unless using approved DSM software that allows for this input option."]
  ]
},
"6.02": {
  cat: "6. HVAC",
  title: "Passive Stack Ventilation",
  date: "1 Jun 2010",
  body: [["Rule", "Treat passive stack ventilation as <strong>natural ventilation</strong>."]]
},
"6.03": {
  cat: "6. HVAC",
  title: "Electric Room Heaters",
  date: "1 Jun 2010",
  body: [
    ["Rule", "Any form of fanned or unfanned electric room heater - panel, bar, convector or storage heater - shall have a <strong>user-amended efficiency of 1 (100%)</strong>."]
  ]
},
"6.04": {
  cat: "6. HVAC",
  title: "LTHW Boiler Efficiencies",
  date: "17 Jan 2011 (am. 1 Feb 2023)",
  body: [
    ["Hierarchy for Effective Heat Generating Seasonal Efficiency", "1. <strong>ECA product list</strong> part-load values at 30% and 100%, used to calculate seasonal efficiency per the NDBSCG.<br>2. Current <strong>PCDB</strong> values where available.<br>3. Manufacturer's information, boiler plate data, or the manufacturer's technical helpdesk.<br>4. <strong>SAP 2005</strong> tables (up to 70 kW output).<br>5. A suitable <strong>SBEM default</strong> - site notes must evidence why the above methods could not be used, including evidence of failed attempts."],
    ["Non-condensing boilers", "Where a gross efficiency is established at step 3 for a non-condensing boiler, deduct <strong>0.05 (5%)</strong> to convert it to a seasonal efficiency."],
    ["Net vs gross", "Net efficiencies/values must be converted to gross per the NDBSCG."],
    ["Credits", "Add the relevant heating credits following the NDBSCG guidance."]
  ]
},
"6.05": {
  cat: "6. HVAC",
  title: "Electric HWS With and Without Storage",
  date: "17 Jan 2011",
  body: [
    ["No storage", "Enter as an <strong>instantaneous system</strong>, fuel = grid supplied electricity, seasonal efficiency = <strong>1 (100%)</strong>."],
    ["Any storage", "Do <strong>not</strong> use 'electric instantaneous system'. Use <strong>'Stand-alone water heater'</strong>. Where losses, or volume and insulation details, are also entered, the system efficiency should be 1 (100%)."]
  ]
},
"6.06": {
  cat: "6. HVAC",
  title: "HWS Efficiencies and Storage Losses",
  date: "17 Jan 2011 (am. 1 Jul 2018)",
  body: [
    ["Rule", "Storage/losses <strong>must</strong> be entered for all storage systems - preferably as losses in <strong>MJ/month</strong> rather than volume and insulation type/thickness. Record the source data and/or calculation in site notes."],
    ["Where losses cannot be established", "Enter volume and insulation details. Where these cannot be established by external visual inspection or paperwork, estimate:<br>&bull; Modern steel/plastic encased unvented cylinder <strong>&gt;50 litres</strong> (e.g. Megaflo): 50 mm factory insulation; volume from external dimensions less 50 mm<br>&bull; Modern unvented cylinder <strong>up to 50 litres</strong>, or electric multipoint: 25 mm factory insulation; volume less 25 mm<br>&bull; Point-of-use heater (typically over/under sink, up to 10 litres): 10 mm factory insulation; volume less 10 mm<br>&bull; Other HWS storage: use external dimensions as if the vessel fills the unit, no deduction for insulation; if the insulation type cannot be established, assume <strong>uninsulated</strong>"],
    ["No system / details unavailable", "Enter as an instantaneous system with no storage and a seasonal efficiency of <strong>0.5 (50%)</strong>. Enter the correct fuel where it can be readily determined, otherwise assume grid electricity."],
    ["DHW serving multiple buildings", "Apportion losses between buildings by floor area. If using volume and insulation instead, run SBEM with all storage allocated to the assessed building, read the calculated storage losses, apportion by floor area, then enter that figure as storage losses in MJ/month."]
  ]
},
"6.07": {
  cat: "6. HVAC",
  title: "Estimating Local Mechanical Exhaust Rates",
  date: "17 Jan 2011 (am. 1 Jul 2018)",
  body: [
    ["Rule", "Where fan performance cannot be obtained from the fan nameplate, building logbook or O&amp;M manual during the survey, approximate the air flow rate in l/s/m&sup2; using the appropriate air-change rate from the table at appendix 10.04, converted using the <strong>zone height</strong> (do not adjust the height to compensate for an internal ceiling)."],
    ["Not acceptable", "Using an arbitrary value such as 5 l/s/m&sup2;, or a software-applied default, where the mechanical extraction rate is unknown."],
    ["Common rates (air changes/hour)", "Office/consulting area 10; circulation area 5; toilet/locker room 10; store room 6; warehouse 6; plant room - light 30, heavy 6; car park 6; teaching areas 6; dry sports hall 6; laboratory 15; laundry 15; commercial kitchen 40; residents' kitchen 15; cafe/restaurant/public bar 15; canteen 12; hotel bar 10; fitness suite/gym 12; bathroom 10; reception 10; sales area 10; changing facility with showers 20."]
  ]
},
"6.08": {
  cat: "6. HVAC",
  title: "Estimating Local Mechanical Exhaust Specific Fan Power (SFP)",
  date: "17 Jan 2011 (am. 1 Jul 2024)",
  body: [
    ["First", "For kitchen extraction or ventilation, refer to convention <strong>6.12</strong> instead."],
    ["Where fan motor power is known", "Use the established power (from nameplate, logbook or O&amp;M manual) to calculate the SFP. Convert horsepower at 1 hp = 746 W."],
    ["Where performance details are unavailable", "Use the W/l/s override values below, based on the Building Regulations at date of build (or date of system installation, with robust evidence of full compliance). Columns: <em>pre-2006 / 2006 / 2010 / 2013 or later</em>."],
    ["Supply <em>or</em> extract only", "Local (single room or area): <strong>1.5 / 0.5 / 0.4 / 0.3</strong><br>Multi-zone <em>without</em> heating or cooling: <strong>2.0 / 1.6 / 1.4 / 0.9</strong><br>Multi-zone <em>with</em> heating and/or cooling: <strong>2.5* / 2.1 / 1.9 / 1.1</strong>"],
    ["Supply <em>and</em> extract", "Local (single room or area): <strong>2.1 / 1.2 / 0.6 / 0.5</strong><br>Multi-zone <em>without</em> heating or cooling: <strong>2.6 / 1.8 / 1.6 / 1.1</strong><br>Multi-zone <em>with</em> heating and/or cooling: <strong>3.0* / 2.5 / 2.2 / 1.6</strong>"],
    ["* Note", "For these systems only, the SBEM default may be used if better than 3.0 and the system is defined at system level."],
    ["Additional adjustments (W/l/s)", "Heat recovery incorporated <strong>+0.3</strong>; additional return filter for heat recovery <strong>+0.1</strong>; HEPA filter <strong>+0.1</strong>; humidifier/dehumidifier incorporated <strong>+0.1</strong>."],
    ["Site notes", "Record why specific fan performance was not available."]
  ]
},
"6.09": {
  cat: "6. HVAC",
  title: "Reversible Extract Fans",
  date: "1 Feb 2012",
  body: [
    ["Rule", "Reversible extract fans are treated the same as non-reversible extract fans in SBEM."],
    ["Extraction rate", "It is <strong>not</strong> acceptable to use an arbitrary value or software default where the actual rate is unknown - calculate it per convention 6.07."]
  ]
},
"6.10": {
  cat: "6. HVAC",
  title: "Hot Water Storage Vessels",
  date: "1 Feb 2012",
  body: [
    ["Aggregating storage vessels", "Vessels with exactly the same fuel type and efficiency may be entered as <strong>one system</strong> using the sum of their individual storage losses. Vessels of different sizes may be aggregated <em>provided the losses are known for every vessel</em>."],
    ["Cannot be aggregated", "Vessels identified by <strong>insulation type</strong> (SBEM derives losses from insulation type and vessel size). Systems that differ by recirculation, or by the use of CHP or solar energy, must be entered separately."],
    ["Instantaneous systems", "Multiple instantaneous systems with the same fuel type and assumed efficiency may be entered as one system and allocated to all relevant zones."]
  ]
},
"6.11": {
  cat: "6. HVAC",
  title: "Zones Without Fixed Conditioning Equipment in Existing Buildings",
  date: "1 Sep 2014 (am. 1 Jul 2018)",
  body: [
    ["Scope", "Applies where at least one zone is not conditioned by fixed conditioning equipment (heating, cooling or mechanical ventilation). Follow the flowchart at appendix 10.07 and evidence the option selected at each decision point."],
    ["Assess as seen", "Zones must be assessed as seen on the day of inspection."],
    ["Activities where zones may be unconditioned", "a) Circulation areas<br>b) Plant rooms<br>c) Store rooms and warehouse storage<br>d) Industrial process area<br>e) Car park<br>f) B1 workshops<br>g) Toilet - <em>only</em> if no other zone in the building has an expectation of conditioning"],
    ["SBEM entry", "In these circumstances select HVAC type <strong>'Zones without HVAC system'</strong>."],
    ["Shell &amp; core / first fit-out", "Determine which building service would likely be installed (justify in site notes) and assign the minimum efficiency allowed under Part L, referring to Approved Document L2 (2021)."],
    ["Default fallback", "Where the activity is not on the list above and the zone is not indirectly conditioned, assume a default HVAC of fanned electric room heaters with an Effective Heat Generating Seasonal Efficiency of <strong>100% (1)</strong>."]
  ]
},
"6.12": {
  cat: "6. HVAC",
  title: "Kitchen Area Extraction",
  date: "1 Sep 2014 (am. 1 Feb 2023)",
  body: [
    ["Rule", "All kitchen extraction and mechanical ventilation equipment must be included in the SBEM assessment to account for the energy of conditioning higher air change rates. Extractor hoods are <strong>no longer disregarded</strong>."],
    ["Default extract rates where performance is unknown", "<strong>Small kitchen / kitchenette / tea-making</strong> (single wall or window fan, very limited food prep): activity 'Generic Office', vent type 'Tea making', <strong>10 ac/h</strong><br><strong>'Domestic' type kitchen</strong> (single cooker hood and/or single wall or window fan, limited food prep): activity 'Food preparation', vent type 'Kitchen - domestic', <strong>15 ac/h</strong><br><strong>'Non-domestic' kitchen</strong> (multiple hoods and/or extract units, extensive food prep - restaurant, canteen, college): activity 'Food preparation', vent type 'Kitchen - non-domestic', <strong>40 ac/h</strong>"],
    ["Preference", "Always try to obtain and use actual performance details per convention 6.07; use the defaults only where equipment cannot be identified."],
    ["Removing 'process power' - default SFPs", "<strong>Local mechanical extract only:</strong> SFP = 0.4 where the fan is <em>within</em> the zone; SFP = 0.6 where the fan is <em>outside</em> the zone.<br><strong>Mechanical ventilation systems</strong> (whether defined at system or zone level): SFP = 0.8 where unknown, or enter <strong>50% of the actual SFP</strong> to remove the process power element."],
    ["Note", "Even if the SFP is defined at system level, this only applies to the kitchen zone."]
  ]
},
"6.13": {
  cat: "6. HVAC",
  title: "Identifying Indirectly Conditioned Zones",
  date: "1 Sep 2014 (am. 1 Feb 2023)",
  body: [
    ["Test", "A zone without any fixed conditioning equipment is assumed to be <strong>indirectly conditioned</strong> where at least <strong>50%</strong> of its surrounding envelope area - including party walls, floors and ceilings - is adjacent to directly conditioned space (or, for party envelopes, assumed to be)."],
    ["HVAC assignment", "Assign the same HVAC as the adjacent spaces, or as the larger proportion of adjacent spaces - unless there is significant air transfer with a specific adjacent zone, e.g. through a frequently used doorway."],
    ["Evidence", "Provide suitable evidence that there is no fixed/direct conditioning in the zone and that at least 50% of the surrounding area is conditioned, e.g. a floor plan and/or photographs."],
    ["Interaction with 6.11", "A zone with no fixed conditioning that is treated as 'conditioned adjoining space' by applying assumed heating under convention 6.11 <em>is</em> considered directly conditioned, and does contribute to indirectly conditioning adjacent zones."]
  ]
},
"6.14": {
  cat: "6. HVAC",
  title: "Individual Shop Units in Shopping Centres",
  date: "1 Sep 2014 (am. 1 Jul 2018)",
  body: [
    ["Scenario 1 - local heating/AC plus unconditioned central fresh air", "Assess with the local heating plus <strong>'mechanical ventilation'</strong> to the affected zones. The assessment level depends on the system type - see the flowchart at appendix 10.02."],
    ["Scenario 2 - local heating/AC plus tempered fresh air from a central location", "Model as scenario 1."],
    ["Scenario 3 - centrally conditioned system in addition to local devices", "Split the zone into a number of zones matching the number of HVAC types. Split all the zone's envelopes, including glazing, equally between them and assign the respective HVAC type."],
    ["Practical limitation", "Where graphical software cannot split envelopes equally, divide them as equally as possible and record the limitation in site notes."]
  ]
},
"6.15": {
  cat: "6. HVAC",
  title: "Bivalent System Proportioning Within a Building Zone",
  date: "1 Jul 2018",
  body: [
    ["Definition", "A bivalent system is one in which heating is supplied by two or more different types of heat source."],
    ["Rule", "Specify the proportion of load met by each system on a <strong>zone-by-zone</strong> basis. The same HVAC system may only be assigned to multiple zones where the sources and delivery methods are the same. Enter the proportion met by the additional (bivalent) generator(s); the balance is assigned to the main system."],
    ["Controls", "Control corrections may be applied to each system efficiency, but only <strong>one set</strong> of control options can be selected - choose those appropriate to the system supplying the greatest heating load."],
    ["Which is the 'main' system", "Any system providing <strong>cooling</strong> must be the main system. Where none provides cooling, the main system should if possible be the one supplying the greater proportion of heating load."],
    ["Default splits where relative load is unknown", "&bull; One central (multi-zone) + one or more local (single zone): <strong>80% central / 20% local</strong> (local split equally)<br>&bull; Two central systems only: <strong>50% each</strong><br>&bull; Two central + one or more local: <strong>40% each central / 20% local</strong><br>&bull; No central, two or more local: <strong>equal split</strong> between locals"],
    ["Note", "A split or multi-split is considered a <em>local</em> system. Where evidence of relative heating load exists (e.g. a heating load design), use it."]
  ]
},

/* ---- 7. Lighting ---- */
"7.01": {
  cat: "7. Lighting",
  title: "Lighting Options in SBEM",
  date: "17 Jan 2011 (am. 1 Feb 2023)",
  body: [
    ["Option 1 - 'Full lighting design carried out'", "Use where the building's original lighting design is available <em>and</em> agrees with the observed lighting - enter the wattage and lux values from that design. Complementary values must come from the <strong>same</strong> design; if not, the design must not be used. Also use this option where the assessor can accurately record circuit wattage and lux levels on site (see 7.02)."],
    ["Not permitted", "Entering wattage and lux values separately, or using assumed values from BSRIA or other reference documents, or accepting a software default."],
