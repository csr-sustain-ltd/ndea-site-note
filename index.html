/* ---------------------------------------------------------------------------
   CONVENTION DRAWER CONTROLLER
   --------------------------------------------------------------------------- */
const convDrawer  = document.getElementById("conv-drawer");
const convScrim   = document.getElementById("conv-scrim");
const convNumEl   = document.getElementById("conv-drawer-num");
const convTitleEl = document.getElementById("conv-drawer-title");
const convDateEl  = document.getElementById("conv-drawer-date");
const convBodyEl  = document.getElementById("conv-drawer-body");
let convLastFocus = null;

function openConvDrawer(num, siblings){
  const rec = CONV_DATA[num];
  convLastFocus = document.activeElement;

  document.querySelectorAll(".conv-chip.is-open").forEach(c=> c.classList.remove("is-open"));
  document.querySelectorAll('.conv-chip[data-conv="'+num+'"]').forEach(c=> c.classList.add("is-open"));

  convNumEl.textContent = "Convention " + num;
  convBodyEl.innerHTML = "";

  if(!rec){
    convTitleEl.textContent = "Not in this reference";
    convDateEl.textContent = "";
    convBodyEl.appendChild(el("p",{},
      "Convention " + num + " is not held in this summary. Refer to the full " +
      "Non-Domestic EPC Conventions for England & Wales, Issue 9."));
  } else {
    convTitleEl.textContent = rec.title;
    convDateEl.textContent  = rec.date ? "Implemented " + rec.date : "";

    convBodyEl.appendChild(el("div",{class:"cd-cat"}, rec.cat));

    const dl = el("dl");
    rec.body.forEach(([term, def])=>{
      dl.appendChild(el("dt",{html:term}));
      dl.appendChild(el("dd",{html:def}));
    });
    convBodyEl.appendChild(dl);
  }

  // Jump straight to the other conventions cited by the same section.
  const others = (siblings || []).filter(n=> n !== num);
  if(others.length){
    const rel = el("div",{class:"conv-drawer-related"});
    rel.appendChild(el("div",{class:"rel-label"},"Also cited in this section"));
    others.forEach(n=> rel.appendChild(convChip(n, siblings)));
    convBodyEl.appendChild(rel);
  }

  convBodyEl.scrollTop = 0;
  convDrawer.classList.add("open");
  convScrim.classList.add("open");
  convDrawer.setAttribute("aria-hidden","false");
  document.getElementById("conv-drawer-close").focus();
}

function closeConvDrawer(){
  convDrawer.classList.remove("open");
  convScrim.classList.remove("open");
  convDrawer.setAttribute("aria-hidden","true");
  document.querySelectorAll(".conv-chip.is-open").forEach(c=> c.classList.remove("is-open"));
  if(convLastFocus && convLastFocus.focus) convLastFocus.focus();
}

document.getElementById("conv-drawer-close").addEventListener("click", closeConvDrawer);
convScrim.addEventListener("click", closeConvDrawer);
document.addEventListener("keydown", e=>{
  if(e.key === "Escape" && convDrawer.classList.contains("open")) closeConvDrawer();
});

/* ---------- CONVENTIONS PANEL ---------- */
/* Built directly from CONV_DATA so the reference list and the drawer can never
   drift apart. Every row opens the same panel as a chip in the form. */
function buildConventionsPanel(){
  const panel = el("div",{id:"panel-conventions", class:"panel"});

  const intro = el("div",{class:"field"});
  intro.appendChild(el("div",{class:"hint", html:
    "Summarised from the <strong>Non-Domestic EPC Conventions for England &amp; Wales, Issue 9</strong>. " +
    "Select any convention below &mdash; or any numbered chip beside a section heading &mdash; to open the " +
    "detail panel. Summaries are for on-site reference; work from the full published document for audit."}));
  panel.appendChild(section("How to use this reference","",intro));

  const groups = {};
  Object.keys(CONV_DATA).sort().forEach(num=>{
    const rec = CONV_DATA[num];
    (groups[rec.cat] = groups[rec.cat] || []).push(num);
  });

  Object.keys(groups).forEach(cat=>{
    const body = el("div",{class:"convlist"});
    groups[cat].forEach(num=>{
      const rec = CONV_DATA[num];
      const withdrawn = /remov|withdraw/i.test(rec.date || "");
      const row = el("button",{
        type:"button",
        class:"convrow" + (withdrawn ? " withdrawn" : ""),
        "data-conv":num
      },
        el("span",{class:"num"}, num),
        el("span",{class:"desc"}, rec.title + (withdrawn ? "  (withdrawn)" : ""))
      );
      row.addEventListener("click", ()=> openConvDrawer(num, groups[cat]));
      body.appendChild(row);
    });
    panel.appendChild(section(cat,"",body));
  });

  return panel;
}

TABS.forEach((t,i)=>{
  const btn = el("button",{class:"tab-btn"+(i===0?" active":""), "data-tab":t.id}, t.label);
  btn.onclick = ()=> switchTab(t.id);
  tabsEl.appendChild(btn);
  panelsEl.appendChild(panelBuilders[t.id]());
});

function switchTab(id){
  document.querySelectorAll(".tab-btn").forEach(b=> b.classList.toggle("active", b.dataset.tab===id));
  document.querySelectorAll(".panel").forEach(p=> p.classList.toggle("active", p.id==="panel-"+id));

  const idx = TABS.findIndex(t=> t.id===id);
  const isLast = idx===TABS.length-1;
  const nextBtn = document.getElementById("btn-next");
  const genBtn = document.getElementById("btn-generate");
  if(isLast){
    nextBtn.style.display = "none";
    genBtn.style.display = "";
  } else {
    nextBtn.style.display = "";
    nextBtn.textContent = "Next: "+TABS[idx+1].label;
    genBtn.style.display = "none";
  }
}

document.getElementById("btn-next").addEventListener("click", ()=>{
  const activeBtn = document.querySelector(".tab-btn.active");
  const idx = TABS.findIndex(t=> t.id===activeBtn.dataset.tab);
  if(idx>-1 && idx<TABS.length-1){
    switchTab(TABS[idx+1].id);
    window.scrollTo({top:0,behavior:"smooth"});
  }
});

switchTab(TABS[0].id);

function checked(id){ const e=document.getElementById(id); return e? e.checked : false; }
function radioVal(name){
  const r = document.querySelector(`input[name="${name}"]:checked`);
  return r? r.value : "";
}

function escapeHtml(s){
  if(s===undefined||s===null) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ==========================================================================
   SITE NOTE REPORT
   One data model (collectReport) feeds every output, so the Word document,
   the emailed copy and the on-page print sheet always say the same thing.
   ========================================================================== */
const PHOTO_LABELS = [
  "All elevations","All glazing types","All roof types","External door types","Wall types",
  "HVAC units with data plates","Floor types","HVAC emitters & controls","Lighting types",
  "Local mechanical exhaust","Lighting controls","Hot water systems","Adjacent properties",
  "Activities / use of space","Any extensions","Floor plans / drawings"
];

function collectReport(){
  const dash = v => (v===null || v===undefined || String(v).trim()==="") ? "" : String(v).trim();
  const R = {
    meta:{
      address: dash(val("p_address")), postcode: dash(val("p_postcode")),
      assessor: dash(val("p_assessor")), membership: dash(val("p_membership")),
      assessorEmail: dash(val("p_assessor_email")), date: dash(val("p_date")),
      level: dash(val("p_level")), use: dash(val("p_use")), customer: dash(val("p_customer")),
      riskDone: checked("p_risk_done"), generated: new Date().toLocaleDateString("en-GB"),
      signature: (currentAssessor()||{}).sig || ""
    },
    sections: []
  };
  const fmtDate = iso => { if(!iso) return ""; const d = new Date(iso+"T00:00:00"); return isNaN(d) ? iso : d.toLocaleDateString("en-GB"); };
  R.meta.dateFmt = fmtDate(R.meta.date);
  const S = title => { const s = {title, blocks:[]}; R.sections.push(s); return s; };
  const sub   = (s,text,conv) => s.blocks.push({t:"sub", text, conv:conv||""});
  const kv    = (s,pairs) => s.blocks.push({t:"kv", pairs:pairs.map(([k,v])=>[k,dash(v)])});
  const table = (s,columns,rows,empty) => s.blocks.push({t:"table", columns, rows:rows.map(r=>{ const o={}; columns.forEach(c=> o[c.key]=dash(r[c.key])); return o; }), empty:empty||"None recorded."});
  const note  = (s,label,text) => s.blocks.push({t:"note", label, text:dash(text)});
  const checks= (s,label,items) => s.blocks.push({t:"checks", label, items});
  const para  = (s,text,tone) => s.blocks.push({t:"para", text, tone:tone||""});

  /* 1 - Survey details */
  const s1 = S("Survey Details");
  sub(s1,"Site & Assessor");
  kv(s1,[["Site address",R.meta.address],["Postcode",R.meta.postcode],["Date of inspection",R.meta.dateFmt],["Assessment level",R.meta.level],
         ["Assessor",R.meta.assessor],["Membership no.",R.meta.membership],["Assessor email",R.meta.assessorEmail],["Weather location",val("p_weather")]]);
  sub(s1,"Customer");
  kv(s1,[["Contact name",val("p_customer")],["Phone",val("p_phone")],["Email",val("p_email")]]);
  sub(s1,"Building");
  const ext = val("p_has_ext");
  const bPairs = [["Building use",val("p_use")],["Building age",val("p_age")],["Number of floors",val("p_floors")],["Occupancy",radioVal("occupancy")],
    ["Conservation status",val("p_conservation")],["Building Regulation age",val("p_bregs_age")],["Air permeability", airPermValue() ? airPermValue()+" m³/h·m² @ 50 Pa" : ""],["Extension on site",ext]];
  if(ext.indexOf("Yes")===0) bPairs.push(["Extension 1 – Building Regs age",val("p_bregs_ext_age")]);
  if(ext.indexOf("Yes - 2")===0) bPairs.push(["Extension 2 – Building Regs age",val("p_bregs_ext2_age")]);
  bPairs.push(["Power factor > 0.9",val("p_pf")],["Risk assessment completed", R.meta.riskDone ? "Yes" : "NOT RECORDED"]);
  kv(s1,bPairs);
  sub(s1,"Pre-Survey Investigations");
  table(s1,[{key:"q",label:"Question",w:5},{key:"a",label:"Answer",w:1.3},{key:"d",label:"Details",w:4}],[
    ["inv1","Alterations / extensions since original construction?"],
    ["inv2","Occupier aware of energy efficiency improvements?"],
    ["inv3","Building Regs / Planning Approvals available?"],
    ["inv6","Any risks or hazards on-site? (incl. contamination / asbestos)"]
  ].map(([k,q])=>({q, a:val(k+"_yn"), d:val(k+"_detail")})));
  sub(s1,"Site Overview");
  note(s1,"Building age justification",val("p_age_just"));
  note(s1,"Site overview",val("p_overview"));

  /* 2 - Previous EPC */
  const epcIds = ["epc_prev_addr","epc_prev_uprn","epc_prev_cert","epc_prev_rating","epc_prev_date","epc_prev_area","epc_prev_type","epc_new_rating","epc_new_area","epc_reason_text"];
  if(epcEnabled()){
    const s2 = S("Previous EPC Check");
    const pR = epcNum("epc_prev_rating"), nR = epcNum("epc_new_rating");
    const rs = r => r===null ? "" : epcBand(r)+" ("+r+")";
    const vu = epcValidUntil(val("epc_prev_date"));
    sub(s2,"Previous EPC");
    kv(s2,[["Address",val("epc_prev_addr")],["UPRN",val("epc_prev_uprn")],["Certificate ref.",val("epc_prev_cert")],
           ["Lodged / valid until", val("epc_prev_date") ? epcFmtDate(val("epc_prev_date"))+(vu?" / "+epcFmtDate(vu.toISOString()):"") : ""]]);
    sub(s2,"Comparison");
    const v = epcVariance(pR,nR), fl = epcInputFlags();
    const pT = val("epc_prev_type"), nT = val("p_use"), pc = epcUseCode(pT), nc = epcUseCode(nT);
    table(s2,[{key:"m",label:"Measure",w:2.2},{key:"p",label:"Previous EPC",w:3},{key:"n",label:"This survey",w:3},{key:"d",label:"Difference",w:2.4}],[
      {m:"EPC rating & score", p:rs(pR), n:rs(nR), d: v ? (v.delta>0?"+":"")+v.delta+" pts"+(v.bands ? ", "+Math.abs(v.bands)+" band"+(Math.abs(v.bands)>1?"s":"")+(v.bands>0?" worse":" better") : ", same band") : ""},
      {m:"Floor area (m²)", p:val("epc_prev_area"), n:val("epc_new_area"), d: fl.areaPct===null ? "" : (fl.areaPct>0?"+":"")+fl.areaPct.toFixed(1)+"%"+(fl.areaFlag?" (outside tolerance)":"")},
      {m:"Activity type", p:pT, n:nT, d: (pT&&nT) ? ((pc&&nc) ? (pc===nc ? "Same" : "Differs") : "Compare manually") : ""}
    ]);
    const lines = [];
    if(v) lines.push(epcVarianceText(v)+" Status: "+EPC_LEVEL_LABEL[v.level]+".");
    if(fl.areaFlag) lines.push(fl.areaFlag);
    note(s2,"Variance assessment",lines.join("\n"));
    const reasons = EPC_REASONS.filter((_,i)=>checked("epc_reason_"+i));
    const needed = (v && v.level!=="ok") || fl.areaFlag;
    let rt = reasons.join("; ");
    if(val("epc_reason_text").trim()) rt += (rt?"\n":"")+val("epc_reason_text").trim();
    if(!rt && needed) rt = "NOT RECORDED – a difference was flagged";
    note(s2,"Reason(s) for difference",rt);
    const rechecked = EPC_RECHECK.filter((_,i)=>checked("epc_recheck_"+i));
    if(rechecked.length) checks(s2,"Re-checked before finalising", rechecked.map(l=>({label:l,on:true})));
    let src = "Previous EPC details entered manually.";
    if(epcState.source==="register"){
      src = "Source: EPC Register (MHCLG)"+(epcState.dataAsOf ? " bulk data, certificates lodged to "+epcFmtDate(epcState.dataAsOf) : ", retrieved "+(epcState.retrievedAt? epcState.retrievedAt.toLocaleDateString("en-GB"):""))+"."
          + (epcState.edited ? " Some previous-EPC values were edited manually after retrieval." : "");
    }
    para(s2,src,"muted");
  }

  /* 3 - Fabric */
  const s3 = S("Building Fabric");
  sub(s3,"Wall Construction","3.02 · 3.07 · 3.08 · 3.09 · 6.13");
  table(s3,[{key:"name",label:"Construction",w:3},{key:"type",label:"Wall Type",w:2.2},{key:"insulation",label:"Insulation",w:1.8},{key:"location",label:"Location",w:2}], readRowTable(fabricTables.walls));
  sub(s3,"Roof Construction","3.07 · 4.05");
  table(s3,[{key:"name",label:"Construction",w:2.6},{key:"type",label:"Type",w:1.4},{key:"insulation",label:"Insulation",w:3.2},{key:"location",label:"Location",w:2}], readRowTable(fabricTables.roofs));
  sub(s3,"Floor Construction","3.07");
  table(s3,[{key:"name",label:"Floor",w:2.4},{key:"type",label:"Construction Type",w:2},{key:"insulation",label:"Insulation",w:1.8},{key:"notes",label:"Notes",w:3.8}], readRowTable(fabricTables.floors));
  sub(s3,"Glazing","3.03 · 3.07 · 3.09 · 3.11 · 3.12 · 4.02");
  table(s3,[{key:"name",label:"Name",w:1.5},{key:"frame",label:"Frame",w:1.3},{key:"coating",label:"Coating",w:1.2},{key:"units",label:"Units",w:3.2},{key:"shading",label:"Shading",w:1.1},{key:"shadingnote",label:"Shading Notes",w:2.7}], readRowTable(fabricTables.glazing));
  sub(s3,"Doors","3.07");
  table(s3,[{key:"name",label:"Door",w:2.6},{key:"type",label:"Construction Age",w:3.6},{key:"notes",label:"Notes",w:3.8}], readRowTable(fabricTables.doors));

  /* 4 - HVAC */
  const s4 = S("Heating & Cooling");
  sub(s4,"HVAC Systems","2.02 · 3.05 · 3.06 · 5.01 · 6.01 · 6.03 · 6.04 · 6.11 · 6.13");
  table(s4,[{key:"name",label:"Make Model",w:2.6},{key:"area",label:"Area Served",w:2},{key:"type",label:"Type",w:2.4},{key:"fuel",label:"Fuel",w:1.4},{key:"controls",label:"Controls",w:2}], readRowTable(hvacTable.systems));

/* ---------- on-page print sheet (also the fallback .doc source) ---------- */
function buildPrintSheet(){
  const R = collectReport();
  const ps = document.getElementById("print-sheet");
  ps.innerHTML = "";
  ps.appendChild(el("h1",{}, "Site Note — "+(R.meta.address||"(no address entered)")+(R.meta.postcode?" ("+R.meta.postcode+")":"")));
  ps.appendChild(el("div",{class:"ps-sub"}, "Generated "+R.meta.generated+"  •  Survey date: "+(R.meta.dateFmt||"—")+"  •  Assessor: "+(R.meta.assessor||"—")));
  R.sections.forEach(sec=>{
    ps.appendChild(el("h2",{}, sec.title));
    sec.blocks.forEach(b=>{
      if(b.t==="sub") ps.appendChild(el("h3",{}, b.text, b.conv? el("span",{class:"pc"}," CONV. "+b.conv):null));
      else if(b.t==="kv"){
        for(let i=0;i<b.pairs.length;i+=2){
          const row = el("div",{class:"kvrow"});
          [b.pairs[i], b.pairs[i+1]].forEach(p=>{ if(!p) return; row.appendChild(el("span",{class:"k"},p[0])); row.appendChild(el("span",{},p[1]||"—")); });
          ps.appendChild(row);
        }
      } else if(b.t==="table"){
        if(!b.rows.length){ ps.appendChild(el("div",{class:"notesblock"}, b.empty)); return; }
        const t = el("table"), trh = el("tr");
        b.columns.forEach(c=> trh.appendChild(el("th",{},c.label))); t.appendChild(trh);
        b.rows.forEach(r=>{ const tr = el("tr"); b.columns.forEach(c=> tr.appendChild(el("td",{}, r[c.key]||"—"))); t.appendChild(tr); });
        ps.appendChild(t);
      } else if(b.t==="note") ps.appendChild(el("div",{class:"notesblock"}, el("span",{class:"k"},b.label), b.text||"—"));
      else if(b.t==="checks"){
        const on = b.items.filter(x=>x.on).map(x=>x.label);
        ps.appendChild(el("div",{class:"notesblock"}, b.label? el("span",{class:"k"},b.label):null, on.length? on.join(", ") : "None ticked."));
      } else if(b.t==="para") ps.appendChild(el("div",{class:"notesblock"}, b.text));
      else if(b.t==="sign"){
        const sigLabel = "Assessor Signature" + (R.meta.assessor ? " — "+R.meta.assessor : "") + (R.meta.membership ? " ("+R.meta.membership+")" : "");
        ps.appendChild(el("div",{class:"sign"},
          el("div",{class:"sign-cell"},
            el("div",{class:"sign-img"}, R.meta.signature ? el("img",{src:R.meta.signature, alt:"Assessor signature", "data-sig":"1"}) : null),
            el("div",{class:"sign-line"}, sigLabel)),
          el("div",{class:"sign-cell"}, el("div",{class:"sign-img"}), el("div",{class:"sign-line"}, "Date: "+R.meta.generated))));
      }
    });
  });
  return R;
}

        h += "</tr>";
        b.rows.forEach((r,ri)=>{ h += "<tr>"; b.columns.forEach(c=> h += `<td style="padding:5px 8px;border:1px solid #D5E3E0;vertical-align:top;${ri%2?"background:#F7FAF9;":""}">${E(r[c.key]||"—")}</td>`); h += "</tr>"; });

      } else if(b.t==="note"){

      } else if(b.t==="checks"){

        out.push(`<div style="${F}font-size:12px;margin:0 0 8px;">${b.label?`<strong>${E(b.label)}:</strong> `:""}${on.length ? on.map(l=>"&#9745; "+E(l)).join("<br>") : '<span style="color:#64748B;font-style:italic;">None ticked.</span>'}</div>`);

/* ---------- Word document (.docx) ----------
   Built with the docx library, loaded on demand from jsDelivr and cached by the
   browser. It is pre-fetched shortly after the page opens so it is ready even
   if the signal drops on site. */
const DOCX_LIB_URL = "https://cdn.jsdelivr.net/npm/docx@9.8.1/dist/index.iife.js";
let docxLibPromise = null;
function loadDocxLib(){
  if(window.docx && window.docx.Document) return Promise.resolve(window.docx);
  if(docxLibPromise) return docxLibPromise;
  docxLibPromise = new Promise((resolve,reject)=>{
    const s = document.createElement("script");
    s.src = DOCX_LIB_URL; s.async = true;
    s.onload = ()=> (window.docx && window.docx.Document) ? resolve(window.docx) : reject(new Error("docx library did not initialise"));
    s.onerror = ()=>{ docxLibPromise = null; reject(new Error("Could not load the docx library")); };
    document.head.appendChild(s);
  });
  return docxLibPromise;
}
window.addEventListener("load", ()=> setTimeout(()=> loadDocxLib().catch(()=>{}), 1500));

function dataUriBytes(uri){
  const b64 = String(uri).split(",")[1] || "";
  const bin = atob(b64); const u = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return u;
}
/* Reads width/height straight from the PNG header - no image decoding needed */
function imageSize(uri){
  try{
    const b = dataUriBytes(uri);
    const rd = o => ((b[o]<<24)|(b[o+1]<<16)|(b[o+2]<<8)|b[o+3])>>>0;
    if(b.length>24 && b[1]===0x50 && b[2]===0x4E && b[3]===0x47) return Promise.resolve({w:rd(16)||200, h:rd(20)||90});
  }catch(e){}
  return Promise.resolve({w:200, h:90});
}

async function reportToDocxBlob(R){
  const D = await loadDocxLib();
  const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, BorderStyle, ShadingType,
          AlignmentType, ImageRun, Header, Footer, PageNumber, HeadingLevel, VerticalAlign, TabStopType, TableLayoutType } = D;

  const FONT = "Arial", TEAL = "2D6A6A", TEAL_DK = "1F4A4A", MINT = "EAF3F1", MINT_LINE = "C9DCD8",
        ZEBRA = "F6FAF9", TXT = "1E293B", GREY = "64748B", LIGHT = "94A3B8", RED = "B91C1C";
  const W = 9638;                       // A4 with 2 cm margins, in DXA
  const NONE = {style:BorderStyle.NONE, size:0, color:"FFFFFF"};
  const NOB = {top:NONE,bottom:NONE,left:NONE,right:NONE};
  const line = c => ({style:BorderStyle.SINGLE, size:4, color:c||MINT_LINE});
  const BOX = {top:line(),bottom:line(),left:line(),right:line()};

  const run = (text,o={}) => new TextRun({text:String(text), font:o.font||FONT, size:o.size||19, bold:!!o.bold, italics:!!o.italics, color:o.color||TXT, characterSpacing:o.spacing});
  const P = (children,o={}) => new Paragraph({
    children: Array.isArray(children) ? children : [children],
    spacing: Object.assign({before:o.before||0, after:(o.after===undefined?80:o.after)}, o.line ? {line:o.line} : {}),
    alignment:o.align, keepNext:!!o.keepNext, keepLines:!!o.keepLines, border:o.border, heading:o.heading,
    pageBreakBefore:!!o.pageBreakBefore, tabStops:o.tabStops
  });
  const lines = (text,o={}) => {
    const t = (text===undefined || text===null || String(text)==="") ? "—" : String(text);
    return t.split(/\r?\n/).map((ln,i,a)=> P(run(ln||" ",o), {after: i===a.length-1 ? 0 : 40}));
  };
  const cell = (children,w,o={}) => new TableCell({
    children, width:{size:w, type:WidthType.DXA}, borders:o.borders||BOX, columnSpan:o.span,
    shading: o.fill ? {type:ShadingType.CLEAR, color:"auto", fill:o.fill} : undefined,
    margins:{top:o.pad===undefined?60:o.pad, bottom:o.pad===undefined?60:o.pad, left:100, right:100},
    verticalAlign:o.va||VerticalAlign.TOP
  });
  const widths = (cols,total) => {
    const sum = cols.reduce((a,c)=>a+(c.w||1),0);
    const out = cols.map(c=> Math.floor(total*(c.w||1)/sum));
    out[out.length-1] += total - out.reduce((a,b)=>a+b,0);
    return out;
  };
  const tbl = (rows,cw,o={}) => new Table({rows, width:{size:W, type:WidthType.DXA}, columnWidths:cw, layout:TableLayoutType.FIXED, borders:o.borders});
  const gap = (after=160) => P(run(" ",{size:4}), {after});

  const icon = { data: dataUriBytes(CRS_ICON_DOC), type:"png" };
  const iconSz = await imageSize(CRS_ICON_DOC);

  /* ----- block renderers ----- */
  const renderKv = pairs => {
    const cw = [1900, 2919, 1900, 2919];
    const rows = [];
    for(let i=0;i<pairs.length;i+=2){
      const a = pairs[i], b = pairs[i+1];
      const flag = v => v==="NOT RECORDED";
      const cells = [
        cell([P(run(a[0],{bold:true,size:17,color:"334155"}),{after:0})], cw[0], {fill:MINT}),
        cell(lines(a[1],{size:18, bold:flag(a[1]), color:flag(a[1])?RED:TXT}), b ? cw[1] : cw[1]+cw[2]+cw[3], {span: b?undefined:3})
      ];
      if(b){
        cells.push(cell([P(run(b[0],{bold:true,size:17,color:"334155"}),{after:0})], cw[2], {fill:MINT}));
        cells.push(cell(lines(b[1],{size:18, bold:flag(b[1]), color:flag(b[1])?RED:TXT}), cw[3]));
      }
      rows.push(new TableRow({children:cells, cantSplit:true}));
    }
    return [tbl(rows,cw), gap(120)];
  };
  const renderTable = b => {
    if(!b.rows.length) return [P(run(b.empty,{italics:true,color:GREY,size:18}),{after:160})];
    const cw = widths(b.columns, W);
    const head = new TableRow({tableHeader:true, cantSplit:true, children: b.columns.map((c,i)=>
      cell([P(run(c.label,{bold:true,color:"FFFFFF",size:17}),{after:0})], cw[i], {fill:TEAL, borders:{top:line(TEAL),bottom:line(TEAL),left:line(TEAL),right:line(TEAL)}}))});
    const body = b.rows.map((r,ri)=> new TableRow({cantSplit:true, children: b.columns.map((c,i)=>
      cell(lines(r[c.key],{size:18}), cw[i], {fill: ri%2 ? ZEBRA : undefined}))}));
    return [tbl([head].concat(body), cw), gap(160)];
  };
  const renderNote = b => [tbl([
      new TableRow({cantSplit:true, children:[cell([P(run(b.label,{bold:true,size:17,color:"334155"}),{after:0,keepNext:true})], W, {fill:MINT})]}),
      new TableRow({cantSplit: String(b.text||"").length < 900, children:[cell(lines(b.text,{size:18, color: b.text ? TXT : GREY}), W, {pad:90})]})
    ], [W]), gap(140)];
  const renderChecks = b => {
    const out = [];
    if(b.label) out.push(P(run(b.label,{bold:true,size:18,color:"334155"}),{after:60,keepNext:true}));
    const cols = 2, cw = [W/2, W/2], rows = [];

      rows.push(new TableRow({cantSplit:true, children: [0,1].map(k=>{

        ],{after:0})], cw[k], {borders:NOB, pad:30});
      })}));

    out.push(tbl(rows, cw, {borders:NOB}));

  };
  const renderSub = b => [P([
      run(b.text,{bold:true,size:22,color:TEAL_DK}),
      ...(b.conv ? [run("     Conventions "+b.conv,{size:15,color:LIGHT})] : [])
    ],{before:120, after:90, keepNext:true, border:{bottom:{style:BorderStyle.SINGLE,size:4,color:MINT_LINE,space:3}}})];
  const renderPara = b => [P(run(b.text,{size:18, italics:b.tone==="muted", color:b.tone==="muted"?GREY:TXT}),{after:140})];

  const renderSign = async () => {
    const out = [P(run("Assessor Sign-off",{bold:true,size:22,color:TEAL_DK}),{before:240,after:120,keepNext:true,border:{bottom:{style:BorderStyle.SINGLE,size:4,color:MINT_LINE,space:3}}})];
    let sigPara = P(run(" ",{size:18}),{after:0});
    if(R.meta.signature){
      const sz = await imageSize(R.meta.signature);
      const h = 52, w = Math.round(h*sz.w/sz.h);
      sigPara = P(new ImageRun({data:dataUriBytes(R.meta.signature), type:"png", transformation:{width:w, height:h}}),{after:0});
    }
    const cw = [5200, 900, 3538];
    const top = {top:{style:BorderStyle.SINGLE,size:6,color:"334155"},bottom:NONE,left:NONE,right:NONE};
    out.push(tbl([
      new TableRow({cantSplit:true, children:[
        cell([sigPara], cw[0], {borders:NOB, va:VerticalAlign.BOTTOM, pad:0}),
        cell([P(run(" "),{after:0})], cw[1], {borders:NOB}),
        cell([P(run(R.meta.generated,{size:19}),{after:20})], cw[2], {borders:NOB, va:VerticalAlign.BOTTOM, pad:0})
      ]}),
      new TableRow({cantSplit:true, children:[
        cell([P(run("Assessor signature",{size:15,color:GREY}),{after:40}),
              P(run(R.meta.assessor||"—",{bold:true,size:19}),{after:0}),
              P(run(R.meta.membership ? "Membership no. "+R.meta.membership : "",{size:17,color:GREY}),{after:0})], cw[0], {borders:top}),
        cell([P(run(" "),{after:0})], cw[1], {borders:NOB}),

      ]})
    ], cw, {borders:NOB}));
    return out;
  };

  /* ----- cover page ----- */
  const cover = [];
  const coverIconH = 60;
  cover.push(P(new ImageRun({data:icon.data, type:"png", transformation:{width:Math.round(coverIconH*iconSz.w/iconSz.h), height:coverIconH}}),{after:1400}));
  cover.push(P(run("NON-DOMESTIC ENERGY ASSESSMENT",{bold:true,size:20,color:TEAL,spacing:40}),{after:120}));
  cover.push(P(run("Site Note",{bold:true,size:64,color:TXT}),{after:200}));
  cover.push(P(run(R.meta.address||"(no address entered)",{size:30,color:TXT}),{after:60}));
  if(R.meta.postcode) cover.push(P(run(R.meta.postcode,{size:26,color:GREY}),{after:0}));
  cover.push(P(run(" "),{after:360, border:{bottom:{style:BorderStyle.SINGLE,size:18,color:TEAL,space:8}}}));
  const cRows = [
    ["Date of inspection", R.meta.dateFmt], ["Assessment level", R.meta.level], ["Building use", R.meta.use],
    ["Customer", R.meta.customer], ["Assessor", R.meta.assessor + (R.meta.membership ? "  ("+R.meta.membership+")" : "")],
    ["Risk assessment", R.meta.riskDone ? "Completed" : "NOT RECORDED"], ["Site note generated", R.meta.generated]
  ];
  const ccw = [2900, W-2900];
  const bottomOnly = {top:NONE,left:NONE,right:NONE,bottom:line("E2E8F0")};
  cover.push(tbl(cRows.map(([k,v])=> new TableRow({cantSplit:true, children:[
    cell([P(run(k,{size:18,color:GREY}),{after:0})], ccw[0], {borders:bottomOnly, pad:90}),
    cell([P(run(v||"—",{size:19,bold:true,color: v==="NOT RECORDED" ? RED : TXT}),{after:0})], ccw[1], {borders:bottomOnly, pad:90})
  ]})), ccw, {borders:NOB}));

  /* ----- body ----- */
  const body = [];
  for(let si=0; si<R.sections.length; si++){
    const sec = R.sections[si];
    body.push(new Paragraph({
      heading: HeadingLevel.HEADING_1, pageBreakBefore: true, keepNext:true,
      spacing:{before:0, after:200},
      border:{bottom:{style:BorderStyle.SINGLE, size:12, color:TEAL, space:6}},
      children:[ run((si+1)+".  ",{bold:true,size:30,color:"7FBFB0"}), run(sec.title,{bold:true,size:30,color:TEAL}) ]
    }));
    for(const b of sec.blocks){
      if(b.t==="sub") body.push(...renderSub(b));
      else if(b.t==="kv") body.push(...renderKv(b.pairs));
      else if(b.t==="table") body.push(...renderTable(b));
      else if(b.t==="note") body.push(...renderNote(b));
      else if(b.t==="checks") body.push(...renderChecks(b));
      else if(b.t==="para") body.push(...renderPara(b));
      else if(b.t==="sign") body.push(...(await renderSign()));
    }
  }

  /* ----- header / footer ----- */
  const hdrIconH = 22;
  const header = new Header({children:[ new Paragraph({
    tabStops:[{type:TabStopType.RIGHT, position:W}],
    border:{bottom:{style:BorderStyle.SINGLE,size:4,color:MINT_LINE,space:6}},
    spacing:{after:0},
    children:[
      new ImageRun({data:icon.data, type:"png", transformation:{width:Math.round(hdrIconH*iconSz.w/iconSz.h), height:hdrIconH}}),
      new TextRun({text:"\tSite Note  |  "+(R.meta.address||"")+(R.meta.postcode?", "+R.meta.postcode:""), font:FONT, size:15, color:GREY})
    ]})]});
  const footer = new Footer({children:[ new Paragraph({
    tabStops:[{type:TabStopType.RIGHT, position:W}],
    border:{top:{style:BorderStyle.SINGLE,size:4,color:MINT_LINE,space:6}},
    children:[
      new TextRun({text:"CSR Sustain  •  NDEA Site Note  •  "+(R.meta.dateFmt||R.meta.generated), font:FONT, size:15, color:GREY}),
      new TextRun({children:["\tPage ", PageNumber.CURRENT, " of ", PageNumber.TOTAL_PAGES], font:FONT, size:15, color:GREY})
    ]})]});

  const doc = new Document({
    creator: R.meta.assessor || "CSR Sustain",
    title: "Site Note - "+(R.meta.address||""),
    description: "Non-domestic energy assessment site note",
    styles:{
      default:{ document:{ run:{font:FONT, size:19, color:TXT} } },
      paragraphStyles:[
        {id:"Heading1", name:"Heading 1", basedOn:"Normal", next:"Normal", quickFormat:true,
         run:{font:FONT, size:30, bold:true, color:TEAL}, paragraph:{spacing:{before:0, after:200}, outlineLevel:0}}
      ]
    },
    sections:[{
      properties:{
        page:{ size:{width:11906, height:16838}, margin:{top:1134, bottom:1134, left:1134, right:1134, header:567, footer:567} },
        titlePage:true
      },
      headers:{ default:header, first:new Header({children:[new Paragraph({children:[]})]}) },
      footers:{ default:footer, first:new Footer({children:[new Paragraph({alignment:AlignmentType.LEFT, children:[
        new TextRun({text:"CSR Sustain", font:FONT, size:16, bold:true, color:TEAL}),
        new TextRun({text:"   Non-Domestic Energy Assessment  •  Site Note", font:FONT, size:15, color:GREY})
      ]})]}) },
      children: cover.concat(body)
    }]
  });
  return Packer.toBlob(doc);
}

/* ---------- "Email me a copy?" prompt ---------- */
function askEmailPreference(){
  return new Promise(resolve=>{
    const email = (val("p_assessor_email")||"").trim();
    const ok = EMAIL_CONFIG.EMAIL_ENABLED && isValidEmail(email);
    const scrim = el("div",{class:"modal-scrim", role:"dialog", "aria-modal":"true", "aria-labelledby":"em-title"});
    const card = el("div",{class:"modal-card"});
    card.appendChild(el("h3",{id:"em-title"}, "Email the site note?"));
    if(ok){
      card.appendChild(el("p",{}, "Your Word site note will download now. Would you also like a copy of the final site note emailed to ", el("strong",{},email), "?"));
    } else {
      card.appendChild(el("p",{}, email ? "The assessor email address doesn't look valid, so the site note can only be downloaded." : "No assessor email has been set on the Project & Survey tab, so the site note can only be downloaded."));
    }
    const btns = el("div",{class:"modal-btns"});
    const close = v => { document.removeEventListener("keydown", onKey); scrim.remove(); resolve(v); };
    const onKey = e => { if(e.key==="Escape") close(null); };
    const cancel = el("button",{class:"btn btn-secondary", type:"button"}, "Cancel");
    cancel.addEventListener("click", ()=> close(null));
    btns.appendChild(cancel);
    if(ok){
      const no = el("button",{class:"btn btn-secondary", type:"button"}, "No, download only");
      const yes = el("button",{class:"btn btn-primary", type:"button"}, "Yes, email me");
      no.addEventListener("click", ()=> close(false));
      yes.addEventListener("click", ()=> close(true));
      btns.appendChild(no); btns.appendChild(yes);
      setTimeout(()=> yes.focus(), 0);
    } else {
      const dl = el("button",{class:"btn btn-primary", type:"button"}, "Download");
      dl.addEventListener("click", ()=> close(false));
      btns.appendChild(dl);
      setTimeout(()=> dl.focus(), 0);
    }
    card.appendChild(btns);
    scrim.appendChild(card);
    scrim.addEventListener("click", e=>{ if(e.target===scrim) close(null); });
    document.addEventListener("keydown", onKey);
    document.body.appendChild(scrim);
  });
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 2000);
}


/* Converts the built #print-sheet DOM into a full, standalone HTML document
   (Word namespaces + inline/embedded styles, no CSS Grid) that Microsoft Word
   can open directly as a .doc file. Word's HTML renderer is based on an old
   layout engine, so - just like the email export below - grid layouts are
   converted to tables and everything is spelled out with plain CSS. */
function psToWordDocument(ps){
  const addr = (val("p_address")||"site").replace(/[^a-z0-9]+/gi,"_").slice(0,40);
  const dateStr = (val("p_date")||new Date().toISOString().slice(0,10));

  const parts = [];
  const images = [];

  Array.from(ps.children).forEach(child=>{
    if(child.tagName === "H1"){
      parts.push(`<h1 style="font-family:Calibri,Arial,sans-serif;font-size:16pt;border-bottom:3px solid #2a4f66;padding-bottom:8px;margin:0 0 4px;">${child.innerHTML}</h1>`);
    } else if(child.classList && child.classList.contains("ps-sub")){
      parts.push(`<div style="font-family:'Courier New',monospace;font-size:9pt;color:#555555;margin-bottom:18px;">${child.innerHTML}</div>`);
    } else if(child.tagName === "H2"){
      const label = child.childNodes[0] ? child.childNodes[0].textContent : child.textContent;
      parts.push(`<h2 style="font-family:Calibri,Arial,sans-serif;font-size:11pt;text-transform:uppercase;letter-spacing:.3px;background:#2a4f66;color:#ffffff;padding:6px 10px;margin:20px 0 8px;">${escapeHtml(label)}</h2>`);
    } else if(child.tagName === "TABLE"){
      let tbl = '<table style="width:100%;border-collapse:collapse;margin-bottom:10px;font-size:10pt;font-family:Calibri,Arial,sans-serif;" cellpadding="5" cellspacing="0">';
      Array.from(child.children).forEach(tr=>{
        tbl += "<tr>";
        Array.from(tr.children).forEach(cell=>{
          const isHeader = cell.tagName === "TH";
          const tag = isHeader ? "th" : "td";
          const style = isHeader
            ? "background:#eef0f2;padding:5px 7px;border:1px solid #d8dadc;text-align:left;font-weight:bold;text-transform:uppercase;font-size:9pt;color:#444444;"
            : "padding:5px 7px;border:1px solid #d8dadc;vertical-align:top;";
          tbl += `<${tag} style="${style}">${cell.innerHTML || "&mdash;"}</${tag}>`;
        });
        tbl += "</tr>";
      });
      tbl += "</table>";
      parts.push(tbl);
    } else if(child.classList && child.classList.contains("kvrow")){
      const spans = child.querySelectorAll("span");
      let row = '<table style="width:100%;border-collapse:collapse;font-size:10pt;font-family:Calibri,Arial,sans-serif;margin-bottom:2px;"><tr>';
      spans.forEach(sp=>{
        const bold = sp.classList.contains("k");
        row += `<td style="padding:3px 6px;${bold?"font-weight:bold;color:#333333;width:150px;":""}">${sp.textContent||"&mdash;"}</td>`;
      });
      row += "</tr></table>";
      parts.push(row);
    } else if(child.classList && child.classList.contains("notesblock")){
      const kSpan = child.querySelector(".k");
      const label = kSpan ? kSpan.textContent : "";
      const text = (kSpan ? child.textContent.replace(label,"") : child.textContent).trim();
      parts.push(`<div style="font-size:10pt;font-family:Calibri,Arial,sans-serif;padding:6px 0;border-bottom:1px solid #eeeeee;">${label?`<strong style="display:block;margin-bottom:3px;color:#333333;">${escapeHtml(label)}</strong>`:""}<span style="white-space:pre-wrap;">${escapeHtml(text)||"&mdash;"}</span></div>`);
    } else if(child.classList && child.classList.contains("sign")){
      const cells = Array.from(child.children);
      let sign = '<table style="width:100%;border-collapse:collapse;margin-top:26px;font-size:9pt;font-family:Calibri,Arial,sans-serif;color:#555555;"><tr>';
      cells.forEach(cell=>{
        const img = cell.querySelector("img[data-sig]");
        let inner = "&nbsp;";
        if(img){
          const m = img.src.match(/^data:(image\/[a-z]+);base64,(.+)$/);
          if(m){
            const loc = "file:///C:/sitenote_files/signature"+images.length+"."+m[1].split("/")[1];
            images.push({loc, type:m[1], data:m[2]});
            const h = 60, w = Math.round(h*(img.naturalWidth||200)/(img.naturalHeight||90));
            inner = `<img src="${loc}" width="${w}" height="${h}" alt="Assessor signature">`;
          }
        }
        sign += `<td style="width:50%;height:66px;vertical-align:bottom;padding:0 20px 2px 0;">${inner}</td>`;
      });
      sign += "</tr><tr>";
      cells.forEach(cell=>{
        const line = cell.querySelector(".sign-line");
        sign += `<td style="width:50%;border-top:1px solid #555555;padding:5px 20px 0 0;font-family:Calibri,Arial,sans-serif;font-size:9pt;">${escapeHtml(line ? line.textContent : cell.textContent)}</td>`;
      });
      sign += "</tr></table>";
      parts.push(sign);
    }
  });

  const bodyHtml = parts.join("\n");

  // Minimal MS Word XML namespaces so Word recognises and opens this cleanly
  // as a native document rather than treating it as a generic web page.
  const doc = `<html xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="utf-8">
<title>NDEA Site Note</title>
<!--[if gte mso 9]>
<xml>
<w:WordDocument>
<w:View>Print</w:View>
<w:Zoom>100</w:Zoom>
<w:DoNotOptimizeForBrowser/>
</w:WordDocument>
</xml>
<![endif]-->
<style>
  @page { size: 21cm 29.7cm; margin: 2cm; }
  body { font-family: Georgia, 'Times New Roman', serif; color:#1c1f22; font-size:10.5pt; }
</style>
</head>
<body>
${bodyHtml}
</body>
</html>`;

  return { doc, images, filename: `NDEA_Site_Note_${addr}_${dateStr}.doc` };
}

/* Converts the built #print-sheet DOM into inline-styled HTML suitable for
   pasting into an email body (email clients ignore external/class-based CSS,
   so every style must be inline). This lets us send the full site note as
   readable text/HTML in the email itself - no paid attachment plan needed. */
function psToEmailHtml(ps){
  const out = [];
  Array.from(ps.children).forEach(child=>{
    if(child.tagName === "H2"){
      const label = child.childNodes[0] ? child.childNodes[0].textContent : child.textContent;
      out.push(`<h2 style="background:#2a4f66;color:#ffffff;font-size:13px;font-weight:600;margin:18px 0 6px;padding:6px 10px;text-transform:uppercase;letter-spacing:.3px;font-family:Arial,sans-serif;">${escapeHtml(label)}</h2>`);
    } else if(child.tagName === "TABLE"){
      let tbl = '<table style="width:100%;border-collapse:collapse;margin-bottom:10px;font-size:12px;font-family:Arial,sans-serif;">';
      Array.from(child.children).forEach(tr=>{
        tbl += "<tr>";
        Array.from(tr.children).forEach(cell=>{
          const isHeader = cell.tagName === "TH";
          const tag = isHeader ? "th" : "td";
          const style = isHeader
            ? "background:#eef0f2;padding:5px 7px;border:1px solid #d8dadc;text-align:left;font-weight:700;"
            : "padding:5px 7px;border:1px solid #d8dadc;vertical-align:top;";
          tbl += `<${tag} style="${style}">${cell.innerHTML || "&mdash;"}</${tag}>`;
        });
        tbl += "</tr>";
      });
      tbl += "</table>";
      out.push(tbl);
    } else if(child.classList && child.classList.contains("kvrow")){
      const spans = child.querySelectorAll("span");
      let row = '<table style="width:100%;border-collapse:collapse;font-size:12px;font-family:Arial,sans-serif;"><tr>';
      spans.forEach(sp=>{
        const bold = sp.classList.contains("k");
        row += `<td style="padding:3px 6px;${bold?"font-weight:700;color:#333;width:150px;":""}">${sp.textContent||"&mdash;"}</td>`;
      });
      row += "</tr></table>";
      out.push(row);
    } else if(child.classList && child.classList.contains("notesblock")){
      const kSpan = child.querySelector(".k");
      const label = kSpan ? kSpan.textContent : "";
      const text = (kSpan ? child.textContent.replace(label,"") : child.textContent).trim();
      out.push(`<div style="font-size:12px;padding:6px 0;border-bottom:1px solid #eee;font-family:Arial,sans-serif;">${label?`<strong style="display:block;margin-bottom:3px;color:#333;">${escapeHtml(label)}</strong>`:""}<span style="white-space:pre-wrap;">${escapeHtml(text)||"&mdash;"}</span></div>`);
    }
    else if(child.classList && child.classList.contains("sign")){
      const line = child.querySelector(".sign-line");
      if(line) out.push(`<div style="font-size:12px;padding:14px 0 0;font-family:Arial,sans-serif;color:#555;">${escapeHtml(line.textContent)}</div>`);
    }
    // the signature image is only included in the Word document (most email clients block embedded images)
  });
  return out.join("\n");
}

/* Wraps the Word HTML and its images in a single MHTML (multipart/related)
   file. Word opens this as a normal .doc and displays the embedded images,
   which it does not do reliably for data: URIs in plain HTML. */
function buildMhtml(html, images){
  const B = "----=_NextPart_CSRSiteNote";
  const wrap = str => str.replace(/.{1,76}/g, "$&\r\n");
  let out = "MIME-Version: 1.0\r\n"
    + `Content-Type: multipart/related; boundary="${B}"; type="text/html"\r\n\r\n`
    + `--${B}\r\n`
    + "Content-Type: text/html; charset=\"utf-8\"\r\n"
    + "Content-Transfer-Encoding: 8bit\r\n"
    + "Content-Location: file:///C:/sitenote.htm\r\n\r\n"
    + html + "\r\n";
  images.forEach(im=>{
    out += `--${B}\r\n`
      + `Content-Type: ${im.type}\r\n`
      + "Content-Transfer-Encoding: base64\r\n"
      + `Content-Location: ${im.loc}\r\n\r\n`
      + wrap(im.data) + "\r\n";
  });
  return out + `--${B}--\r\n`;
}

function isValidEmail(addr){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(addr);
}

async function sendSiteNoteEmail(){
  const statusEl = document.getElementById("status-text");
  const assessorEmail = (val("p_assessor_email")||"").trim();

  if(!assessorEmail) return; // nothing to do, field left blank

  if(!EMAIL_CONFIG.EMAIL_ENABLED){
    statusEl.innerHTML += ' <span style="color:var(--amber)">— email not sent (email delivery not configured)</span>';
    return;
  }
  if(!isValidEmail(assessorEmail)){
    statusEl.innerHTML += ' <span style="color:var(--amber)">— email not sent (Assessor Email looks invalid)</span>';
    return;
  }

  statusEl.innerHTML = "Word document generated ✓ — sending email to " + escapeHtml(assessorEmail) + "…";

  const siteNoteHtml = reportToEmailHtml(collectReport()) + tbUsedToEmailHtml(tbCollectUsed());

  try{
    await emailjs.send(EMAIL_CONFIG.EMAILJS_SERVICE_ID, EMAIL_CONFIG.EMAILJS_TEMPLATE_ID, {
      to_email: assessorEmail,
      assessor_name: val("p_assessor")||"",
      site_address: val("p_address")||"",
      survey_date: val("p_date")||"",
      site_note_content: siteNoteHtml
    });
    statusEl.innerHTML = 'Word document generated <span>✓</span> — emailed to ' + escapeHtml(assessorEmail);
  }catch(err){
    console.error("Email send failed", err);
    statusEl.innerHTML = 'Word document generated <span>✓</span> — <span style="color:var(--amber)">email failed to send (see console)</span>';
  }
}

document.getElementById("btn-generate").addEventListener("click", async ()=>{
  const statusEl = document.getElementById("status-text");
  const wantEmail = await askEmailPreference();
  if(wantEmail===null) return;                       // cancelled

  statusEl.innerHTML = "Building Word document…";
  const R = buildPrintSheet();
  const addr = (R.meta.address||"site").replace(/[^a-z0-9]+/gi,"_").replace(/^_+|_+$/g,"").slice(0,40) || "site";
  const dateStr = R.meta.date || new Date().toISOString().slice(0,10);

  let done = false;
  try{
    const blob = await reportToDocxBlob(R);
    downloadBlob(blob, `NDEA_Site_Note_${addr}_${dateStr}.docx`);
    done = true;
  }catch(err){
    // Fallback if the Word library can't be loaded (e.g. no signal): legacy .doc export
    console.warn("docx export unavailable, using fallback", err);
    try{
      const { doc, images } = psToWordDocument(document.getElementById("print-sheet"));
      const blob = images.length
        ? new Blob([buildMhtml(doc, images)], { type: "application/msword" })
        : new Blob(['\ufeff', doc], { type: "application/msword;charset=utf-8" });
      downloadBlob(blob, `NDEA_Site_Note_${addr}_${dateStr}.doc`);
      done = true;
      statusEl.innerHTML = 'Word document generated <span>✓</span> — basic layout used (no connection to the Word library)';
    }catch(err2){
      console.error(err2);
      statusEl.textContent = "Error generating Word document — see console";
      return;
    }
  }
  if(done && statusEl.innerHTML.indexOf("basic layout")<0)
    statusEl.innerHTML = 'Word document generated <span>✓</span> — check your downloads folder';

  // Calculations PDF – only the toolbox calculators that were used
  const used = tbCollectUsed();
  if(done && used.length){
    try{
      const pdf = await tbBuildPdf(used, R.meta);
      setTimeout(()=> downloadBlob(pdf, `NDEA_Calculations_${addr}_${dateStr}.pdf`), 600);
      statusEl.innerHTML += ' + calculations PDF ('+used.length+' tool'+(used.length>1?'s':'')+')';
    }catch(err){
      console.warn("Calculations PDF failed", err);
      statusEl.innerHTML += ' <span style="color:var(--amber)">— calculations PDF couldn\'t be created (no connection to the PDF library)</span>';
    }
  }

  if(wantEmail) await sendSiteNoteEmail();
});
