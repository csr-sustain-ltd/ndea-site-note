<!-- Build stamp. INCREMENT THIS ON EVERY DEPLOYMENT (YYYY-MM-DD-NN).
     The freshness check below reads it, so it lives in exactly one place. -->
<meta name="build-version" content="2026-10-06-03">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<!-- Freshness check. Runs early so a visitor on a stale GitHub Pages copy is
     moved to the current build before they start typing. Never blocks the
     page: any failure here leaves the form working exactly as-is. -->
<script>
(function(){
  "use strict";
  var meta = document.querySelector('meta[name="build-version"]');
  var BUILD_VERSION = meta ? meta.getAttribute("content") : null;

  // Clear any service worker / Cache Storage left by an older deployment.
  try {
    if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function(regs){
        regs.forEach(function(r){ r.unregister(); });
      })["catch"](function(){});
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function(keys){
        keys.forEach(function(k){ caches["delete"](k); });
      })["catch"](function(){});
    }
  } catch(e) {}

  function formHasAnswers(){
    try {
      var f = document.querySelectorAll("input, select, textarea");
      for (var i = 0; i < f.length; i++) {
        var n = f[i];
        if (n.type === "checkbox" || n.type === "radio") { if (n.checked) return true; }
        else if (n.value && n.value.trim() !== "") return true;
      }
    } catch(e) {}
    return false;
  }

  function goToLatest(v){
    location.replace(location.pathname + "?v=" + encodeURIComponent(v));
  }

  function showUpdateBanner(v){
    if (document.getElementById("update-banner")) return;
    var bar = document.createElement("div");
    bar.id = "update-banner";
    bar.className = "update-banner";
    var txt = document.createElement("span");
    txt.textContent = "A newer version of this form is available. Reloading will clear anything you have entered.";
    var btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "Reload now";
    btn.onclick = function(){ goToLatest(v); };
    var dismiss = document.createElement("button");
    dismiss.type = "button";
    dismiss.textContent = "Not now";
    dismiss.onclick = function(){ bar.remove(); };
    bar.appendChild(txt); bar.appendChild(btn); bar.appendChild(dismiss);
    document.body.appendChild(bar);
  }

  function checkFreshness(){
    if (!window.fetch || !BUILD_VERSION) return;
    fetch(location.pathname + "?_freshness=" + Date.now(),
          { cache: "no-store", credentials: "same-origin" })
      .then(function(res){ return res.ok ? res.text() : null; })
      .then(function(body){
        if (!body) return;
        var m = body.match(/name="build-version"\s+content="([^"]+)"/);
        if (!m) return;
        var live = m[1];
        if (live === BUILD_VERSION) return;
        if (formHasAnswers()) { showUpdateBanner(live); return; }
        var key = "sitenote-reloaded-for";
        try {
          if (sessionStorage.getItem(key) === live) { showUpdateBanner(live); return; }
          sessionStorage.setItem(key, live);
        } catch(e) {}
        goToLatest(live);
      })["catch"](function(){});
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", checkFreshness);
  } else { checkFreshness(); }
})();
</script>

<style>
/* ============================================================================
   CSR SUSTAIN - SITE NOTE
   Visual language matched to the DEC AR Questionnaire (csrsustain.github.io).
   Palette, typography, radii and spacing are deliberately identical so the two
   forms read as one family of documents.
   ============================================================================ */

:root{
  /* --- Shared with the DEC questionnaire --- */
  --primary-color:#2D6A6A;
  --primary-hover:#1F4A4A;
  --secondary-color:#7FE5C9;
  --light-bg:#F8FAFC;
  --text-color:#1E293B;
  --border-color:#E2E8F0;
  --white:#FFFFFF;
  --disabled-grey:#94A3B8;

  /* --- Site-note additions, derived from the same palette --- */
  --primary-soft:#EAF3F1;
  --muted:#64748B;
  --field-bg:#FCFDFE;
  --hover-bg:#F1F5F9;
  --required:#EF4444;
  --success:#059669;
  --success-soft:#A7F3D0;

  /* --- Legacy aliases. A handful of inline styles further down the file still
         reference the previous drafting-table palette. Mapping them here keeps
         those elements on-brand without hunting through the script. --- */
  --mono:'Segoe UI', system-ui, -apple-system, sans-serif;
  --steel-dark:#2D6A6A;
  --graphite-700:#334155;
  --amber:#B45309;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
  background-color:var(--light-bg);
  color:var(--text-color);
  font-size:14px;
  line-height:1.5;
  padding:40px 20px 120px;
}

/* Everything except the fixed action bar lives inside this shell so the page
   matches the DEC questionnaire's single floating card. */
.shell{
  width:100%;
  max-width:1050px;
  margin:0 auto;
  background:var(--white);
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,0.04);
  overflow:hidden;
}

/* ---------- Header ---------- */
.titleblock{
  background-color:var(--primary-color);
  color:var(--white);
  padding:30px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:24px;
  border-bottom:4px solid var(--secondary-color);
  flex-wrap:wrap;
}
.titleblock h1{
  margin:0 0 5px 0;
  font-size:24px;
  font-weight:600;
  letter-spacing:-0.5px;
}
.titleblock .sub{
  margin:0;
  color:#E2E8F0;
  font-size:14px;
  opacity:.9;
}
/* Reverse (white) logo artwork sits directly on the dark teal header.
   Deliberately NO white panel - white-on-white would be invisible. */
.site-logo{
  display:block;
  height:42px;
  width:auto;
  flex-shrink:0;
}
.site-logo-link{display:block;flex-shrink:0;border-radius:6px;transition:opacity .15s;}
.site-logo-link:hover{opacity:.85;}
.site-logo-link:focus-visible{outline:2px solid var(--secondary-color);outline-offset:4px;}

/* "Email me a copy?" dialog */
.modal-scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.modal-card{background:#fff;border-radius:14px;max-width:440px;width:100%;padding:24px 26px;box-shadow:0 20px 50px rgba(0,0,0,.2);}
.modal-card h3{margin:0 0 10px;font-size:18px;color:var(--primary-color);}
.modal-card p{margin:0 0 20px;color:var(--text-color);font-size:14px;line-height:1.55;word-break:break-word;}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}

/* Lamp reference cards + photo viewer */
.lamp-ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;}
.lamp-ref{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--border-color);border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit;color:inherit;transition:border-color .15s,background .15s,box-shadow .15s;}
.lamp-ref:hover{border-color:var(--primary-color);background:var(--primary-soft);}
.lamp-ref:focus-visible{outline:2px solid var(--primary-color);outline-offset:2px;}
.lamp-ref-code{font-weight:700;color:var(--primary-color);min-width:64px;font-size:13px;}
.lamp-ref-desc{flex:1;font-size:12px;color:var(--graphite-700);line-height:1.35;}
.lamp-ref-view{font-size:11px;font-weight:600;color:var(--primary-color);white-space:nowrap;}
/* Photos are landscape, 1408 × 768 (about 11:6). Boxes use the same shape so
   the pictures fill them edge to edge with no grey bars or cropping. */
.lamp-card{max-width:min(1040px,96vw);width:96vw;padding:18px 20px 20px;max-height:96vh;overflow-y:auto;}
.lamp-gallery{display:grid;grid-template-columns:1fr;gap:12px;}
.lamp-hint{font-size:11px;color:var(--muted);margin-top:6px;}
.lamp-photo{position:relative;background:#F1F5F9;border-radius:10px;width:100%;aspect-ratio:1408/768;
  /* never taller than the screen allows, so a whole photo is always visible */
  max-height:calc(96vh - 190px);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.lamp-photo a{display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
.lamp-photo img{display:block;width:100%;height:100%;object-fit:contain;cursor:zoom-in;}
/* very wide screens: two photos side by side */
@media(min-width:1500px) and (min-height:760px){
  .lamp-card{max-width:1400px;}
  .lamp-gallery{grid-template-columns:1fr 1fr;}
}

.pcdb-choice{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;font:inherit;background:#fff;border:1px solid var(--border-color);border-left:4px solid var(--primary-color);border-radius:10px;padding:10px 70px 10px 12px;cursor:pointer;}
.pcdb-choice:hover{background:var(--primary-soft);border-color:var(--primary-color);}
.pcdb-choice-main{font-weight:700;font-size:14px;color:var(--text-color);}
.pcdb-choice-sub{font-size:12px;color:var(--muted);}
.pcdb-choice-eff{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-weight:800;font-size:14px;color:#14532D;background:#DCFCE7;border-radius:8px;padding:4px 8px;}
.pcdb-back{display:block;margin:2px auto 0;font:inherit;font-size:13px;font-weight:600;color:var(--primary-color);background:none;border:none;cursor:pointer;}
.pcdb-label-key{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 16px 2px;padding:10px 14px;background:#DCFCE7;border:2px solid #22C55E;border-radius:10px;}
.pcdb-label-key span{font-size:12.5px;font-weight:600;color:#14532D;line-height:1.3;}
.pcdb-label-key strong{font-size:24px;color:#14532D;white-space:nowrap;}
.pcdb-label-dl{display:grid;grid-template-columns:auto 1fr;margin:0;padding:6px 16px;}
.pcdb-label-dl dt,.pcdb-label-dl dd{padding:7px 0;border-bottom:1px solid #EEF2F6;font-size:13.5px;margin:0;}
.pcdb-label-dl dt{color:var(--muted);padding-right:14px;}
.pcdb-label-dl dd{font-weight:600;text-align:right;}
.pcdb-label .pcdb-use{display:block;width:calc(100% - 32px);margin:10px 16px 6px;font:inherit;font-size:15px;font-weight:700;color:#fff;background:#16A34A;border:none;border-radius:10px;padding:12px;cursor:pointer;}
.pcdb-label .pcdb-use:hover{background:#15803D;}
.pcdb-label-link{display:block;text-align:center;font-size:12.5px;font-weight:600;color:var(--primary-color);padding:4px 0 14px;}
.pcdb-foot{font-size:11.5px;color:var(--muted);border-top:1px solid var(--border-color);padding-top:8px;margin-top:14px;line-height:1.5;}
.pcdb-foot a{color:var(--primary-color);font-weight:600;}
@media(max-width:760px){
  .pcdb-body{grid-template-columns:1fr;}
  .pcdb-fline{grid-template-columns:1fr;gap:4px;}
  .pcdb-factions{padding-left:0;}
}

/* EPC band badge + "This survey" panel */
/* optional-section switch */
.opt-switch{display:flex;align-items:center;gap:14px;cursor:pointer;user-select:none;}
.opt-switch-input{position:absolute;opacity:0;width:1px;height:1px;}
.opt-switch-track{flex:0 0 auto;position:relative;width:46px;height:26px;border-radius:999px;background:#CBD5E1;transition:background .2s;}
.opt-switch-track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s;}
.opt-switch-input:checked + .opt-switch-track{background:var(--primary-color);}
.opt-switch-input:checked + .opt-switch-track::after{transform:translateX(20px);}
.opt-switch-input:focus-visible + .opt-switch-track{outline:2px solid var(--primary-color);outline-offset:2px;}
.opt-switch-text{display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--text-color);}
.opt-switch-text span{font-size:12px;color:var(--muted);}
.calc-box{display:flex;align-items:center;min-height:42px;padding:0 14px;border-radius:8px;background:#F1F5F9;border:1px dashed var(--border-color);color:var(--muted);font-size:14px;}
.calc-box.set{background:var(--primary-soft);border:1px solid #BFDAD4;color:var(--primary-color);font-weight:700;font-size:16px;}
.epc-band-badge{display:inline-flex;align-items:center;justify-content:center;min-width:54px;height:40px;padding:0 14px;border-radius:8px;font-weight:700;font-size:18px;background:#F1F5F9;color:var(--muted);border:1px dashed var(--border-color);}
.epc-band-badge.set{border:none;color:#fff;}
.epc-band-badge.dark{color:#1E293B;}
.epc-band-badge.epc-masked-badge{filter:blur(6px);user-select:none;}
.epc-new-panel{background:#FFF7ED;border:1px solid #FED7AA;border-left:4px solid #EA580C;border-radius:10px;padding:4px 16px 12px;margin-top:18px;}
.epc-new-panel .epc-sub{color:#C2410C;}

@media(max-width:760px){
  body{padding:16px 10px 130px;}
  .titleblock{flex-direction:column;align-items:flex-start;padding:24px 20px;}
  .site-logo{height:32px;}
}

/* ---------- Tab navigation ---------- */
.tabs{
  display:flex;
  background:#F1F5F9;
  border-bottom:1px solid var(--border-color);
  overflow-x:auto;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{
  flex:1;
  min-width:140px;
  padding:15px 12px;
  background:none;
  border:none;
  border-bottom:3px solid transparent;
  font-family:inherit;
  font-size:13px;
  font-weight:600;
  color:var(--disabled-grey);
  text-align:center;
  white-space:nowrap;
  cursor:pointer;
  transition:all .2s ease;
}
.tab-btn:hover{color:var(--primary-hover);background:#E8EEF2;}
.tab-btn.active{
  color:var(--primary-color);
  border-bottom-color:var(--primary-color);
  background-color:var(--white);
}

/* ---------- Layout ---------- */
.wrap{padding:34px 40px 40px;}
@media(max-width:760px){.wrap{padding:22px 18px 28px;}}
.panel{display:none;}
.panel.active{display:block;animation:fadeIn .3s ease;}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(4px);}
  to{opacity:1;transform:translateY(0);}
}

/* ---------- Section cards ---------- */
.section{
  background:var(--white);
  border:1px solid var(--border-color);
  border-radius:12px;
  margin-bottom:24px;
  overflow:hidden;
}
.section-head{
  background:var(--primary-soft);
  color:var(--primary-color);
  border-bottom:1px solid var(--border-color);
  padding:14px 20px;
  font-size:15px;
  font-weight:600;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}
.section-body{padding:22px 20px;}

/* ---------- Convention chips ---------- */
.conv{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.conv-label{
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.6px;
  text-transform:uppercase;
  color:var(--muted);
  margin-right:2px;
}
.conv-chip{
  font-family:inherit;
  font-size:12px;
  font-weight:600;
  color:var(--primary-color);
  background:var(--white);
  border:1px solid #BBD5D0;
  border-radius:999px;
  padding:3px 11px;
  cursor:pointer;
  transition:all .15s ease;
  white-space:nowrap;
}
.conv-chip:hover,.conv-chip:focus-visible{
  background:var(--primary-color);
  border-color:var(--primary-color);
  color:var(--white);
  outline:none;
}
.conv-chip.is-open{
  background:var(--primary-color);
  border-color:var(--primary-color);
  color:var(--white);
}
.conv-note{
  font-size:11.5px;
  color:var(--muted);
  font-style:italic;
  font-weight:400;
}

/* ---------- Form grid ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.grid1{display:grid;grid-template-columns:1fr;gap:20px;}
@media(max-width:760px){.grid2{grid-template-columns:1fr;}}

.field{display:flex;flex-direction:column;gap:8px;}
.field label{
  display:block;
  font-weight:500;
  font-size:14px;
  color:#334155;
  margin:0;
}
.field label .req{color:var(--required);margin-left:2px;}
.field input[type=text],
.field input[type=email],
.field input[type=date],
.field input[type=number],
.field select,
.field textarea{
  width:100%;
  padding:12px 16px;
  border:1px solid var(--border-color);
  border-radius:8px;
  font-family:inherit;
  font-size:14px;
  color:var(--text-color);
  background-color:var(--field-bg);
  transition:all .2s ease;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;
  border-color:var(--primary-color);
  background-color:var(--white);
  box-shadow:0 0 0 3px rgba(45,106,106,.1);
}
.field.required input,
.field.required select{
  border-color:#F3C3C3;
  background-color:#FFFBFB;
}
.field.required input:focus,
.field.required select:focus{
  border-color:var(--primary-color);
  background-color:var(--white);
}
.field textarea{resize:vertical;min-height:88px;}
.field .hint{font-size:12.5px;color:var(--muted);}

/* ---------- Radio / checkbox groups ---------- */
.radiogroup{display:flex;gap:10px;flex-wrap:wrap;}
.radiogroup label{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;
  border:1px solid var(--border-color);
  border-radius:8px;
  background-color:var(--field-bg);
  font-size:14px;font-weight:400;
  color:var(--text-color);
  cursor:pointer;
  transition:all .2s ease;
}
.radiogroup label:hover{background-color:var(--hover-bg);border-color:#CBD5E1;}
.radiogroup input{width:18px;height:18px;accent-color:var(--primary-color);margin:0;cursor:pointer;}

/* ---------- Repeatable table-style rows ---------- */
.rowtable{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:2px;}
.rowtable th{
  font-size:12px;
  font-weight:600;
  color:#334155;
  text-align:left;
  padding:0 8px 6px;
  border-bottom:1px solid var(--border-color);
}
.rowtable td{padding:0 6px;vertical-align:top;}
.rowtable input,.rowtable select{
  width:100%;
  font-family:inherit;
  font-size:13.5px;
  padding:9px 11px;
  border:1px solid var(--border-color);
  border-radius:8px;
  background-color:var(--field-bg);
  color:var(--text-color);
  transition:all .2s ease;
}
.rowtable input:focus,.rowtable select:focus{
  outline:none;
  border-color:var(--primary-color);
  background-color:var(--white);
  box-shadow:0 0 0 3px rgba(45,106,106,.1);
}
.rowtable .del-btn{
  background:none;border:none;color:var(--disabled-grey);
  cursor:pointer;font-size:16px;line-height:1;padding:8px 4px;
  border-radius:6px;transition:all .2s ease;
}
.rowtable .del-btn:hover{color:#DC2626;background:#FEF2F2;}
.add-row-btn{
  margin-top:12px;
  font-family:inherit;
  font-size:14px;
  font-weight:600;
  background-color:var(--primary-soft);
  color:var(--primary-color);
  border:1px solid #BBD5D0;
  border-radius:8px;
  padding:11px 20px;
  cursor:pointer;
  transition:all .2s ease;
}
.add-row-btn:hover{background-color:var(--primary-color);color:var(--white);border-color:var(--primary-color);}

/* Horizontal scroll rather than a squashed table on narrow screens */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.table-scroll .rowtable{min-width:620px;}

/* ---------- Checklist grids ---------- */
.photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px;}
@media(max-width:900px){.photogrid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.photogrid{grid-template-columns:1fr;}}
.photoitem{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;
  border:1px solid var(--border-color);
  border-radius:8px;
  background-color:var(--field-bg);
  font-size:14px;
  cursor:pointer;
  transition:all .2s ease;
}
.photoitem:hover{background-color:var(--hover-bg);border-color:#CBD5E1;}
.photoitem input[type=checkbox]{width:18px;height:18px;accent-color:var(--primary-color);margin:0;cursor:pointer;flex-shrink:0;}
.photoitem label{flex:1;cursor:pointer;margin:0;font-weight:400;}

/* ---------- Convention reference list ---------- */
.convlist{display:flex;flex-direction:column;gap:8px;}
.convrow{
  display:grid;
  grid-template-columns:64px 1fr;
  gap:14px;align-items:center;
  padding:11px 14px;
  border:1px solid var(--border-color);
  border-radius:8px;
  background-color:var(--field-bg);
  cursor:pointer;
  text-align:left;
  font-family:inherit;
  transition:all .2s ease;
}
.convrow:hover{background-color:var(--primary-soft);border-color:#BBD5D0;}
.convrow .num{font-size:13px;font-weight:700;color:var(--primary-color);}
.convrow .desc{font-size:14px;color:#334155;}
.convrow.withdrawn .desc{color:var(--muted);font-style:italic;}

/* ---------- Convention drawer (right-hand slide-out) ---------- */
.conv-scrim{
  position:fixed;inset:0;
  background-color:rgba(15,23,42,.45);
  opacity:0;visibility:hidden;
  transition:opacity .25s ease,visibility .25s ease;
  z-index:900;
}
.conv-scrim.open{opacity:1;visibility:visible;}

.conv-drawer{
  position:fixed;top:0;right:0;bottom:0;
  width:480px;max-width:92vw;
  background:var(--white);
  box-shadow:-12px 0 34px rgba(15,23,42,.16);
  transform:translateX(100%);
  transition:transform .28s cubic-bezier(.32,.72,.35,1);
  z-index:901;
  display:flex;flex-direction:column;
}
.conv-drawer.open{transform:translateX(0);}

.conv-drawer-head{
  background-color:var(--primary-color);
  color:var(--white);
  border-bottom:4px solid var(--secondary-color);
  padding:22px 26px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
  flex-shrink:0;
}
.conv-drawer-head .cd-num{
  font-size:12px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:var(--secondary-color);
  margin-bottom:5px;
}
.conv-drawer-head h3{margin:0;font-size:18px;font-weight:600;line-height:1.35;}
.conv-drawer-head .cd-date{
  font-size:12px;color:#CBD5E1;margin-top:7px;
}
.conv-drawer-close{
  flex-shrink:0;
  width:32px;height:32px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.35);
  background:transparent;
  color:var(--white);
  font-size:19px;line-height:1;
  cursor:pointer;
  transition:all .2s ease;
}
.conv-drawer-close:hover{background:rgba(255,255,255,.16);}

.conv-drawer-body{
  padding:24px 26px 30px;
  overflow-y:auto;
  flex:1;
}
.conv-drawer-body .cd-cat{
  font-size:12px;font-weight:600;
  color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px;
  padding-bottom:14px;margin-bottom:18px;
  border-bottom:1px solid var(--border-color);
}
.conv-drawer-body dl{margin:0;}
.conv-drawer-body dt{
  font-weight:600;font-size:14px;
  color:var(--primary-color);
  margin-top:20px;
}
.conv-drawer-body dt:first-of-type{margin-top:0;}
.conv-drawer-body dd{
  margin:6px 0 0 0;
  font-size:14px;color:#334155;line-height:1.6;
}
.conv-drawer-body dd strong{color:var(--text-color);}

.conv-drawer-foot{
  flex-shrink:0;
  border-top:1px solid var(--border-color);
  background-color:var(--light-bg);
  padding:14px 26px;
  font-size:12px;
  color:var(--muted);
  line-height:1.5;
}
.conv-drawer-related{
  margin-top:22px;padding-top:18px;
  border-top:1px solid var(--border-color);
}
.conv-drawer-related .rel-label{
  font-size:12px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;
}
.conv-drawer-related .conv-chip{margin:0 6px 6px 0;}

@media(max-width:560px){
  .conv-drawer{width:100%;max-width:100%;}
  .conv-drawer-head{padding:18px 20px;}
  .conv-drawer-body{padding:20px;}
  .conv-drawer-foot{padding:12px 20px;}
}

/* ---------- Fixed action bar ---------- */
.actionbar{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--white);
  border-top:1px solid var(--border-color);
  box-shadow:0 -6px 20px rgba(15,23,42,.06);
  padding:14px 32px;
  display:flex;justify-content:space-between;align-items:center;
  gap:16px;flex-wrap:wrap;
  z-index:500;
}
.actionbar .status{font-size:13px;color:var(--muted);}
.actionbar .status span{color:var(--success);font-weight:600;}
.actionbar .buttons{display:flex;gap:12px;flex-wrap:wrap;}
.btn{
  padding:12px 24px;
  border-radius:8px;
  font-family:inherit;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  border:none;
  transition:all .2s ease;
}
.btn-secondary{background-color:#E2E8F0;color:#475569;}
.btn-secondary:hover{background-color:#CBD5E1;}
.btn-primary{background-color:var(--primary-color);color:var(--white);}
.btn-primary:hover{background-color:var(--primary-hover);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
@media(max-width:760px){
  .actionbar{padding:12px 16px;}
  .actionbar .buttons{width:100%;}
  .actionbar .btn{flex:1;}
}

.empty-note{color:var(--muted);font-style:italic;font-size:13px;}

/* ---------- Update banner (stale cached build) ---------- */
.update-banner{
  position:fixed;top:0;left:0;right:0;
  background-color:var(--primary-color);
  color:var(--white);
  padding:12px 20px;
  font-size:13.5px;
  display:flex;align-items:center;justify-content:center;
  gap:14px;flex-wrap:wrap;
  z-index:1200;
  box-shadow:0 4px 14px rgba(15,23,42,.18);
}
.update-banner button{
  background:var(--white);color:var(--primary-color);
  border:none;border-radius:6px;
  padding:7px 15px;font-size:13px;font-weight:600;
  font-family:inherit;cursor:pointer;
}

/* ---------- Export capture sheet (offscreen; used only for export) ---------- */
#print-sheet{
  position:absolute;left:-9999px;top:0;
  width:780px;
  background:#fff;
  color:#1E293B;
  font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
  padding:40px 46px;
}
#print-sheet h1{
  font-size:21px;font-weight:600;
  border-bottom:3px solid #2D6A6A;padding-bottom:10px;margin:0 0 4px;
  color:#2D6A6A;
}
#print-sheet .ps-sub{font-size:11.5px;color:#64748B;margin-bottom:22px;}
#print-sheet h2{
  font-size:13px;text-transform:uppercase;letter-spacing:.4px;
  background:#2D6A6A;color:#fff;padding:7px 11px;margin:24px 0 9px;
  border-radius:4px;
}
#print-sheet h2 .pc{font-size:9.5px;color:#BFE8DC;font-weight:400;margin-left:8px;text-transform:none;letter-spacing:0;}
#print-sheet table{width:100%;border-collapse:collapse;margin-bottom:6px;font-size:11.5px;}
#print-sheet table th{
  background:#EAF3F1;text-align:left;padding:6px 8px;font-size:10px;
  text-transform:uppercase;color:#2D6A6A;border:1px solid #D6E3E0;
}
#print-sheet table td{padding:6px 8px;border:1px solid #D6E3E0;vertical-align:top;}
#print-sheet .kvrow{display:grid;grid-template-columns:160px 1fr 160px 1fr;font-size:11.5px;border-bottom:1px solid #EEF2F5;padding:4px 0;}
#print-sheet .kvrow .k{font-weight:600;color:#334155;}
#print-sheet .notesblock{font-size:11.5px;white-space:pre-wrap;padding:6px 0;border-bottom:1px solid #EEF2F5;}
#print-sheet .notesblock .k{font-weight:600;color:#334155;display:block;margin-bottom:3px;}
#print-sheet .sign{margin-top:32px;display:grid;grid-template-columns:1fr 1fr;gap:30px;}
#print-sheet h3{font-size:12px;margin:12px 0 4px;color:#2D6A6A;}
#print-sheet .sign .sign-img{height:64px;display:flex;align-items:flex-end;}
#print-sheet .sign .sign-img img{height:60px;width:auto;}
#print-sheet .sign .sign-line{border-top:1px solid #94A3B8;padding-top:6px;font-size:11px;color:#64748B;}


/* ---------- Previous EPC check ---------- */
.epc-status{font-size:12.5px;color:var(--muted);}
.epc-status.busy{color:var(--primary-color);}
.epc-status.warn{color:var(--amber);}
.epc-status.err{color:var(--required);}
.epc-cands{display:flex;flex-direction:column;gap:6px;margin:10px 0 6px;}
.epc-cand{padding:9px 12px;border:1px solid var(--border-color);border-radius:10px;background:var(--field-bg);cursor:pointer;}
.epc-cand:hover{background:var(--hover-bg);}
.epc-cand:focus{outline:2px solid var(--primary-color);outline-offset:1px;}
.epc-cand.sel{border-color:var(--primary-color);background:var(--primary-soft);}
.epc-cand .a{font-weight:600;font-size:13.5px;}
.epc-cand .m{font-size:12.5px;color:var(--muted);margin-top:2px;}
.epc-badge{margin-left:8px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--primary-soft);color:var(--primary-color);border:1px solid var(--primary-color);}
.epc-sub{margin:20px 0 8px;font-size:13px;font-weight:700;color:var(--primary-color);text-transform:uppercase;letter-spacing:.3px;}
.epc-sub2{font-size:13px;font-weight:600;margin-bottom:6px;}
table.epc-cmp{width:100%;border-collapse:collapse;font-size:13px;min-width:560px;}
table.epc-cmp th{background:var(--light-bg);text-align:left;padding:7px 10px;border:1px solid var(--border-color);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
table.epc-cmp td{padding:7px 10px;border:1px solid var(--border-color);vertical-align:top;}
table.epc-cmp td:first-child{font-weight:600;width:170px;}
.epc-flag{color:var(--amber);font-weight:600;}
.epc-banner{padding:10px 14px;border-radius:10px;font-size:13.5px;margin:6px 0 12px;border:1px solid;}
.epc-banner.ok{background:#ECFDF5;border-color:#A7F3D0;color:#065F46;}
.epc-banner.review{background:#FFFBEB;border-color:#FDE68A;color:#92400E;}
.epc-banner.investigate{background:#FEF2F2;border-color:#FECACA;color:#991B1B;}
.epc-banner.none{background:var(--light-bg);border-color:var(--border-color);color:var(--muted);}
input.epc-masked{color:transparent !important;text-shadow:0 0 9px rgba(30,41,59,.65);user-select:none;}

</style>

function el(tag, attrs={}, ...children){
  const e = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k==="class") e.className=v;
    else if(k==="html") e.innerHTML=v;
    else e.setAttribute(k,v);
  }
  children.forEach(c=>{ if(typeof c==="string") e.appendChild(document.createTextNode(c)); else if(c) e.appendChild(c); });
  return e;
}

function field(labelText, inputEl, required=false, hint=null){
  const wrap = el("div",{class:"field"+(required?" required":"")});
  const lbl = el("label",{}, labelText, required?el("span",{class:"req"},"●"):null);
  wrap.appendChild(lbl);
  wrap.appendChild(inputEl);
  if(hint) wrap.appendChild(el("div",{class:"hint"},hint));
  return wrap;
}

function textInput(id, placeholder=""){
  return el("input",{type:"text", id, placeholder, autocomplete:"off"});
}
function dateInput(id){ return el("input",{type:"date", id}); }
function selectInput(id, options, placeholder="Select…"){
  const s = el("select",{id});
  s.appendChild(el("option",{value:""},placeholder));
  options.forEach(o=> s.appendChild(el("option",{value:o},o)));
  return s;
}
function textarea(id, rows=3){

/* ============================================================================
   SECTION / PANEL BUILDERS
   ============================================================================ */

/* Turns a convention spec string such as
   "3.02 · 3.07 · 6.13"  or  "7.01–7.06"  or
   "3.07 — doors >50% glazed count as glazing"
   into a list of convention numbers plus any trailing plain-English note. */
function parseConvSpec(spec){
  const nums = [];
  let note = "";
  String(spec).split("·").forEach(part=>{
    const t = part.trim();
    if(!t) return;
    const range = t.match(/^(\d+)\.(\d{2})\s*[–—-]\s*(\d+)\.(\d{2})$/);
    if(range && range[1] === range[3]){
      for(let n = parseInt(range[2],10); n <= parseInt(range[4],10); n++){
        nums.push(range[1] + "." + String(n).padStart(2,"0"));
      }
      return;
    }
    const m = t.match(/^(\d+\.\d{2})/);
    if(m){
      nums.push(m[1]);
      const rest = t.slice(m[1].length).replace(/^\s*[–—-]\s*/,"").trim();
      if(rest) note = note ? note + " " + rest : rest;
    } else {
      note = note ? note + " " + t : t;
    }
  });
  return {nums, note};
}

/* A single clickable convention pill. */
function convChip(num, siblings){
  const rec = CONV_DATA[num];
  const b = el("button",{
    type:"button",
    class:"conv-chip",
    "data-conv":num,
    title: rec ? rec.title : "Convention " + num
  });
  b.textContent = num;
  b.addEventListener("click", ()=> openConvDrawer(num, siblings || []));
  return b;
}

function section(title, conv, bodyEl){
  const sec = el("div",{class:"section"});
  const head = el("div",{class:"section-head"});
  const titleWrap = el("span",{class:"section-title"}, el("span",{},title));
  const gcat = (typeof GUIDE_SECTION_MAP!=="undefined") && GUIDE_SECTION_MAP[title];
  if(gcat){
    [].concat(gcat).forEach(cid=>{
      const gb = el("button",{type:"button", class:"guide-btn", title:"Open the photo reference guide"}, GUIDE_BTN_LABEL[cid] || "📷 Photo guide");
      gb.addEventListener("click", ()=> openGuide(cid));
      titleWrap.appendChild(gb);
    });
  }
  head.appendChild(titleWrap);
  if(conv){
    const {nums, note} = parseConvSpec(conv);
    const box = el("div",{class:"conv"});
    if(nums.length) box.appendChild(el("span",{class:"conv-label"},"Conventions"));
    nums.forEach(n=> box.appendChild(convChip(n, nums)));
    if(note) box.appendChild(el("span",{class:"conv-note"},note));
    head.appendChild(box);
  }
  sec.appendChild(head);
  const body = el("div",{class:"section-body"});
  body.appendChild(bodyEl);
  sec.appendChild(body);
  return sec;
}

/* ============================================================================
   PREVIOUS EPC CHECK
   Looks up earlier non-domestic EPCs for the postcode (via the proxy Worker),
   lets the assessor confirm the matching address, then compares this survey's
   floor area / fuel / rating with the previous certificate and records the
   reason for any material difference. With no proxy configured the same
   fields work as manual entry.
   ============================================================================ */
const EPC_POSTCODE_RE = /^[A-Z]{1,2}\d[A-Z\d]?\s?\d[A-Z]{2}$/;
const EPC_BAND_ORDER = ["A+","A","B","C","D","E","F","G"];
const EPC_STOP_WORDS = new Set(["the","and","of","ltd","limited","plc"]);
const EPC_REASONS = [
  "Floor area / zoning differs from previous EPC",
  "Building use / activity types differ",
  "Fabric changes (glazing, insulation, extension)",
  "Heating / cooling system or fuel changed",
  "Lighting upgraded",
  "Renewables added or removed (PV, solar thermal)",
  "Previous EPC likely used default / unverified inputs",
  "Different building part or scope from previous EPC",
  "Different NCM / SBEM version or convention issue",
  "Previous EPC appears to contain an error",
  "Other (explain below)"
];
const EPC_RECHECK = [
  "Total floor area and zone areas",
  "Building use / NCM activity assignments",
  "Heating, cooling and DHW - fuel, efficiency, controls",
  "Glazing areas / U-values and fabric constructions",
  "Lighting - lamp type, controls, lux where applicable",
  "Air permeability and ventilation assumptions",
  "Renewables and any on-site generation entered",
  "Conventions applied as per the Conventions tab"
];
const epcState = { candidates:[], selectedKey:null, fetchedFor:"", retrievedAt:null, dataAsOf:"", meta:null, source:"", edited:false, showAll:false, extra:null };

function epcBand(r){
  if(r===null||r===undefined||isNaN(r)) return "";
  if(r<0) return "A+";
  if(r<=25) return "A"; if(r<=50) return "B"; if(r<=75) return "C";
  if(r<=100) return "D"; if(r<=125) return "E"; if(r<=150) return "F";
  return "G";
}
function epcNum(id){ const v = parseFloat(val(id)); return isNaN(v) ? null : v; }
function epcFmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
}
function epcValidUntil(iso){
  if(!iso) return null;
  const d = new Date(iso);
  if(isNaN(d)) return null;
  d.setFullYear(d.getFullYear()+EPC_CONFIG.EPC_VALIDITY_YEARS);
  return d;
}
function epcTokens(s){
  return String(s||"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").split(/\s+/).filter(t=>t && !EPC_STOP_WORDS.has(t));
}
function epcMasked(){
  return EPC_CONFIG.HIDE_PREVIOUS_RATING_UNTIL_ENTERED && epcNum("epc_new_rating")===null;
}
function epcSetStatus(msg, kind){
  const s = document.getElementById("epc_status");
  if(!s) return;
  s.textContent = msg;
  s.className = "epc-status "+(kind||"");
}

function epcEnabled(){ return checked("epc_enabled"); }
function syncEpcEnabled(){
  const b = document.getElementById("epc_body");
  if(b) b.style.display = epcEnabled() ? "" : "none";
}

/* ---------- lookup ---------- */
let epcDebounce = null;
function epcOnPostcodeInput(raw){
  if(!epcEnabled()) return;           // only look up when the optional check is switched on
  const pc = String(raw||"").trim().toUpperCase().replace(/\s+/g," ");
  clearTimeout(epcDebounce);
  if(!EPC_POSTCODE_RE.test(pc)) return;
  epcDebounce = setTimeout(()=> epcSearch(pc,false), 700);
}

async function epcFetchResults(pc){
  /* Returns {results, retrieved, dataAsOf}. Uses the Worker if PROXY_URL is set,
     otherwise the pre-built district files in DATA_URL. */
  if(EPC_CONFIG.PROXY_URL){
    const r = await fetch(EPC_CONFIG.PROXY_URL.replace(/\/+$/,"")+"/search?postcode="+encodeURIComponent(pc), {headers:{Accept:"application/json"}});
    const j = await r.json().catch(()=>({}));
    if(!r.ok || !j.ok) throw new Error(j.error || ("HTTP "+r.status));
    return {results:j.results||[], retrieved:j.retrieved ? new Date(j.retrieved) : new Date(), dataAsOf:""};
  }
  const base = EPC_CONFIG.DATA_URL.replace(/\/+$/,"");
  const district = pc.split(" ")[0];
  if(!epcState.meta){
    try{
      const m = await fetch(base+"/_meta.json");
      epcState.meta = m.ok ? await m.json() : {};
    }catch(e){ epcState.meta = {}; }
  }
  let r;
  try{ r = await fetch(base+"/"+encodeURIComponent(district)+".json"); }
  catch(e){ throw new Error("could not load the EPC data files - open the site note from its web address, not as a file on your computer"); }
  if(r.status===404) return {results:[], retrieved:new Date(), dataAsOf:(epcState.meta||{}).newestLodgement||""};
  if(!r.ok) throw new Error("HTTP "+r.status+" loading "+district+".json");
  const j = await r.json();
  const all = j.results||[];
  const norm = s=>String(s).replace(/\s+/g,"");
  return {results: all.filter(c=>norm(c.postcode)===norm(pc)), retrieved:new Date(), dataAsOf:(epcState.meta||{}).newestLodgement||""};
}

async function epcSearch(pc, force){
  if(!EPC_CONFIG.PROXY_URL && !EPC_CONFIG.DATA_URL){
    epcSetStatus("Automatic lookup is not switched on for this form - enter the previous EPC details manually below.","warn");
    return;
  }
  if(epcState.fetchedFor===pc && !force) return;
  epcSetStatus("Searching the EPC Register data for "+pc+"…","busy");
  try{
    const res = await epcFetchResults(pc);
    epcState.fetchedFor = pc;
    epcState.retrievedAt = res.retrieved;
    epcState.dataAsOf = res.dataAsOf;
    epcState.candidates = epcGroup(res.results);
    epcState.showAll = false;
    const asOf = res.dataAsOf ? " (register data to "+epcFmtDate(res.dataAsOf)+")" : "";
    if(!epcState.candidates.length){
      epcSetStatus("No non-domestic EPCs found for "+pc+asOf+". If you know one exists, enter it manually below.","warn");
    } else {
      epcSetStatus(epcState.candidates.length+" property record"+(epcState.candidates.length===1?"":"s")+" found for "+pc+asOf+". Select the one that matches this building.","");
    }
    epcRerank();
  }catch(err){
    epcState.candidates = [];
    epcRenderCandidates();
    epcSetStatus("Could not retrieve EPCs ("+err.message+"). You can still enter the previous EPC details manually.","err");
  }
}

function epcGroup(results){
  const map = new Map();
  results.forEach(c=>{
    const key = c.uprn ? "u"+c.uprn : "a"+epcTokens(c.address+" "+c.postcode).join(" ");
    if(!map.has(key)) map.set(key,{key, address:c.address, postcode:c.postcode, uprn:c.uprn, certs:[]});
    map.get(key).certs.push(c);
  });
  const list = Array.from(map.values());
  list.forEach(g=>{
    g.certs.sort((a,b)=> String(b.lodgementDate||"").localeCompare(String(a.lodgementDate||"")));
    g.latest = g.certs[0];
    g.address = g.latest.address || g.address;
  });
  return list;
}

function epcRerank(){
  const pcTok = new Set(epcTokens(val("p_postcode")));
  const typed = epcTokens(val("p_address")).filter(t=>!pcTok.has(t));
  epcState.candidates.forEach(g=>{
    if(!typed.length){ g.score = 0; return; }
    const have = new Set(epcTokens(g.address));
    g.score = typed.filter(t=>have.has(t)).length / typed.length;
  });
  epcState.candidates.sort((a,b)=> (b.score-a.score) || String(a.address).localeCompare(String(b.address)));
  epcRenderCandidates();
}

function epcRenderCandidates(){
  const box = document.getElementById("epc_cands");
  if(!box) return;
  box.innerHTML = "";
  const list = epcState.candidates;
  if(!list.length) return;
  const masked = epcMasked();
  const limit = epcState.showAll ? list.length : 10;
  list.slice(0,limit).forEach((g,i)=>{
    const c = g.latest;
    const band = c.band || epcBand(c.assetRating);
    const ratingTxt = masked ? "Rating hidden until you enter yours"
      : ((band?("Band "+band):"") + (c.assetRating!==null && c.assetRating!==undefined ? " ("+c.assetRating+")" : ""));
    const meta = [
      ratingTxt,
      c.lodgementDate ? "lodged "+epcFmtDate(c.lodgementDate) : "",
      c.floorArea ? Math.round(c.floorArea).toLocaleString("en-GB")+" m²" : "",
      g.certs.length>1 ? (g.certs.length-1)+" earlier certificate"+(g.certs.length>2?"s":"") : ""
    ].filter(Boolean).join("  ·  ");
    const top = el("div",{class:"a"}, g.address || "(no address returned)");
    if(i===0 && g.score>=0.5) top.appendChild(el("span",{class:"epc-badge"},"Closest match to your address"));
    const row = el("div",{class:"epc-cand"+(g.key===epcState.selectedKey?" sel":""), role:"button", tabindex:"0"},
      el("div",{}, top, el("div",{class:"m"}, meta)));
    row.addEventListener("click", ()=> epcSelect(g.key));
    row.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); epcSelect(g.key); } });
    box.appendChild(row);
  });
  if(list.length>limit){
    const more = el("button",{class:"btn btn-secondary", type:"button", style:"align-self:flex-start;"}, "Show all "+list.length+" records");
    more.addEventListener("click", ()=>{ epcState.showAll = true; epcRenderCandidates(); });
    box.appendChild(more);
  }
}

function epcSelect(key){
  const g = epcState.candidates.find(x=>x.key===key);
  if(!g) return;
  epcState.selectedKey = key;
  epcState.source = "register";
  epcState.edited = false;
  epcState.extra = g;
  const c = g.latest;
  const set = (id,v)=>{ const e=document.getElementById(id); if(e) e.value = (v===null||v===undefined) ? "" : v; };
  set("epc_prev_addr", g.address);
  set("epc_prev_uprn", g.uprn);
  set("epc_prev_cert", c.lmk);
  set("epc_prev_rating", c.assetRating);
  set("epc_prev_date", String(c.lodgementDate||"").slice(0,10));
  set("epc_prev_area", c.floorArea);
  set("epc_prev_type", c.propertyType);
  epcRenderCandidates();
  epcRenderHistory();
  epcRefresh();
}

function epcRenderHistory(){
  const box = document.getElementById("epc_history");
  if(!box) return;
  box.innerHTML = "";
  const g = epcState.extra;
  if(!g || g.certs.length<2 || epcState.source!=="register") return;
  const masked = epcMasked();
  let h = '<div class="hint" style="margin:6px 0;">All certificates found for this property (newest first). The newest is used above.</div>'
        + '<table class="epc-cmp"><tr><th>Lodged</th><th>Rating</th><th>Floor area (m²)</th><th>Certificate ref</th></tr>';
  g.certs.forEach(c=>{
    const band = c.band || epcBand(c.assetRating);
    h += "<tr><td>"+escapeHtml(epcFmtDate(c.lodgementDate)||"—")+"</td><td>"
      + (masked ? "hidden" : escapeHtml(c.assetRating!==null&&c.assetRating!==undefined ? c.assetRating+(band?" ("+band+")":"") : "—"))
      + "</td><td>"+escapeHtml(c.floorArea!==null&&c.floorArea!==undefined ? Math.round(c.floorArea).toLocaleString("en-GB") : "—")
      + "</td><td>"+escapeHtml(c.lmk||"—")+"</td></tr>";
  });
  box.innerHTML = h+"</table>";
}

/* ---------- comparison logic ---------- */
function epcFuelCat(s){
  s = String(s||"").toLowerCase();
  if(!s) return "";
  if(/lpg|liquefied|propane|butane/.test(s)) return "lpg";
  if(/oil|kerosene/.test(s)) return "oil";
  if(/bio|wood|pellet/.test(s)) return "biomass";
  if(/gas/.test(s)) return "gas";
  if(/electric/.test(s)) return "electricity";
  if(/coal|anthracite|smokeless/.test(s)) return "solid fuel";
  if(/waste heat|district|heat network/.test(s)) return "heat network";
  return s;
}
function epcCurrentFuels(){
  try{
    const rows = readRowTable(hvacTable.systems);
    return Array.from(new Set(rows.map(r=>r.fuel).filter(Boolean)));
  }catch(e){ return []; }
}
function epcVariance(pR, nR){
  if(pR===null || nR===null) return null;
  const delta = nR - pR;
  const pb = epcBand(pR), nb = epcBand(nR);
  const bands = EPC_BAND_ORDER.indexOf(nb) - EPC_BAND_ORDER.indexOf(pb);
  const abs = Math.abs(delta);
  let level = "ok";
  if(abs>=EPC_CONFIG.INVESTIGATE_POINTS || Math.abs(bands)>=2) level = "investigate";
  else if(abs>=EPC_CONFIG.REVIEW_POINTS) level = "review";
  return {delta, bands, pb, nb, level};
}
function epcVarianceText(v){
  if(v.delta===0) return "This survey's rating is the same as the previous EPC (band "+v.nb+").";
  const a = Math.abs(v.delta);
  const dir = v.delta>0 ? "worse than" : "better than";
  const bandTxt = v.pb===v.nb ? "both band "+v.nb : v.pb+" → "+v.nb;
  return "This survey's rating is "+a+" point"+(a===1?"":"s")+" "+dir+" the previous EPC ("+bandTxt+").";
}
const EPC_LEVEL_LABEL = {
  ok: "Consistent with previous EPC",
  review: "Review recommended",
  investigate: "Significant difference - double-check before finalising"
};
function epcInputFlags(){
  const out = {areaPct:null, areaFlag:"", fuelFlag:"", fuels:epcCurrentFuels()};
  const pA = epcNum("epc_prev_area"), nA = epcNum("epc_new_area");
  if(pA && nA){
    out.areaPct = (nA-pA)/pA*100;
    if(Math.abs(out.areaPct) > EPC_CONFIG.FLOOR_AREA_TOLERANCE_PCT)
      out.areaFlag = "Floor area differs by "+(out.areaPct>0?"+":"")+out.areaPct.toFixed(1)+"% from the previous EPC.";
  }
  return out;
}

function epcApplyMask(){
  const masked = epcMasked();
  const inp = document.getElementById("epc_prev_rating");
  if(inp) inp.classList.toggle("epc-masked", masked);
  const colours = {"A+":"#00855A","A":"#00855A","B":"#19B459","C":"#8DCE46","D":"#FFD500","E":"#FCAA65","F":"#EF8023","G":"#E9153B"};
  const paint = (id, score, hide)=>{
    const b = document.getElementById(id); if(!b) return;
    const band = epcBand(score);
    b.textContent = band || "—";
    b.classList.toggle("set", !!band);
    b.classList.toggle("dark", ["C","D","E"].includes(band));
    b.style.background = band ? colours[band] : "";
    b.classList.toggle("epc-masked-badge", !!(hide && band));
  };
  paint("epc_prev_band", epcNum("epc_prev_rating"), masked);
  paint("epc_new_band", epcNum("epc_new_rating"), false);
}
/* Leading use-class code, e.g. "B1 Offices…" -> "B1", "A1/A2 Retail…" -> "A1/A2" */
function epcUseCode(s){
  const m = String(s||"").trim().toUpperCase().match(/^([A-Z]\d*[A-Z]?(?:\s*\/\s*[A-Z]\d*[A-Z]?)*)\b/);
  return m ? m[1].replace(/\s+/g,"") : "";
}

function epcRefresh(){
  epcApplyMask();
  const cmp = document.getElementById("epc_compare");
  if(!cmp) return;
  const pR = epcNum("epc_prev_rating"), nR = epcNum("epc_new_rating");
  const masked = epcMasked();
  const fl = epcInputFlags();
  const v = epcVariance(pR,nR);
  const fmtR = r => r===null ? "—" : r+" (band "+epcBand(r)+")";
  const vu = epcValidUntil(val("epc_prev_date"));
  const expired = vu && vu < new Date();

  const row = (label, prev, cur, diff, flagged) =>
    "<tr><td>"+escapeHtml(label)+"</td><td>"+prev+"</td><td>"+cur+"</td><td"+(flagged?' class="epc-flag"':"")+">"+diff+"</td></tr>";
  let h = '<table class="epc-cmp"><tr><th></th><th>Previous EPC</th><th>This survey</th><th>Difference</th></tr>';
  h += row("EPC rating & score",
    masked ? "<em>hidden until you enter your modelled score</em>" : escapeHtml(pR===null ? "—" : epcBand(pR)+" ("+pR+")"),
    escapeHtml(nR===null ? "—" : epcBand(nR)+" ("+nR+")"),
    v ? (v.delta>0?"+":"")+v.delta+" pts"+(v.bands ? ", "+Math.abs(v.bands)+" band"+(Math.abs(v.bands)>1?"s":"")+(v.bands>0?" worse":" better") : ", same band") : "—",
    v && v.level!=="ok");
  h += row("Floor area (m²)",
    escapeHtml(val("epc_prev_area")||"—"), escapeHtml(val("epc_new_area")||"—"),
    fl.areaPct===null ? "—" : (fl.areaFlag?"⚠ ":"")+(fl.areaPct>0?"+":"")+fl.areaPct.toFixed(1)+"%",
    !!fl.areaFlag);
  const pT = val("epc_prev_type"), nT = val("p_use");
  const pc = epcUseCode(pT), nc = epcUseCode(nT);
  let tDiff = "—", tFlag = false;
  if(pT && nT){
    if(pc && nc){ tFlag = pc!==nc; tDiff = tFlag ? "⚠ Differs" : "Same"; }
    else tDiff = "Compare manually";
  }
  h += row("Activity type",
    escapeHtml(pT||"—"), escapeHtml(nT||"— (set Building Use on this tab)"), tDiff, tFlag);
  h += "</table>";
  cmp.innerHTML = h;

  const ban = document.getElementById("epc_banner");
  const recheck = document.getElementById("epc_recheck_wrap");
  const reasonWrap = document.getElementById("epc_reason_wrap");
  const warn = document.getElementById("epc_reason_warn");
  if(v){
    ban.className = "epc-banner "+v.level;
    ban.innerHTML = "<strong>"+escapeHtml(EPC_LEVEL_LABEL[v.level])+".</strong> "+escapeHtml(epcVarianceText(v))
      + (v.level!=="ok" ? " A difference is not necessarily an error - re-check the items below, then record the reason." : "");
  } else {
    ban.className = "epc-banner none";
    ban.textContent = masked
      ? "Enter your modelled asset rating and floor area below to see how this survey compares with the previous EPC."
      : "Enter the previous EPC details above and your modelled asset rating below to see the comparison.";
  }
  const flagged = !!(v && v.level!=="ok");
  recheck.style.display = (flagged || fl.areaFlag || fl.fuelFlag) ? "" : "none";
  reasonWrap.style.display = (flagged || fl.areaFlag || fl.fuelFlag) ? "" : "none";
  const anyReason = EPC_REASONS.some((_,i)=>checked("epc_reason_"+i)) || val("epc_reason_text").trim()!=="";
  warn.style.display = (flagged && !anyReason) ? "" : "none";
  const notes = [fl.areaFlag, fl.fuelFlag].filter(Boolean);
  const nb = document.getElementById("epc_input_notes");
  nb.innerHTML = notes.map(n=>"<div class=\"epc-flag\">⚠ "+escapeHtml(n)+"</div>").join("");
}

/* ---------- section UI ---------- */
function buildEpcSection(){
  const body = el("div");

    "Enter the postcode above and earlier non-domestic EPCs for that postcode are listed. Confirm the matching property. "+

    "⚠ The rating differs materially from the previous EPC and no reason has been recorded yet."));
  const rwGrid = el("div",{class:"photogrid"});
  EPC_REASONS.forEach((t,i)=>{
    const id = "epc_reason_"+i;
    rwGrid.appendChild(el("div",{class:"photoitem"}, el("input",{type:"checkbox", id}), el("label",{for:id}, t)));
  });
  rw.appendChild(rwGrid);
  rw.appendChild(el("div",{style:"height:10px"}));
  rw.appendChild(field("Explanation (evidence you would give the client)", textarea("epc_reason_text",3)));
  body.appendChild(rw);

  setTimeout(epcRefresh,0);

  // Optional: hidden (and left out of the site note) until switched on
  const outer = el("div");
  const tog = el("input",{type:"checkbox", id:"epc_enabled", class:"opt-switch-input"});
  outer.appendChild(el("label",{class:"opt-switch", for:"epc_enabled"},
    tog, el("span",{class:"opt-switch-track","aria-hidden":"true"}),
    el("span",{class:"opt-switch-text"}, el("strong",{},"Include a Previous EPC Check"),
      el("span",{}, "Optional. When switched on, this check is shown here and included in the site note."))));
  body.id = "epc_body";
  body.style.display = "none";
  body.style.marginTop = "18px";
  outer.appendChild(body);
  tog.addEventListener("change", ()=>{
    syncEpcEnabled();
    if(tog.checked){ const pc = val("p_postcode"); if(pc) epcOnPostcodeInput(pc); }
  });
  return section("Previous EPC Check (optional)", "", outer);
}

/* one delegated listener keeps the comparison live as any field changes */
let epcRefreshTimer = null;
function epcOnAnyChange(e){
  const id = (e.target && e.target.id) || "";
  if(id.indexOf("epc_prev_")===0){
    if(epcState.source==="register") epcState.edited = true;
    else if(!epcState.source) epcState.source = "manual";
  }
  if(id==="p_address" && epcState.candidates.length){ clearTimeout(epcRefreshTimer); epcRefreshTimer = setTimeout(epcRerank,400); }
  clearTimeout(epcRefreshTimer);
  epcRefreshTimer = setTimeout(()=>{ epcRefresh(); if(id==="epc_new_rating"){ epcRenderCandidates(); epcRenderHistory(); } }, 150);
}
document.addEventListener("input", epcOnAnyChange);
document.addEventListener("change", epcOnAnyChange);

function currentAssessor(){ return ASSESSORS.find(a=>a.name===val("p_assessor")) || null; }
function onAssessorChange(){
  const a = currentAssessor();
  document.getElementById("p_assessor_email").value = a ? a.email : "";
  document.getElementById("p_membership").value = a ? a.membership : "";
  const img = document.getElementById("p_sig_img"), box = document.getElementById("p_sig_box");
  if(a){ img.src = a.sig; img.alt = "Signature of "+a.name; box.style.display = ""; }
  else { img.removeAttribute("src"); box.style.display = "none"; }
}

/* Air permeability (m³/h·m² @ 50 Pa) by Building Regulation age */
const AIR_PERM_BY_REGS = {
  "Pre 1974 Building":25, "1975/80 Building":25, "1980/85 Building":25, "1990 Building":25,
  "1995 Building":15, "2002 Building":15, "2006 Onwards":10
};
function airPermValue(){ const v = AIR_PERM_BY_REGS[val("p_bregs_age")]; return v===undefined ? "" : String(v); }
function syncAirPerm(){
  const box = document.getElementById("p_airperm"); if(!box) return;
  const regs = val("p_bregs_age"), v = airPermValue();
  box.classList.toggle("set", !!v);
  box.textContent = v ? v+" m³/h·m²" : (regs ? "No value set for this option" : "—");
}

/* Shows one or two extension Building Regs boxes depending on the answer */
function syncExtensions(){
  const v = val("p_has_ext");
  const n = v.indexOf("Yes - 2")===0 ? 2 : (v.indexOf("Yes")===0 ? 1 : 0);
  [["p_bregs_ext_wrap","p_bregs_ext_age",1],["p_bregs_ext2_wrap","p_bregs_ext2_age",2]].forEach(([w,id,k])=>{
    const wrap = document.getElementById(w); if(!wrap) return;
    wrap.style.display = n>=k ? "" : "none";
    if(n<k) document.getElementById(id).value = "";
  });
}

/* ---------- PROJECT PANEL ---------- */
function buildProjectPanel(){
  const panel = el("div",{id:"panel-project", class:"panel"});

  const g1 = el("div",{class:"grid2"});
  g1.appendChild(field("Site Address", textInput("p_address"), true));
  const assessorSel = selectInput("p_assessor", ASSESSORS.map(a=>a.name), "Select assessor…");
  assessorSel.addEventListener("change", onAssessorChange);
  g1.appendChild(field("Assessor Name", assessorSel, true, "Fills in email, membership number and signature"));
  g1.appendChild(field("Assessor Email", (()=>{const i=textInput("p_assessor_email"); i.type="email"; i.placeholder="name@company.com"; return i;})(), false, "Completed site note will be emailed here automatically"));

/* ---------- AUTOMATIC POSTCODE LOOKUP HANDLER ---------- */
function handlePostcodeLookup(e) {
  epcOnPostcodeInput(e.target.value);
  const inputStr = e.target.value.trim().toUpperCase();
  const weatherField = document.getElementById("p_weather");
  if (!weatherField) return;

  const match = inputStr.match(/^[A-Z]{1,2}/);
  if (match) {
    const areaCode = match[0];
    if (WEATHER_LOOKUP[areaCode]) {
      weatherField.value = WEATHER_LOOKUP[areaCode];
    } else {
      weatherField.value = "";
    }
  } else {
    weatherField.value = "";
  }
}

/* ---------- REPEATABLE ROW TABLE BUILDER ---------- */
function makeRowTable(containerId, columns, addLabel){
  const wrap = el("div");
  const table = el("table",{class:"rowtable",id:containerId+"_table"});
  const thead = el("thead");
  const trh = el("tr");
  columns.forEach(c=> trh.appendChild(el("th",{},c.label)));
  trh.appendChild(el("th",{style:"width:30px"},""));
  thead.appendChild(trh);
  table.appendChild(thead);
  const tbody = el("tbody",{id:containerId+"_body"});
  table.appendChild(tbody);
  const scroller = el("div",{class:"table-scroll"});
  scroller.appendChild(table);
  wrap.appendChild(scroller);

  function addRow(){
    const tr = el("tr");
    columns.forEach(c=>{
      const td = el("td");
      let input;
      if(c.type==="select"){
        const opts = c.other && !c.options.includes("Other") ? c.options.concat(["Other"]) : c.options;
        input = selectInput(null, opts, "");
      } else {
        input = textInput(null, c.placeholder||"");
      }
      input.dataset.key = c.key;
      if(c.lookup==="pcdb"){
        // text box + "Find boiler" button that searches the SAP PCDB
        const btn = el("button",{type:"button", class:"lookup-btn", title:"Search the SAP boiler database (PCDB)"},"🔍 Find boiler");
        const hid = el("input",{type:"hidden"}); hid.dataset.key = c.key+"__pcdb";
        btn.addEventListener("click", ()=>{
          let cur = null; try{ cur = hid.value ? JSON.parse(hid.value).rec[0] : null; }catch(e){}
          openPcdbFinder((r,rev)=> pcdbFillRow(tr, c.key, r, rev), cur);
        });
        // typing over a chosen boiler's name detaches it from the PCDB record
        input.addEventListener("input", ()=>{ if(hid.value && input.value!==input.dataset.pcdbText) hid.value = ""; });
        td.appendChild(el("div",{class:"lookup-wrap"}, input, btn, hid));
      } else {
        td.appendChild(input);
      }
      if(c.other){
        // "Other" reveals a small box for the name
        const ot = el("input",{type:"text", class:"other-in", placeholder:"Enter name…", "aria-label":c.label+" – other"});
        ot.dataset.key = c.key+"__other";
        ot.style.display = "none";
        td.appendChild(ot);
        input.addEventListener("change", ()=>{
          const on = input.value==="Other";
          ot.style.display = on ? "" : "none";
          if(on) setTimeout(()=>ot.focus(),0); else ot.value = "";
        });
      }
      tr.appendChild(td);
    });
    // Columns with showIf only appear when another column in the same row has a given value
    columns.forEach(c=>{
      if(!c.showIf) return;
      const dep = tr.querySelector(`[data-key="${c.key}"]`);
      const ctl = tr.querySelector(`[data-key="${c.showIf.key}"]`);
      const sync = ()=>{
        const on = ctl.value===c.showIf.value;
        dep.style.display = on ? "" : "none";
        if(!on) dep.value = "";
      };
      ctl.addEventListener("change", sync);
      sync();
    });
    const delTd = el("td");
    const delBtn = el("button",{class:"del-btn",type:"button",title:"Remove row"},"✕");
    delBtn.onclick = ()=> tr.remove();
    delTd.appendChild(delBtn);
    tr.appendChild(delTd);
    tbody.appendChild(tr);
  }

  const addBtn = el("button",{class:"add-row-btn",type:"button"}, "+ "+addLabel);
  addBtn.onclick = addRow;
  wrap.appendChild(addBtn);

  wrap._addRow = addRow;
  wrap._tbody = tbody;
  wrap._columns = columns;
  return wrap;
}

function readRowTable(wrap){
  const rows = [];
  wrap._tbody.querySelectorAll("tr").forEach(tr=>{
    const obj = {};
    tr.querySelectorAll("input,select").forEach(inp=>{
      obj[inp.dataset.key] = inp.value;
    });
    // merge "Other" free text into its column, e.g. "Other – Stone rubble"
    Object.keys(obj).filter(k=>k.endsWith("__other")).forEach(k=>{
      const base = k.slice(0,-7);
      if(obj[base]==="Other" && obj[k].trim()) obj[base] = "Other – "+obj[k].trim();
      delete obj[k];
    });
    const hasData = Object.values(obj).some(v=>v && v.trim()!=="");
    if(hasData) rows.push(obj);
  });
  return rows;
}

function showLampPhoto(code, desc){
  const info = LAMP_PHOTOS[code] || {};
  const scrim = el("div",{class:"modal-scrim", role:"dialog", "aria-modal":"true", "aria-label":desc});
  const card = el("div",{class:"modal-card lamp-card"});
  const head = el("div",{class:"lamp-card-head"},
    el("div",{}, el("div",{class:"lamp-card-code"},code), el("h3",{},desc)));
  const x = el("button",{type:"button", class:"lamp-card-close", "aria-label":"Close"},"×");
  head.appendChild(x);
  card.appendChild(head);
  const gallery = el("div",{class:"lamp-gallery"});
  for(let n=1; n<=LAMP_PHOTO_COUNT; n++){
    const frame = el("div",{class:"lamp-photo"});
    const status = el("div",{class:"lamp-photo-msg"},"Loading photo…");
    frame.appendChild(status);
    gallery.appendChild(frame);
    if(!info.folder){ status.textContent = "No photo set for this lamp type."; continue; }
    const base = LAMP_PHOTO_DIR + info.folder + "/" + n;
    const img = el("img",{alt:"Reference photo "+n+": "+desc, decoding:"async"});
    let k = 0;
    // try each allowed extension in turn until one exists
    img.addEventListener("error", ()=>{
      k++;
      if(k < LAMP_PHOTO_EXTS.length){ img.src = base+"."+LAMP_PHOTO_EXTS[k]; return; }
      img.remove();
      status.innerHTML = "Photo "+n+" not uploaded yet.<br><span>Expected: <code>"+escapeHtml(base)+".jpg</code></span>";
    });
    img.addEventListener("load", ()=>{
      status.remove(); frame.classList.add("loaded");
      const link = el("a",{href:img.src, target:"_blank", rel:"noopener", title:"Open full size"});
      frame.insertBefore(link, img); link.appendChild(img);
    });
    img.src = base+"."+LAMP_PHOTO_EXTS[0];
    frame.appendChild(img);
  }
  card.appendChild(gallery);
  card.appendChild(el("div",{class:"lamp-hint"},"Tap a photo to open it full size."));
  if(info.tips) card.appendChild(el("p",{class:"lamp-tips"}, el("strong",{},"How to recognise it: "), info.tips));
  scrim.appendChild(card);
  const close = ()=>{ document.removeEventListener("keydown", onKey); scrim.remove(); };
  const onKey = e=>{ if(e.key==="Escape") close(); };
  x.addEventListener("click", close);
  scrim.addEventListener("click", e=>{ if(e.target===scrim) close(); });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(scrim);
  setTimeout(()=> x.focus(), 0);
}

/* ==========================================================================
   PHOTO REFERENCE GUIDE
   Reference photos live in the GitHub repo next to index.html:

     images/Wall/Cavity wall.jpg
     images/Roof/...
     images/HVAC/Fan coil systems.jpg   (a folder named "HAVC" also works)

   The form asks GitHub which files are in each folder, so new photos appear
   automatically: just upload them, no code changes. The file name (without
   .jpg/.png) is shown as the equipment name. Folder lists are cached in the
   browser for 1 hour to stay within GitHub's free API allowance (empty
   folders are not cached, so the first uploads show up straight away).
   ========================================================================== */
const GUIDE_REPO   = "";   // optional "owner/repo"; blank = detect automatically on GitHub Pages
const GUIDE_BRANCH = "";   // optional branch name; blank = repo's default branch
const GUIDE_CACHE_HOURS = 1;
const GUIDE_IMG_EXT = /\.(jpe?g|png|webp)$/i;
const GUIDE_CATS = [
  {id:"Wall",     label:"Walls",             folders:["Wall","Walls"]},
  {id:"Roof",     label:"Roofs",             folders:["Roof","Roofs"]},
  {id:"Floor",    label:"Floors",            folders:["Floor","Floors"]},
  {id:"Window",   label:"Windows & Glazing", folders:["Window","Windows"]},
  {id:"Door",     label:"Doors",             folders:["Door","Doors"]},
  {id:"HVAC",     label:"HVAC Systems",      folders:["HVAC","HAVC"]},
  {id:"HVACCtl",  label:"HVAC Controls",     folders:["hvac control","hvac controls","HVAC Control","HVAC Controls"], exclude:/extract|ventilation/i},
  {id:"DHW",      label:"Hot Water",         folders:["DHW"]},
  {id:"MechVent", label:"Mechanical Ventilation", folders:["mechanical ventilation","Mechanical Ventilation","mech vent"], fuzzy:"ventilation"},
  {id:"LocalExt", label:"Local Extract",     folders:["local extract","Local Extract","local mechanical extract","local mechanical exhaust"], fuzzy:"extract"},
  {id:"Lighting", label:"Lighting",          lighting:true},
  {id:"LightCtl", label:"Lighting Controls", folders:["Lighting Controls","Lighting Control","lighting controls"]}
];
/* Section titles that get a "Photo guide" button, and which category it opens */
const GUIDE_SECTION_MAP = {
  "Wall Construction":"Wall", "Roof Construction":"Roof", "Floor Construction":"Floor",
  "Glazing":"Window", "Doors":"Door", "Schedule of Heating & Cooling Systems":["HVAC","HVACCtl"],
  "Domestic Hot Water":"DHW", "General Lighting Types Identified":"Lighting", "Lighting Controls":"LightCtl",
  "Mechanical Ventilation (AHU)":"MechVent", "Local Mechanical Exhaust":"LocalExt"
};
const GUIDE_BTN_LABEL = {HVAC:"📷 Systems guide", HVACCtl:"📷 Controls guide"};

function guideRepo(){
  if(GUIDE_REPO) return GUIDE_REPO;
  const h = location.hostname;
  if(!/\.github\.io$/i.test(h)) return "";
  const owner = h.split(".")[0];
  const seg = location.pathname.split("/").filter(Boolean)[0];
  return owner + "/" + ((seg && !/\.html?$/i.test(seg)) ? seg : h);
}
function guideLabel(name){ return name.replace(GUIDE_IMG_EXT,"").replace(/\s+/g," ").trim(); }
function guideCacheGet(key){ try{ const v = JSON.parse(localStorage.getItem(key)||"null"); return v && Array.isArray(v.files) ? v : null; }catch(e){ return null; } }
function guideCacheSet(key,v){ try{ localStorage.setItem(key, JSON.stringify(v)); }catch(e){} }
let guideManifest;   // optional images/manifest.json fallback, loaded once

/* Lists the sub-folders of images/ once, so folder names match whatever their
   capitalisation or spacing ("hvac control", "HVAC Control", "HAVC"...) */
let guideDirsPromise = null;
const guideNorm = s => String(s).toLowerCase().replace(/[^a-z0-9]/g,"");
function guideDirs(repo){
  const key = "ndea-guide-v2-dirs:"+repo;
  const c = guideCacheGet(key);
  if(c && Date.now()-c.t < GUIDE_CACHE_HOURS*3600e3) return Promise.resolve(c.files);
  if(!guideDirsPromise){
    guideDirsPromise = fetch(`https://api.github.com/repos/${repo}/contents/images` + (GUIDE_BRANCH ? "?ref="+encodeURIComponent(GUIDE_BRANCH) : ""), {headers:{Accept:"application/vnd.github+json"}})
      .then(r=> r.ok ? r.json() : null)
      .then(items=>{
        if(!Array.isArray(items)) return null;
        const dirs = items.filter(i=>i.type==="dir").map(i=>i.name);
        guideCacheSet(key, {t:Date.now(), files:dirs});
        return dirs;
      })
      .catch(()=> null)
      .finally(()=>{ setTimeout(()=>{ guideDirsPromise = null; }, 0); });
  }
  return guideDirsPromise.then(d=> d || (c ? c.files : null));
}
async function guideList(cat){
  const repo = guideRepo();
  if(repo && !cat._resolved){
    const dirs = await guideDirs(repo);
    if(dirs){
      const wanted = cat.folders.map(guideNorm);
      const hit = dirs.find(d=> wanted.includes(guideNorm(d))) || (cat.fuzzy ? dirs.find(d=> guideNorm(d).includes(cat.fuzzy)) : null);
      if(hit) cat.folders = [hit].concat(cat.folders.filter(f=>f!==hit));
      cat._resolved = true;
    }
  }
  const key = "ndea-guide-v2:"+repo+":"+cat.id;
  const cached = guideCacheGet(key);
  if(cached && Date.now()-cached.t < GUIDE_CACHE_HOURS*3600e3) return cached;

  let apiError = "";
  if(repo){
    for(const folder of cat.folders){
      try{
        const url = `https://api.github.com/repos/${repo}/contents/images/${encodeURIComponent(folder)}` + (GUIDE_BRANCH ? "?ref="+encodeURIComponent(GUIDE_BRANCH) : "");
        const r = await fetch(url, {headers:{Accept:"application/vnd.github+json"}});
        if(r.status===404) continue;
        if(!r.ok){ apiError = r.status===403 ? "GitHub's hourly limit has been reached" : "GitHub returned an error ("+r.status+")"; break; }
        const items = await r.json();
        const files = (Array.isArray(items)?items:[]).filter(i=> i.type==="file" && GUIDE_IMG_EXT.test(i.name) && !(cat.exclude && cat.exclude.test(i.name))).map(i=>i.name);
        const v = {t:Date.now(), folder, files};
        if(files.length) guideCacheSet(key, v);
        return v;
      }catch(e){ apiError = "No connection to GitHub"; break; }
    }
    if(!apiError) return {t:Date.now(), folder:cat.folders[0], files:[]};
  }
  if(cached) return Object.assign({stale:true}, cached);          // use an older list rather than nothing
  if(guideManifest===undefined){
    try{ const r = await fetch("images/manifest.json",{cache:"no-cache"}); guideManifest = r.ok ? await r.json() : null; }catch(e){ guideManifest = null; }
  }
  if(guideManifest){
    for(const folder of cat.folders){
      if(Array.isArray(guideManifest[folder])) return {t:Date.now(), folder, files:guideManifest[folder]};
    }
  }
  throw new Error(repo ? (apiError || "Folder not found") : "The photo guide lists folders through GitHub, so it works once the form is opened from GitHub Pages.");
}

let guideState = {cat:"Wall"};
function openGuide(catId){
  if(catId) guideState.cat = catId;
  const scrim = el("div",{class:"modal-scrim guide-scrim", role:"dialog", "aria-modal":"true", "aria-label":"Photo reference guide"});
  const card = el("div",{class:"modal-card guide-card"});
  const closeBtn = el("button",{type:"button", class:"lamp-card-close", "aria-label":"Close"},"×");
  card.appendChild(el("div",{class:"guide-top"},
    el("div",{}, el("div",{class:"guide-kicker"},"Site reference"), el("h3",{},"Photo Reference Guide")), closeBtn));
  const tabs = el("div",{class:"guide-tabs", role:"tablist"});
  const view = el("div",{class:"guide-view"});
  card.appendChild(tabs); card.appendChild(view);
  scrim.appendChild(card);

  let onKey;
  const close = ()=>{ document.removeEventListener("keydown", onKey); scrim.remove(); };
  closeBtn.addEventListener("click", close);
  scrim.addEventListener("click", e=>{ if(e.target===scrim) close(); });

  let viewer = null;   // {files, idx, base, cat}
  onKey = e=>{
    if(document.querySelector(".lamp-card")) return;     // lighting pop-up open on top
    if(e.key==="Escape"){ if(viewer){ viewer=null; renderGrid(); } else close(); }
    if(viewer && e.key==="ArrowRight") step(1);
    if(viewer && e.key==="ArrowLeft") step(-1);
  };
  document.addEventListener("keydown", onKey);

  const drawTabs = ()=>{
    tabs.innerHTML = "";
    GUIDE_CATS.forEach(c=>{
      const b = el("button",{type:"button", class:"guide-tab"+(c.id===guideState.cat?" active":""), role:"tab", "aria-selected":String(c.id===guideState.cat)}, c.label);
      b.addEventListener("click", ()=>{ guideState.cat = c.id; viewer = null; drawTabs(); renderGrid(); });
      tabs.appendChild(b);
    });
    const act = tabs.querySelector(".active"); if(act && act.scrollIntoView) act.scrollIntoView({block:"nearest", inline:"center"});
  };

  async function renderGrid(){
    const cat = GUIDE_CATS.find(c=>c.id===guideState.cat) || GUIDE_CATS[0];
    view.innerHTML = "";
    if(cat.lighting){
      view.appendChild(el("p",{class:"guide-intro"},"Tap a lamp type to see its two reference photos and identification tips, then use the arrows to move between lamp types."));
      const grid = el("div",{class:"guide-grid"});
      // one step per lamp type, showing both of its photos together
      const items = [];
      LAMP_TYPES.filter(([c])=> LAMP_PHOTOS[c]).forEach(([code,desc])=>{
        const info = LAMP_PHOTOS[code], idx = items.length;
        const photos = [];
        for(let n=1; n<=LAMP_PHOTO_COUNT; n++){
          const base = LAMP_PHOTO_DIR + info.folder + "/" + n;
          photos.push({srcs:LAMP_PHOTO_EXTS.map(e=> base+"."+e), missing:base+".jpg", alt:desc+" – photo "+n});
        }
        items.push({title:code+" – "+desc, photos, tips:info.tips});
        const t = el("button",{type:"button", class:"guide-tile"}, el("span",{class:"guide-tile-tag"},code), el("span",{class:"guide-tile-name"},desc));
        t.addEventListener("click", ()=>{ viewer = {items, idx, cat}; renderViewer(); });
        grid.appendChild(t);
      });
      view.appendChild(grid);
      return;
    }
    view.appendChild(el("div",{class:"guide-msg"},"Loading photos…"));
    let res;
    try{ res = await guideList(cat); }
    catch(err){
      if(guideState.cat!==cat.id) return;
      view.innerHTML = "";
      view.appendChild(el("div",{class:"guide-msg"}, "Couldn't load the "+cat.label.toLowerCase()+" photos.", el("br"), el("span",{}, err.message)));
      return;
    }
    if(guideState.cat!==cat.id || viewer) return;        // user moved on while loading
    view.innerHTML = "";
    const files = res.files.filter(f=> !(cat.exclude && cat.exclude.test(f))).sort((a,b)=> guideLabel(a).localeCompare(guideLabel(b), "en", {numeric:true, sensitivity:"base"}));
    const base = "images/"+encodeURIComponent(res.folder)+"/";
    if(!files.length){
      view.appendChild(el("div",{class:"guide-msg"}, "No photos uploaded yet.", el("br"), el("span",{}, "Add images to ", el("code",{},"images/"+cat.folders[0]+"/"), " in the repo.")));
      return;
    }
    const bar = el("div",{class:"guide-bar"}, el("span",{class:"guide-count"}, files.length+" photo"+(files.length===1?"":"s")));
    let search = null;
    if(files.length > 8){
      search = el("input",{type:"search", class:"guide-search", placeholder:"Filter "+cat.label.toLowerCase()+"…", "aria-label":"Filter"});
      bar.appendChild(search);
    }
    view.appendChild(bar);
    if(res.stale) view.appendChild(el("div",{class:"guide-note"},"Showing a saved list – recently added photos may be missing."));
    const grid = el("div",{class:"guide-grid"});
    files.forEach((f,i)=>{
      const t = el("button",{type:"button", class:"guide-tile", "data-name":guideLabel(f).toLowerCase()},
        el("span",{class:"guide-tile-name"}, guideLabel(f)), el("span",{class:"guide-tile-view","aria-hidden":"true"},"View ›"));
      t.addEventListener("click", ()=>{ viewer = {items: files.map(f=>({title:guideLabel(f), srcs:[base+encodeURIComponent(f)]})), idx:i, cat}; renderViewer(); });
      grid.appendChild(t);
    });
    view.appendChild(grid);
    if(search){
      const empty = el("div",{class:"guide-msg", style:"display:none;"},"Nothing matches that filter.");
      view.appendChild(empty);
      search.addEventListener("input", ()=>{
        const q = search.value.trim().toLowerCase(); let shown = 0;
        grid.querySelectorAll(".guide-tile").forEach(t=>{ const on = !q || t.dataset.name.includes(q); t.style.display = on ? "" : "none"; if(on) shown++; });
        empty.style.display = shown ? "none" : "";
      });
    }
  }

  function step(d){
    if(!viewer) return;
    viewer.idx = (viewer.idx + d + viewer.items.length) % viewer.items.length;
    renderViewer();
  }
  function renderViewer(){
    const {items, idx, cat} = viewer;
    const it = items[idx];
    view.innerHTML = "";
    const back = el("button",{type:"button", class:"guide-back"},"‹ All "+cat.label.toLowerCase());
    back.addEventListener("click", ()=>{ viewer = null; renderGrid(); });
    view.appendChild(el("div",{class:"guide-vhead"}, back, el("span",{class:"guide-count"}, (idx+1)+" of "+items.length)));
    view.appendChild(el("h4",{class:"guide-vtitle"}, it.title, it.tag ? el("span",{class:"guide-vtag"}, it.tag) : null));
    // one photo frame; tries each file type in turn
    const makeFrame = (p)=>{
      const frame = el("div",{class:"guide-photo"});
      const msg = el("div",{class:"lamp-photo-msg"},"Loading photo…");
      const img = el("img",{alt:p.alt||it.title, decoding:"async"});
      const link = el("a",{target:"_blank", rel:"noopener", title:"Open full size"}, img);
      let k = 0;
      img.addEventListener("load", ()=>{ msg.remove(); frame.classList.add("loaded"); link.href = img.src; });
      img.addEventListener("error", ()=>{
        k++;
        if(k < p.srcs.length){ img.src = p.srcs[k]; return; }
        img.remove();
        msg.innerHTML = "Photo not available yet.<br><span>"+escapeHtml(decodeURIComponent(p.missing || p.srcs[0]))+"</span>";
      });
      frame.appendChild(msg); frame.appendChild(link);
      img.src = p.srcs[0];
      return frame;
    };
    const photos = it.photos || [{srcs:it.srcs, missing:it.missing, alt:it.title}];
    const stage = el("div",{class:"guide-stage"+(photos.length>1?" pair":"")});
    photos.forEach(p=> stage.appendChild(makeFrame(p)));
    if(items.length > 1){
      const prev = el("button",{type:"button", class:"guide-nav prev", "aria-label":"Previous"},"‹");
      const next = el("button",{type:"button", class:"guide-nav next", "aria-label":"Next"},"›");
      prev.addEventListener("click", ()=> step(-1));
      next.addEventListener("click", ()=> step(1));
      stage.appendChild(prev); stage.appendChild(next);
      // swipe on phones
      let x0 = null;
      stage.addEventListener("touchstart", e=>{ x0 = e.touches[0].clientX; }, {passive:true});
      stage.addEventListener("touchend", e=>{ if(x0===null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if(Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); });
      // warm the cache for the next step
      const nx = items[(idx+1)%items.length];
      (nx.photos || [nx]).forEach(p=>{ const pre = new Image(); pre.src = p.srcs[0]; });
    }
    view.appendChild(stage);
    if(it.tips) view.appendChild(el("p",{class:"lamp-tips guide-tips"}, el("strong",{},"How to recognise it: "), it.tips));
    view.appendChild(el("div",{class:"lamp-hint"}, (items.length>1 ? "Use the arrows (or swipe, or the ← → keys) to move "+(it.photos?"between lamp types":"between photos")+". " : "")+"Tap a photo to open it full size."));
  }

  drawTabs();
  renderGrid();
  document.body.appendChild(scrim);
  setTimeout(()=> closeBtn.focus(), 0);
}
